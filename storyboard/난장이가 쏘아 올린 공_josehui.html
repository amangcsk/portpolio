  <script>
    const SCENES = [{"id": 1, "sub": "낙원구 행복동", "title": "이름은 낙원과 행복, 그러나 가난한 동네", "quote": "이름은 가장 환했지만, 그곳은 가장 그늘진 동네였다", "text": "이야기는 서울 한구석, '낙원구 행복동'이라는 동네에서 시작됩니다. 이름만 들으면 더없이 밝고 좋은 곳 같지만, 실제로는 판잣집들이 촘촘히 들어선 가난한 동네였습니다. 이곳에 한 가족이 살고 있었습니다. 아버지는 몸집이 몹시 작은 난장이였고, 어머니와 세 남매 영수, 영호, 영희가 좁은 집에서 함께 지냈습니다. 넉넉하지 않았지만, 가족은 서로를 아끼며 하루하루를 버텨 나갔습니다. 작가는 이 가난한 동네의 모습을 통해, 화려하게 성장하던 1970년대 한국 사회의 그늘진 뒷모습을 조용히 비추기 시작합니다."}, {"id": 2, "sub": "아버지의 고단한 하루", "title": "칼을 갈고, 수도를 고치는 사람", "quote": "작은 몸으로, 남들이 하지 않는 궂은일을 떠맡았다", "text": "난장이 아버지는 몸이 작아 남들처럼 힘센 일을 하기 어려웠습니다. 그래서 그는 칼을 갈아 주거나, 망가진 수도와 펌프를 고쳐 주는 일로 하루하루 돈을 벌었습니다. 작은 몸으로 이집 저집을 돌아다니며 궂은일을 도맡아 하는 그를, 동네 사람들은 가엾게 여기기도 하고 때로는 무시하기도 했습니다. 그러나 아버지는 늘 성실했고, 가족을 먹여살리기 위해 한 번도 일을 거르지 않았습니다. 몸집은 작았지만, 가족을 향한 그의 마음과 책임감은 누구보다 크고 단단했습니다."}, {"id": 3, "sub": "아버지의 오래된 꿈", "title": "달나라로 가고 싶은 사람", "quote": "이 세상이 너무 작고 답답해서, 마음은 늘 달을 향했다", "text": "난장이 아버지에게는 아주 오래된 꿈이 있었습니다. 그는 종종 달나라에 가는 상상을 하곤 했습니다. 몸이 작다는 이유로 평생 사람들의 시선을 받으며 살아온 그에게, 이 땅은 때때로 너무 좁고 답답한 곳이었습니다. 그는 작은 종이 조각이나 공 같은 것을 하늘로 쏘아올리며, 마치 그것이 달까지 날아가 주기를 바라는 듯했습니다. 이 소박하고 쓸쓸한 행동은 그의 간절한 꿈을 보여 주는 장면이었습니다. 현실에서는 이룰 수 없는 꿈이었지만, 그 꿈 덕분에 그는 고단한 하루하루를 견뎌 낼 수 있었습니다."}, {"id": 4, "sub": "세 남매 영수, 영호, 영희", "title": "가난 속에서도 서로를 의지하다", "quote": "가진 것은 적어도, 서로를 향한 마음만은 넉넉했다", "text": "난장이 아버지와 어머니에게는 세 자녀가 있었습니다. 맏아들 영수는 책임감이 강하고 생각이 깊은 청년이었습니다. 둘째 영호는 형과 함께 집안을 돕고자 애썼고, 막내딸 영희는 또래보다 야무지고 똑똑한 아이였습니다. 집은 늘 가난했고 끼니를 걱정해야 하는 날도 많았지만, 이 세 남매는 서로를 아끼고 의지하며 자랐습니다. 부모가 힘들게 일하는 모습을 보며, 이들은 어린 나이에도 가족을 위해 무엇이든 하려는 마음을 품고 있었습니다. 이 가족의 끈끈한 사랑이, 앞으로 닥쳐올 모진 시련 속에서도 이야기를 지탱하는 힘이 됩니다."}, {"id": 5, "sub": "어느 날 날아온 계고장", "title": "행복동에 떨어진 철거 통지서", "quote": "살던 집을, 어느 날 종이 한 장이 빼앗으려 했다", "text": "평온하던 어느 날, 행복동에 날벼락 같은 소식이 전해집니다. 동네 전체를 철거하고 그 자리에 새 아파트를 짓겠다는 계고장이 집집마다 날아든 것입니다. 대신 이 집에는 새로 지어질 아파트에 들어갈 수 있는 권리, 즉 '입주권'이라는 종이 한 장이 주어졌습니다. 하지만 그 아파트에 실제로 들어가 살기 위해서는, 가난한 이 집안이 감당할 수 없는 큰돈을 더 내야 했습니다. 평생 모은 보금자리를 하루아침에 내놓아야 하는 상황 앞에서, 난장이 가족은 물론 동네 사람들 모두가 큰 혼란과 슬픔에 빠지게 되었습니다."}, {"id": 6, "sub": "동네에 나타난 투기꾼들", "title": "입주권을 싼값에 사려는 사람들", "quote": "가난한 사람의 다급함을, 돈벌이 기회로 보는 사람들도 있었다", "text": "철거 소식이 퍼지자, 동네에는 낯선 사람들이 하나둘 나타나기 시작했습니다. 이들은 입주권을 당장 현금으로 바꿔 주겠다며 집집마다 돌아다녔습니다. 큰돈을 낼 여유가 없는 가난한 사람들에게는, 비록 헐값이라도 당장 손에 돈을 쥘 수 있다는 것이 큰 유혹이었습니다. 이 투기꾼들은 이렇게 싼값에 사들인 입주권을, 나중에 완성된 아파트와 함께 훨씬 비싼 값으로 되팔아 막대한 이익을 챙기려 했습니다. 가난한 사람들의 다급한 처지를 이용해 돈을 벌려는 이들의 모습은, 당시 급격한 도시 개발 속에서 벌어지던 또 다른 불공평함을 보여 주었습니다."}, {"id": 7, "sub": "가족의 고민", "title": "입주권을 팔아야 할까, 지켜야 할까", "quote": "먼 미래의 집보다, 당장의 밥이 더 급했다", "text": "난장이 가족도 이 입주권을 손에 쥐게 되었습니다. 하지만 아파트가 완성될 때까지 버틸 돈도, 입주할 때 내야 할 추가 비용도 가족에게는 없었습니다. 당장 먹고살 돈조차 빠듯한 형편에, 몇 년 뒤에 들어갈 수 있을지도 모르는 아파트를 기다리는 것은 너무나 먼 이야기처럼 느껴졌습니다. 가족은 밤늦도록 이 문제를 두고 고민을 나누었습니다. 입주권을 지켜서 새집에 대한 희망을 품을 것인지, 아니면 당장의 생활비를 위해 그것을 팔아 버릴 것인지, 어느 쪽도 쉽지 않은 선택이었습니다. 가난은 이렇게 사람에게 모진 결정을 강요하고 있었습니다."}, {"id": 8, "sub": "결국 헐값에 팔려 간 입주권", "title": "당장의 생계를 위한 눈물겨운 선택", "quote": "미래의 희망을 팔아, 오늘의 끼니를 샀다", "text": "결국 난장이 가족은 입주권을 투기꾼에게 헐값에 넘기기로 했습니다. 몇 년 뒤 새 아파트에 들어가 산다는 희망보다, 당장 가족이 먹고살아야 한다는 현실이 더 급했기 때문입니다. 가족은 적은 돈을 손에 쥐었지만, 그것으로는 앞으로의 삶을 길게 꾸려 나가기 턱없이 부족했습니다. 투기꾼은 이렇게 사들인 입주권을 모아, 훗날 완성된 아파트와 함께 몇 배나 비싼 값으로 되팔 계획이었습니다. 땀흘려 일하는 사람들의 보금자리가, 아무 땀도 흘리지 않은 사람의 손에서 큰 이익으로 둔갑하는 모습이었습니다. 이것이 당시 재개발 현장에서 흔히 벌어지던 불공평한 거래였습니다."}, {"id": 9, "sub": "집이 무너지는 날", "title": "포클레인이 지나간 자리", "quote": "평생을 쌓아 온 보금자리가, 한나절 만에 무너져 내렸다", "text": "얼마 뒤, 행복동에는 커다란 포클레인이 들어왔습니다. 가족이 오랫동안 살아온 작은 집은, 단 몇 시간 만에 흔적도 없이 허물어졌습니다. 벽돌과 나무 조각이 흩어진 자리에 서서, 가족은 말없이 그 광경을 바라보았습니다. 평생 모은 살림살이와 추억이 담긴 공간이 이렇게 순식간에 사라지는 모습을, 그들은 그저 지켜볼 수밖에 없었습니다. 이제 가족은 머물 곳을 찾아 흩어지듯 떠나야 했습니다. 도시가 새롭고 번듯하게 바뀌어 가는 그 뒤편에서, 가장 약한 사람들의 삶이 가장 먼저, 가장 크게 흔들리고 있었습니다."}, {"id": 10, "sub": "영수, 공장에 취직하다", "title": "기계 소리 가득한 공장의 하루", "quote": "기계는 쉬지 않았고, 사람도 쉴 틈이 없었다", "text": "집을 잃은 뒤, 맏아들 영수는 가족을 위해 큰 공장에 취직했습니다. 그곳은 거대한 기계 소리가 끊이지 않는 곳이었습니다. 노동자들은 아침부터 밤까지 좁은 작업장에서 쉴 틈 없이 일했고, 작업 환경은 몹시 열악했습니다. 적은 임금을 받으며 긴 시간 동안 힘겹게 일해야 했지만, 공장을 소유한 사람들은 그와는 전혀 다른 풍요로운 삶을 누리고 있었습니다. 영수는 날마다 그 커다란 차이를 몸으로 느끼며, 세상이 공평하지 않다는 사실을 하나씩 깨닫기 시작했습니다. 이것은 그가 앞으로 겪게 될 더 큰 갈등의 시작이었습니다."}, {"id": 11, "sub": "영호도 공장 노동자가 되다", "title": "형제가 함께 짊어진 노동의 무게", "quote": "형제는 같은 공장에서, 같은 설움을 나눠 짊어졌다", "text": "둘째 영호 역시 형 영수를 따라 같은 공장에서 일하게 되었습니다. 형제는 매일 같은 시간에 출근해 같은 소음 속에서 손을 바쁘게 움직였습니다. 두 사람은 가족을 먹여살리기 위해 몸이 부서질 듯 힘든 노동을 견뎌 냈습니다. 그러나 아무리 열심히 일해도, 두 사람의 생활은 크게 나아지지 않았습니다. 공장에서 벌어들이는 막대한 이익은 극히 일부 사람들에게만 돌아갔고, 실제로 땀 흘려 일하는 노동자들의 몫은 늘 적었습니다. 영호는 형과 함께 이 부당한 현실을 몸으로 겪으며, 마음속에 조용히 분노와 의문을 쌓아 가고 있었습니다."}, {"id": 12, "sub": "영희, 투기꾼을 뒤쫓다", "title": "빼앗긴 입주권을 되찾기 위해", "quote": "잃어버린 것을 되찾기 위해, 영희는 스스로 위험한 길로 들어섰다", "text": "막내딸 영희는 가족이 헐값에 넘긴 입주권을 포기하지 않았습니다. 그녀는 그 문서를 손에 넣고 간 투기꾼을 몰래 뒤쫓기 시작했습니다. 어린 나이였지만 영희는 가족을 위해 무엇이든 해내겠다는 각오가 있었습니다. 그녀는 투기꾼의 집까지 따라가, 그의 곁에 머물며 기회를 엿보았습니다. 이것은 결코 쉬운 선택이 아니었습니다. 가족을 지키기 위해 스스로 위험하고 고통스러운 길로 들어선 영희의 모습에는, 가난이 한 소녀에게 떠안긴 가혹한 무게가 고스란히 담겨 있었습니다."}, {"id": 13, "sub": "서류를 찾아낸 밤", "title": "영희, 마침내 증서를 손에 넣다", "quote": "오랜 기다림 끝에, 영희는 그 서류를 품에 넣었다", "text": "오랜 시간을 기다린 끝에, 영희는 투기꾼의 집에서 가족의 입주권 서류와 돈을 몰래 찾아낼 기회를 얻었습니다. 그녀는 떨리는 손으로 서류를 챙기고, 그 집을 조용히 빠져나왔습니다. 가족에게 돌아갈 수 있는 단 하나의 끈을 되찾은 순간이었습니다. 하지만 그 서류를 되찾기까지 영희가 견뎌야 했던 시간들은, 결코 가볍게 넘길 수 없는 아픔으로 남았습니다. 그녀는 이제 이 서류를 들고 가족에게 돌아가려 했지만, 정작 집으로 가는 길 위에서 전혀 예상하지 못한 소식을 듣게 됩니다."}, {"id": 14, "sub": "집으로 돌아가는 길", "title": "되찾은 서류, 그러나 무거운 마음", "quote": "손에 쥔 것은 서류였지만, 마음은 내내 불안했다", "text": "서류를 품에 안고 집으로 향하는 영희의 발걸음은 가볍지 않았습니다. 가족을 위해 스스로를 희생한 지난 시간들이 머릿속을 떠나지 않았습니다. 그녀는 이 서류가 가족에게 조금이나마 다시 일어설 힘이 되어 주기를 간절히 바랐습니다. 그러나 한편으로는, 이렇게까지 해야 했던 자신의 처지와 가족의 현실이 너무도 서글프게 느껴졌습니다. 가난이라는 것이 한 가족에게, 그리고 그 가족의 가장 어린 딸에게 얼마나 많은 것을 강요할 수 있는지, 영희는 그 길 위에서 뼈저리게 느끼고 있었습니다."}, {"id": 15, "sub": "벽돌 공장의 굴뚝", "title": "아버지, 높은 굴뚝 위에 오르다", "quote": "그는 세상에서 가장 높은 곳에 올라, 가장 먼 곳을 바라보았다", "text": "그 무렵, 난장이 아버지는 어느 벽돌 공장의 높은 굴뚝 위에 올랐습니다. 집을 잃고, 가족이 뿔뿔이 흩어지듯 살아가야 하는 현실 앞에서, 그는 깊은 절망과 고단함에 짓눌려 있었습니다. 평생 몸이 작다는 이유로 세상의 차가운 시선을 견뎌 왔고, 이제는 가족을 지킬 힘조차 남아 있지 않다고 느꼈습니다. 그는 늘 그랬듯, 높은 곳에 올라 먼 하늘을 바라보았습니다. 땅 위의 삶이 너무 버거울 때, 그는 언제나 그렇게 하늘을, 그리고 달을 바라보는 사람이었습니다."}, {"id": 16, "sub": "하늘로 쏘아올린 작은 공", "title": "달을 향해 던진 마지막 꿈", "quote": "작은 공 하나가, 그의 모든 꿈을 담아 하늘로 날아갔다", "text": "굴뚝 위에서, 난장이 아버지는 작은 공 하나를 하늘 높이 쏘아올렸습니다. 이 소박한 행동에는 그의 평생에 걸친 꿈이 담겨 있었습니다. 몸이 작아 늘 사람들의 시선 아래 놓여야 했던 그가, 이 땅에서는 끝내 이루지 못한 자유와 평등을 향한 바람을 그 작은 공에 실어 보낸 것입니다. 작은 공은 잠시 하늘 위로 떠올랐다가, 다시 땅으로 떨어졌습니다. 그의 꿈처럼, 결국 이 현실 속에서는 멀리 날아갈 수 없었던 것입니다. 이 장면은 소설 전체를 상징하는, 가장 가슴 아픈 순간으로 남았습니다."}, {"id": 17, "sub": "가족에게 닥친 비극", "title": "돌아오지 않는 아버지", "quote": "가족이 기다린 것은 아버지였지만, 끝내 돌아오지 못했다", "text": "그날 이후, 난장이 아버지는 다시 집으로 돌아오지 않았습니다. 가족은 그가 세상을 떠났다는 사실을 뒤늦게 전해 듣게 됩니다. 평생 작은 몸으로 묵묵히 가족을 지켜 왔던 그가, 결국 이 가혹한 세상 속에서 자신의 자리를 찾지 못한 채 떠나고 만 것입니다. 어머니와 세 남매에게 이 소식은 감당하기 힘든 슬픔이었습니다. 집을 잃고, 이제 아버지마저 잃은 가족은 깊은 상실감 속에 빠져들었습니다. 이 비극은 단지 한 가족의 불행만이 아니라, 당시 가난한 이들이 짊어져야 했던 무게를 상징적으로 보여 주는 사건이었습니다."}, {"id": 18, "sub": "영희, 슬픈 소식을 듣다", "title": "되찾은 서류와 함께 돌아온 비보", "quote": "되찾은 것은 서류였지만, 가족을 지켜 줄 아버지는 이미 없었다", "text": "가족의 입주권 서류를 품에 안고 돌아온 영희는, 그제서야 아버지의 비극적인 소식을 전해 듣게 되었습니다. 그녀가 그토록 애써 되찾아 온 서류는, 이제 가족이 다시 일어설 작은 발판이 될 수는 있었지만, 아버지를 되살릴 수는 없었습니다. 영희는 깊은 슬픔과 허망함에 빠졌습니다. 가족을 지키기 위해 스스로 견뎌 온 모든 시간들이, 결국 가장 지키고 싶었던 아버지를 지키지는 못했다는 사실 앞에서 무너져 내렸습니다. 가족은 이제 아버지 없이, 남은 서로를 의지하며 살아가야 하는 처지에 놓이게 되었습니다."}, {"id": 19, "sub": "은강그룹 공장의 풍경", "title": "노동자와 사용자 사이의 깊은 벽", "quote": "같은 공장 안에서도, 두 세계는 서로 너무 멀리 떨어져 있었다", "text": "아버지를 잃은 뒤, 영수와 영호는 더욱 절실하게 공장 일에 매달려야 했습니다. 이들이 일하는 은강그룹의 공장은 거대한 규모를 자랑했지만, 그 안에는 눈에 보이지 않는 깊은 벽이 있었습니다. 공장을 소유한 사람들은 넓고 쾌적한 사무실에서 풍요로운 삶을 누렸지만, 실제로 손발을 움직여 물건을 만들어 내는 노동자들은 비좁고 숨 막히는 작업장에서 하루하루를 버텨야 했습니다. 같은 공장 안에서 일하면서도, 두 사람이 누리는 삶은 전혀 다른 세계에 속해 있는 것처럼 보였습니다. 이 불공평한 구조는 날이 갈수록 영수의 마음을 더 무겁게 짓눌렀습니다."}, {"id": 20, "sub": "쌓여 가는 분노", "title": "영수, 참을 수 없는 현실을 마주하다", "quote": "견딜 수 있는 데에도, 끝이 있는 법이었다", "text": "영수는 공장에서 겪는 부당한 처우를 하루하루 몸으로 겪으며 살아갔습니다. 아무리 열심히 일해도 노동자들의 형편은 나아지지 않았고, 반면 공장을 소유한 가족은 점점 더 큰 부를 쌓아 갔습니다. 아버지를 그렇게 보낸 뒤, 영수의 마음속에는 이 불공평한 현실에 대한 분노가 점점 깊어지고 있었습니다. 그는 노동자들이 아무리 성실하게 일해도 가난에서 벗어나기 어려운 구조, 그리고 그 구조를 당연하게 여기는 사람들의 태도에 깊은 절망을 느꼈습니다. 쌓이고 쌓인 설움과 분노는, 어느 순간 그의 안에서 더는 참기 어려운 지점까지 차오르고 있었습니다."}, {"id": 21, "sub": "노동자들의 작은 목소리", "title": "바꾸려 애썼지만, 쉽지 않았던 현실", "quote": "목소리를 내려 해도, 돌아오는 것은 차가운 벽뿐이었다", "text": "영수와 동료 노동자들은 더 나은 근무 환경과 정당한 대우를 요구하며 목소리를 내보려 했습니다. 그러나 거대한 공장과 그 뒤에 있는 힘 있는 사람들 앞에서, 노동자 개개인의 목소리는 쉽게 묻혀 버리곤 했습니다. 작은 변화를 이끌어 내려는 노력들은 번번이 외면당하거나, 오히려 노동자들에게 불이익으로 돌아오기도 했습니다. 영수는 이러한 과정을 겪으며, 정당한 방법으로는 이 깊은 불공평을 바꾸기가 얼마나 어려운지를 뼈저리게 느꼈습니다. 이 좌절감은 그의 마음속에서 서서히 위험한 방향으로 자라나고 있었습니다."}, {"id": 22, "sub": "돌이킬 수 없는 순간", "title": "영수, 벼랑 끝에서 벗어난 행동을 하다", "quote": "오랜 설움이 한순간에 터져 버린, 돌이킬 수 없는 순간", "text": "쌓이고 쌓인 분노와 좌절은 결국 영수를 돌이킬 수 없는 길로 이끌었습니다. 공장을 둘러싼 불공평한 현실과, 그 안에서 거듭 겪은 무력감에 짓눌린 그는, 순간적인 충동 속에서 공장주 집안의 한 사람을 향해 극단적인 행동을 저지르고 말았습니다. 이것은 결코 정당화될 수 없는 행동이었지만, 동시에 그를 그 지점까지 내몬 사회의 뿌리 깊은 불공평을 돌아보게 만드는 사건이었습니다. 작가는 이 비극적인 장면을 통해, 가난과 불평등이 극한까지 쌓였을 때 한 사람의 삶을 얼마나 무너뜨릴 수 있는지를 무겁게 그려 냈습니다."}, {"id": 23, "sub": "사건 이후", "title": "영수에게 닥친 무거운 운명", "quote": "한순간의 행동이, 그의 남은 삶 전체를 뒤바꾸어 놓았다", "text": "그 사건 이후, 영수는 법의 심판을 받는 처지에 놓이게 되었습니다. 그가 짊어지게 된 무거운 운명은, 그를 아끼던 가족과 동료들 모두에게 깊은 슬픔을 남겼습니다. 어머니와 영호, 영희는 이제 아버지도 없이, 큰오빠마저 그렇게 떠나보내야 하는 처지에 놓이게 되었습니다. 작가는 이 마지막 장면을 통해 묻습니다. 한 개인의 잘못만으로 이 비극을 설명할 수 있을까요, 아니면 그를 그 자리까지 몰아넣은 사회의 구조에도 책임이 있는 것은 아닐까요. 소설은 이 질문을 독자들에게 조용히, 그러나 묵직하게 남겨 둡니다."}, {"id": 24, "sub": "이야기를 마치며", "title": "사라진 꿈들을 기억하며", "quote": "작은 공은 멀리 날아가지 못했지만, 그 꿈은 오래도록 기억되었다", "text": "난장이 아버지가 쏘아올린 작은 공은 끝내 달에 닿지 못하고 땅으로 떨어졌습니다. 그러나 그 작은 공이 담고 있던 꿈, 즉 누구나 차별받지 않고 떳떳하게 살아갈 수 있는 세상에 대한 바람은 소설이 끝난 뒤에도 오래도록 독자들의 마음에 남았습니다. 작가 조세희는 이 가난한 가족의 이야기를 통해, 눈부시게 성장하던 시대의 그늘 속에서 소외되었던 사람들의 삶을 세상에 알리고자 했습니다. 지금 이 시대를 살아가는 우리에게도, 이 이야기는 여전히 묻고 있습니다. 우리 곁의 작은 공들은, 지금 어디를 향해 날아가고 있는지를 말입니다."}];

    SCENES.forEach(s => s.imgData = IMAGES_B64[s.id] || "");

    let currentIndex = 0;
    let currentMode = 'book';
    let synth = window.speechSynthesis;
    let isSpeaking = false;

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('bookView').style.display = mode === 'book' ? 'block' : 'none';
      document.getElementById('galleryView').style.display = mode === 'gallery' ? 'flex' : 'none';
      document.getElementById('btnModeBook').classList.toggle('active', mode === 'book');
      document.getElementById('btnModeGallery').classList.toggle('active', mode === 'gallery');
      if (mode === 'book') renderBookSpread(currentIndex);
      else synth.cancel();
    }

    function renderBookSpread(idx) {
      if (idx < 0 || idx >= SCENES.length) return;
      currentIndex = idx;
      const s = SCENES[idx];
      document.getElementById('bookImg').src = s.imgData;
      document.getElementById('artFrame').classList.toggle('right', idx % 2 === 1);
      document.getElementById('bookSceneNum').textContent = `SCENE ${String(s.id).padStart(2, '0')} / ${SCENES.length}`;
      document.getElementById('bookSub').textContent = s.sub;
      document.getElementById('bookTitle').textContent = s.title;
      document.getElementById('bookQuote').textContent = `"${s.quote}"`;
      document.getElementById('bookText').textContent = s.text;
      document.getElementById('bookPageIndicator').textContent = `${s.id} / ${SCENES.length} 페이지`;
      document.getElementById('sceneSlider').value = s.id;
      synth.cancel();
    }

    function prevScene() { if (currentIndex > 0) renderBookSpread(currentIndex - 1); }
    function nextScene() { if (currentIndex < SCENES.length - 1) renderBookSpread(currentIndex + 1); }
    function onSliderChange(val) { renderBookSpread(parseInt(val) - 1); }

    function buildGallery() {
      const container = document.getElementById('galleryView');
      container.innerHTML = '';
      SCENES.forEach(s => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <div class="gallery-art" onclick="openLightboxImg('${s.imgData}')">
            <img src="${s.imgData}" alt="${s.title}" loading="lazy">
          </div>
          <div class="gallery-content">
            <div class="gallery-meta"><span class="gallery-num">SCENE ${String(s.id).padStart(2, '0')}</span></div>
            <h2 class="gallery-title">${s.title}</h2>
            <div class="gallery-quote">"${s.quote}"</div>
            <p class="gallery-text">${s.text}</p>
          </div>`;
        container.appendChild(card);
      });
    }

    function openLightboxCurrent() { openLightboxImg(SCENES[currentIndex].imgData); }
    function openLightboxImg(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

    function toggleTtsCurrent() {
      if (isSpeaking) { synth.cancel(); isSpeaking = false; }
      else {
        const utter = new SpeechSynthesisUtterance(SCENES[currentIndex].title + ". " + SCENES[currentIndex].text);
        utter.lang = 'ko-KR'; utter.rate = 0.92;
        utter.onend = () => { isSpeaking = false; };
        synth.speak(utter);
        isSpeaking = true;
      }
    }

    let audioCtx = null, isMusicPlaying = false, musicTimer = null;
    function toggleMusic() {
      if (isMusicPlaying) {
        isMusicPlaying = false;
        clearTimeout(musicTimer);
        document.getElementById('btnMusic').classList.remove('playing');
      } else {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isMusicPlaying = true;
        document.getElementById('btnMusic').classList.add('playing');
        const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        let idx = 0;
        function play() {
          if (!isMusicPlaying) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(notes[idx % notes.length], audioCtx.currentTime);
          idx++;
          gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 1.9);
          musicTimer = setTimeout(play, 900);
        }
        play();
      }
    }

    window.onload = () => { renderBookSpread(0); buildGallery(); };
  </script>
</body>
</html>
