<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카프카의 <변신> - 인터랙티브 스토리북</title>
    <style>
        :root {
            --bg-color: #121316;
            --card-bg: #1e2025;
            --accent-color: #d4a373;
            --accent-hover: #faedcd;
            --text-main: #e9ecef;
            --text-sub: #adb5bd;
            --border-color: #2c3038;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(24, 26, 31, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: #262930;
        }

        button.active {
            background-color: var(--accent-color);
            color: #121316;
            font-weight: 700;
            border-color: var(--accent-color);
        }

        main {
            flex: 1;
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px 80px;
        }

        /* 뷰어 모드 스타일 */
        .viewer-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 36px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            align-items: center;
        }

        .image-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #15161a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #343a40;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-fallback-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #ced4da;
            border: 1px solid #495057;
        }

        .content-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .scene-badge {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scene-title {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.3;
            color: #fff;
        }

        .scene-quote {
            font-style: italic;
            color: #d1b89d;
            background: rgba(212, 163, 115, 0.08);
            border-left: 3px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
            font-size: 0.95rem;
        }

        .scene-narrative {
            font-size: 1rem;
            color: #d5d9de;
            white-space: pre-line;
            line-height: 1.85;
        }

        .scene-symbol {
            margin-top: 10px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* 내비게이션 바 */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 24px;
        }

        .page-indicator {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        /* 전체 리스트 모드 스타일 */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .list-item {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
        }

        @media (max-width: 900px) {
            .viewer-container {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .list-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>📖</span> 카프카 <변신> 스토리북
        </div>
        <div class="header-controls">
            <button id="btnBgMusic" onclick="toggleBGM()">🎵 오르골 BGM</button>

    <main>
        <!-- 단일 책장 넘김 뷰어 -->
        <div id="singleViewerArea">
            <div class="viewer-container">
                <div class="image-box">
                    <img id="viewerImage" src="" alt="장면 일러스트" onerror="handleImageError(this)">

                </div>
                <div class="content-box">
                    <div class="scene-badge" id="sceneNumber">SCENE 01 / 10</div>

                    <div class="scene-quote" id="sceneQuote">"어느 날 아침, 불안한 꿈에서 깨어났을 때 그레고르는 자신이 흉측한 벌레로 변해 있음을 발견했다."</div>
                    <div class="scene-narrative" id="sceneNarrative">내용 로딩 중...</div>
                    <div class="scene-symbol" id="sceneSymbol">상징 분석...</div>

            <div class="nav-controls">

                <button onclick="nextPage()">다음 장면 (→) ▶</button>
            </div>

        <!-- 전체 목록 뷰어 (숨김 모드) -->
        <div id="listViewArea" class="list-container" style="display: none;"></div>
    </main>

    <script>
        const scenesData = [
            {
                cut: 1,
                title: "어느 날 아침의 각성과 알람시계의 공포",
                engTitle: "The Awakening and Terror of Time",
                fileName: "01_awakening.jpg",
                altFileName: "01.jpg",
                quote: "어느 날 아침 그레고르 잠자가 불안한 꿈에서 깨어났을 때, 그는 자신이 침대 속에서 한 마리의 흉측한 갑충으로 변해 있는 것을 발견했다.",
                narrative: `어느 날 아침, 불편하고 뒤숭숭한 꿈에서 깨어난 그레고르 잠자는 자신의 몸이 딱딱한 갑옷 같은 등껍질로 변해 누워 있는 것을 발견했습니다.
배를 조금만 들어 올려도 활 모양으로 굽은 갈색의 마디들이 보였고, 그 위태로운 둥근 배 위로는 이불이 흘러내리기 직전이었습니다.
자신의 가련하게 얇은 수많은 다리들은 어찌할 바를 모른 채 그의 눈앞에서 무력하게 허우적거리고 있었습니다.
하지만 놀랍게도 그가 가장 먼저 느낀 감정은 자신의 망가진 육체에 대한 공포가 아닌, 협탁 위에서 째깍거리는 알람시계에 대한 소름 돋는 경악이었습니다.
시곗바늘은 이미 새벽 여섯 시 반을 가리키며 무심히 흘러가고 있었고, 그가 매일 타야만 했던 새벽 다섯 시 첫 기차는 이미 떠난 지 오래였습니다.
이 끔찍한 신체적 파국 앞에서도 그는 직장에 늦어 지배인에게 당할 문책과 부모님의 빚을 갚지 못할까 봐 덜컥 두려움에 사로잡혔습니다.
인간으로서의 영혼과 존엄보다 생계 유지와 출근 규율이 한 사람의 의식을 얼마나 처절하게 잠식했는지를 보여주는 서늘한 아침이었습니다.
그는 문밖에서 부드럽게 자신을 부르는 어머니의 목소리를 들으며 어떻게든 이 괴물 같은 몸을 침대 밖으로 굴려 내기 위해 필사적으로 발버둥 쳤습니다.`,
                symbol: "시간 규율과 자본주의 노동 규율이 인간의 실존보다 우위에 놓여 있음을 보여주는 비극적 각성."
            },
            {
                cut: 2,
                title: "지배인의 기습 방문과 가혹한 관료 시스템",
                engTitle: "The Chief Clerk's Ruthless Visit",
                fileName: "02_manager.jpg",
                altFileName: "02.jpg",
                quote: "회사의 모든 사원들은 죄다 불한당이란 말인가? 단 한 시간이라도 직무를 게을리하면 곧바로 의심을 받아야 한단 말인가?",
                narrative: `출근 시각을 겨우 한 시간 남짓 넘겼을 뿐인데, 현관문 너머로 회사의 지배인이 직접 집까지 들이닥쳤다는 불길한 구두 굽 소리가 울렸습니다.
지배인은 아픈 사원에 대한 일말의 염려 대신, 거실 한복판에서 냉혹하게 목소리를 높이며 최근의 실적 부진과 심지어 공금 횡령 의혹까지 들이댔습니다.
한 인간이 수년간 헌신하며 바친 노동의 가치는 단 한 번의 지각 앞에서 쓰레기처럼 내팽개쳐졌고, 오직 기계적인 쓸모만이 저울질당했습니다.
닫힌 방문 너머로 어머니는 아들이 병에 걸린 것이라며 울먹이며 애원했고, 아버지는 지배인 앞에서 연신 굽실거리며 체면을 차리기 바빴습니다.
방 안의 그레고르는 어떻게든 오해를 풀고 자신의 성실함을 증명하고자 턱과 온몸의 무게를 실어 굳게 잠긴 열쇠를 필사적으로 돌리기 시작했습니다.
그에게 회사는 단순한 일터가 아니라 온 가족의 생계를 짊어진 거대한 사슬이었기에, 그는 이 모욕적인 방문 속에서도 오직 용서를 구해야 한다고 믿었습니다.
개인의 내밀한 고통이나 건강 따위는 안중에도 없는 자본주의 관료 시스템의 비정함이 차가운 현관 복도를 가득 채웠습니다.
마침내 문이 서서히 열렸을 때, 문틈 너머로 비친 지배인의 얼굴은 경악과 혐오로 일그러지며 뒷걸음질 치기 시작했습니다.`,
                symbol: "효용성과 실적으로만 인간을 평가하는 잔혹한 자본주의 관료제의 민낯."
            },
            {
                cut: 3,
                title: "언어의 상실과 굳게 잠긴 소통의 문",
                engTitle: "Loss of Voice and Total Isolation",
                fileName: "03_language_lost.jpg",
                altFileName: "03.jpg",
                quote: "그것은 인간의 목소리가 아니었다. 단어 밑바닥에서 고통스러운 쇳소리와 동물적인 갉아먹는 소음이 섞여 나왔다.",
                narrative: `그레고르는 지배인과 가족들을 안심시키기 위해 문틈으로 필사적인 해명의 말을 쏟아붓기 시작했습니다.
그는 곧 옷을 갈아입고 기차를 탈 것이며, 이번 분기의 수주 실적은 자신이 반드시 책임지고 메꾸겠노라고 눈물겹게 맹세했습니다.
그러나 그의 뇌리를 떠난 간절한 문장들은 입술을 거치며 흉측한 쇳소리와 거친 긁힘, 동물적 삑삑거림으로 짓이겨져 터져 나왔습니다.
방 밖의 사람들에게 그의 절규는 이성적인 인간의 말이 아니라, 귀를 찢는 끔찍한 괴물의 괴성으로 들릴 뿐이었습니다.
어머니는 두 손으로 얼굴을 감싼 채 바닥에 주저앉아 비명을 질렀고, 지배인은 계단을 허둥지둥 뛰어내려 가며 코트와 모자마저 내팽개쳤습니다.
인간 사회와의 유일한 연결 고리였던 '언어'가 박탈당한 순간, 그레고르는 영원한 소통의 암흑 속으로 유배되었습니다.
아버지는 지배인이 떨어뜨린 지팡이와 두꺼운 신문지를 휘두르며, 마치 유해한 짐승을 몰듯 발을 구르며 그레고르를 어두운 방 안으로 몰아세웠습니다.
문이 쾅 닫히고 빗장이 단단히 걸리는 둔탁한 소리와 함께, 그레고르는 완벽한 독방의 적막 속에 내동댕이쳐졌습니다.`,
                symbol: "언어 상실을 통해 묘사된 인간적 소통의 영구적 단절과 실존적 고립."
            },
            {
                cut: 4,
                title: "제복을 입은 아버지와 등껍질에 박힌 사과",
                engTitle: "The Patriarch's Rage and the Embedded Apple",
                fileName: "04_father_apple.jpg",
                altFileName: "04.jpg",
                quote: "던져진 사과 하나가 그레고르의 등에 파고들었다. 아무도 그것을 뽑아줄 생각을 하지 않았고, 썩은 사과는 치명상이 되었다.",
                narrative: `무기력하게 침대에만 누워 있던 늙은 아버지는 그레고르가 무너지자 은행 경비원의 빳빳한 청색 제복을 입고 가장의 권력을 되찾았습니다.
황금 단추가 번쩍이는 제복을 입은 아버지는 더 이상 부드러웠던 노인이 아니라, 엄격하고 잔인한 가부장적 심판관의 모습이었습니다.
거실로 잠시 기어 나온 그레고르를 향해 아버지는 주머니에서 식탁 위의 사과들을 꺼내어 맹렬한 기세로 던지기 시작했습니다.
공중을 가르며 날아온 붉은 사과 하나가 그레고르의 약한 등껍질 틈새에 정확히 틀어박히며 둔탁한 파열음을 냈습니다.
상상조차 할 수 없는 극심한 고통이 온 신경을 관통했고, 그레고르는 바닥에 납작하게 엎드린 채 신음하며 정신을 잃어갔습니다.
가족 중 그 누구도 그의 살 속에 박혀 썩어 들어가는 사과를 뽑아주거나 상처를 닦아주려 하지 않았습니다.
살 속 깊이 파고들어 문드러지는 사과는 더 이상 쓸모를 잃고 가족의 적으로 낙인찍힌 자에게 가해진 지워지지 않는 형벌이었습니다.
그는 상처의 염증과 열병 속에서 꼼짝도 하지 못한 채, 가족들이 식탁에서 나누는 차가운 대화를 문틈으로 엿들어야만 했습니다.`,
                symbol: "권력을 회복한 가부장의 폭력과 쓸모를 잃은 구성원에게 새겨진 영구한 소외의 낙인."
            },
            {
                cut: 5,
                title: "추억의 박탈과 쓰레기장으로 전락한 방",
                engTitle: "Deprivation of Humanity and the Junk Room",
                fileName: "05_furniture_loss.jpg",
                altFileName: "05.jpg",
                quote: "방 안에 있던 인간의 손때 묻은 물건들이 하나씩 사라질 때마다, 그의 인간성 또한 한 조각씩 깎여 나갔다.",

                        <div class="scene-badge">SCENE ${String(data.cut).padStart(2, '0')}</div>
                        <h3 class="scene-title" style="font-size: 1.3rem;">${data.title}</h3>
                        <div class="scene-quote" style="font-size: 0.88rem;">${data.quote}</div>
                        <div class="scene-narrative" style="font-size: 0.93rem;">${data.narrative}</div>
                        <div class="scene-symbol">${data.symbol}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Web Audio API 기반 오르골 사운드 신디사이저
        function toggleBGM() {
            const btn = document.getElementById('btnBgMusic');
            if (!isBgmPlaying) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                startMusicBox();
                isBgmPlaying = true;
                btn.classList.add('active');
                btn.innerText = '⏹ 오르골 BGM 끄기';
            } else {
                stopMusicBox();
                isBgmPlaying = false;
                btn.classList.remove('active');
                btn.innerText = '🎵 오르골 BGM';
            }
        }

        function playMusicBoxNote(freq, time, duration = 1.2) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, time);

            // 오르골 맑은 타격음 엔벨로프
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.18, time + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + duration);
        }

        function startMusicBox() {
            const melody = [
                523.25, 659.25, 783.99, 659.25,
                587.33, 698.46, 880.00, 698.46,
                523.25, 659.25, 1046.50, 783.99,
                493.88, 587.33, 783.99, 587.33
            ];
            let noteStep = 0;
            bgmInterval = setInterval(() => {
                if (!audioCtx) return;
                const note = melody[noteStep % melody.length];
                playMusicBoxNote(note, audioCtx.currentTime);
                // 잔잔한 서브 화음
                if (noteStep % 4 === 0) {
                    playMusicBoxNote(note / 2, audioCtx.currentTime, 2.0);
                }
                noteStep++;
            }, 650);
        }

        function stopMusicBox() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        // Web Speech API 기반 한국어 TTS 낭독
        let isSpeaking = false;
        function toggleTTS() {
            const btn = document.getElementById('btnTts');
            if (!('speechSynthesis' in window)) {
                alert('현재 브라우저가 음성 낭독(TTS) 기능을 지원하지 않습니다.');
                return;
            }

            if (!isSpeaking) {
                window.speechSynthesis.cancel();
                const cur = scenesData[currentIndex];
                const textToRead = `${cur.title}. ${cur.quote}. ${cur.narrative}`;
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.92;
                utterance.pitch = 0.95;

                utterance.onend = () => {
                    isSpeaking = false;
                    btn.classList.remove('active');
                    btn.innerText = '🔊 낭독 (TTS)';
                };

                window.speechSynthesis.speak(utterance);
                isSpeaking = true;
                btn.classList.add('active');
                btn.innerText = '⏹ 낭독 정지';
            } else {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                btn.classList.remove('active');
                btn.innerText = '🔊 낭독 (TTS)';
            }
        }

        // 초기 실행
        renderViewer(currentIndex);
    </script>
</body>
</html>
