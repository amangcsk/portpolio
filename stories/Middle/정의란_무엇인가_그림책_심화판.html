<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정의란 무엇인가 – 소라의 감나무 이야기 - 클래식 수채화 그림책</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FAF6EE;
      --bg-paper: #FFFDF9;
      --primary-color: #1e3a8a;
      --accent-color: #c28b38;
      --text-main: #2c2523;
      --border-warm: #E8DFC8;
      --shadow-book: 0 20px 45px -10px rgba(74, 52, 28, 0.18);
      --font-story: 'Nanum Myeongjo', 'Gowun Batang', serif;
      --font-body: 'Gowun Batang', 'Pretendard', serif;
      --font-sans: 'Pretendard', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-cream); color: var(--text-main); font-family: var(--font-body); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(255, 253, 249, 0.96); border-bottom: 1px solid var(--border-warm); position: sticky; top: 0; z-index: 100; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-title { font-family: var(--font-story); font-size: 1.25rem; font-weight: 800; }
    .nav-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .btn { font-family: var(--font-sans); font-size: 0.95rem; padding: 0.5rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-warm); background: #fff; cursor: pointer; }
    .btn.active, .btn.playing { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem 3rem; max-width: 1300px; margin: 0 auto; width: 100%; }
    .book-container { width: 100%; max-width: 1100px; margin: 0 auto; }
    .book-spread { background: var(--bg-paper); border-radius: 14px; box-shadow: var(--shadow-book); border: 1px solid var(--border-warm); display: grid; grid-template-columns: 1fr 1fr; min-height: 640px; overflow: hidden; position: relative; }
    .page-left { padding: 2.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAF7F0; border-right: 1px solid rgba(210,195,175,0.4); }
    .art-frame { width: 100%; max-width: 440px; height: 520px; background: #fff; border-radius: 8px; padding: 10px; border: 1px solid #ebdcc5; display: flex; align-items: center; justify-content: center; cursor: zoom-in; position: relative; }
    .art-frame img { width: 100%; height: 100%; object-fit: contain; border-radius: 4px; }
    .page-right { padding: 2.2rem 2.6rem; display: flex; flex-direction: column; justify-content: space-between; background: #FFFDF9; }
    .scene-meta { font-family: var(--font-sans); font-size: .85rem; color: #8a7a64; margin-bottom: .6rem; display: flex; gap: .8rem; flex-wrap: wrap; }
    .scene-number { font-weight: 600; letter-spacing: .08em; }
    .scene-heading { font-family: var(--font-story); font-size: 1.75rem; font-weight: 800; margin-bottom: 1.4rem; }
    .quote-box { background: #FFF1F2; border-left: 3.5px solid #be123c; padding: 0.85rem 1.1rem; border-radius: 0 8px 8px 0; margin-bottom: 1.5rem; }
    .quote-text { font-family: var(--font-story); font-size: 1.1rem; font-weight: 700; font-style: italic; color: #881337; }
    .story-paragraph { font-size: 1.12rem; line-height: 1.9; color: #334155; text-align: justify; word-break: keep-all; flex: 1; }
    .page-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; font-family: var(--font-sans); color: #8a7a64; }
    .controls-panel { margin-top: 1.6rem; display: flex; align-items: center; gap: 1.2rem; background: rgba(255, 253, 249, 0.95); border: 1px solid var(--border-warm); padding: 0.75rem 1.4rem; border-radius: 999px; }
    .nav-arrow { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--border-warm); background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
    .slider-container { display: flex; align-items: center; gap: 0.8rem; min-width: 280px; }
    .slider-track { flex: 1; height: 6px; background: #e2e8f0; border-radius: 4px; cursor: pointer; }
    .gallery-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 3.5rem; margin: 1rem auto 0; }
    .gallery-card { background: var(--bg-paper); border-radius: 16px; border: 1px solid var(--border-warm); overflow: hidden; display: flex; flex-direction: column; }
    .gallery-art { width: 100%; height: 580px; background: #FAF7F0; padding: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
    .gallery-art img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .gallery-content { padding: 2.2rem 2.5rem; }
    .gallery-meta { font-family: var(--font-sans); font-size: .85rem; color: #8a7a64; margin-bottom: .5rem; }
    .gallery-title { font-family: var(--font-story); font-size: 1.6rem; margin-bottom: 1rem; }
    .gallery-quote { background: #FFF1F2; border-left: 3.5px solid #be123c; padding: .8rem 1.1rem; color: #881337; font-weight: 700; margin-bottom: 1rem; border-radius: 0 8px 8px 0; }
    .gallery-text { font-size: 1.15rem; line-height: 1.95; color: #334155; word-break: keep-all; }
    .lightbox { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.94); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 2rem; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .lightbox.active { opacity: 1; pointer-events: auto; }
    .lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 24px; right: 28px; color: #fff; font-size: 2.2rem; cursor: pointer; }
    @media (max-width: 800px) { .book-spread { grid-template-columns: 1fr; } .art-frame { height: 380px; } .page-right { padding: 1.8rem 1.4rem; } .slider-container { min-width: 140px; } .gallery-art { height: 400px; } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">📖</span>
      <span class="brand-title">정의란 무엇인가 – 소라의 감나무 이야기</span>
    </div>
    <div class="nav-actions">
      <button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
      <button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 연속 갤러리</button>
      <button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 BGM</button>
    </div>
  </header>

  <main>
    <div class="book-container" id="bookView">
      <div class="book-spread">
        <div class="page-left">
          <div class="art-frame" onclick="openLightboxCurrent()">
            <img id="bookImg" src="" alt="삽화">
          </div>
        </div>
        <div class="page-right">
          <div>
            <div class="scene-meta">
              <span class="scene-number" id="bookSceneNum">SCENE 01 / 20</span>
              <span class="scene-sub" id="bookSub">Subtitle</span>
            </div>
            <h1 class="scene-heading" id="bookTitle">제목</h1>
            <div class="quote-box">
              <p class="quote-text" id="bookQuote">"명대사"</p>
            </div>
            <p class="story-paragraph" id="bookText">본문 내용...</p>
          </div>
          <div class="page-footer">
            <span class="page-indicator" id="bookPageIndicator">1 / 20 페이지</span>
            <button class="btn" id="btnTts" onclick="toggleTtsCurrent()">🔊 동화 읽어주기</button>
          </div>
        </div>
      </div>
      <div style="display:flex; justify-content:center;">
        <div class="controls-panel">
          <button class="nav-arrow" onclick="prevScene()">❮</button>
          <div class="slider-container">
            <input type="range" class="slider-track" id="sceneSlider" min="1" max="20" value="1" oninput="onSliderChange(this.value)">
          </div>
          <button class="nav-arrow" onclick="nextScene()">❯</button>
        </div>
      </div>
    </div>

    <div class="gallery-container" id="galleryView" style="display: none;"></div>
  </main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="확대">
  </div>

  <script>
    const SCENES = [{"id": 1, "sub": "감나무 마을", "title": "소라의 아침", "quote": "오늘은 꼭 물어봐야지!", "text": "가을이 깊어 가는 감나무 마을에는 주홍빛 감이 가지마다 주렁주렁 매달려 있었어요. 이 마을에 사는 열두 살 소라는 내년이면 중학교에 들어가는데, 요즘 들어 마음속에서 풀리지 않는 질문 하나가 자꾸만 맴돌았어요. 뉴스에서도 학교에서도 어른들은 \"그건 정의롭지 못해요\" 하고 자주 말했지만, 정의가 정확히 무엇인지는 아무도 알려 주지 않았거든요. 소라는 오늘만큼은 꼭 물어보기로 마음먹고, 마을에서 가장 아는 것이 많은 할아버지를 찾아 나섰어요. 감나무 아래 평상에 앉아 계시던 할아버지가 멀리서 소라를 보고 반갑게 손을 흔들어 주셨어요."}, {"id": 2, "sub": "감나무 아래에서", "title": "소라의 큰 질문", "quote": "할아버지, 정의가 뭐예요?", "text": "소라는 할아버지 곁에 나란히 앉아 숨을 한 번 크게 쉬고 용기를 냈어요. \"할아버지, 정의가 뭐예요?\" 할아버지는 껄껄 웃으시며 \"아이고, 우리 소라가 세상에서 제일 어려운 질문을 들고 왔구나\" 하셨어요. 그러고는 표정을 고치고, 아주 오래전 철학자들도 수천 년 동안 이 질문을 두고 고민해 왔다고 알려 주셨어요. \"정답부터 말해 줄 수는 없지만 같이 생각하는 방법은 알려 줄 수 있단다. 이야기 하나로 시작해 볼까?\""}, {"id": 3, "sub": "할아버지의 수수께끼", "title": "기차 이야기", "quote": "잘 들어 보렴.", "text": "할아버지는 손가락을 하나 들어 올리고 낮은 목소리로 이야기를 시작하셨어요. \"소라야, 네가 철길 옆 신호소에 서 있다고 상상해 보렴.\" \"그런데 멀리서 브레이크가 고장 난 기차가 쏜살같이 달려오고 있단다.\" \"기차를 멈출 방법은 없고, 네 손에는 선로를 바꾸는 레버 하나만 쥐여 있어.\" 소라는 두 손을 무릎 위에 꼭 모으고 눈을 동그랗게 떴어요."}, {"id": 4, "sub": "달리는 기차", "title": "갈림길의 기차", "quote": "다섯 명을 살릴까, 한 명을 살릴까?", "text": "\"철길은 조금 앞에서 두 갈래로 갈라진단다.\" \"지금 그대로 두면 기차는 왼쪽으로 가서 일하던 인부 다섯 명을 덮치게 돼.\" \"레버를 당기면 기차는 오른쪽으로 가는데, 거기에는 인부 한 명이 혼자 일하고 있어.\" \"아무것도 하지 않으면 다섯 명이 다치고, 레버를 당기면 한 명이 다치는 거야.\" 할아버지는 소라를 똑바로 바라보며 \"자, 너라면 어떻게 하겠니?\" 하고 물으셨어요."}, {"id": 5, "sub": "쉽지 않은 대답", "title": "소라의 고민", "quote": "다섯 명을 살려요!", "text": "소라는 입술을 깨물고 한참 생각하다가 \"다섯 명을 살려요!\" 하고 외쳤어요. \"다섯 명이 한 명보다 많으니까, 한 명이 다치더라도 레버를 당기는 게 낫지 않을까요?\" 할아버지는 고개를 끄덕이며 \"많은 사람들이 너처럼 대답한단다\" 하셨어요. 그러더니 이야기를 슬쩍 바꾸셨어요. \"이번에는 네가 다리 위에 서 있는데, 옆에 선 덩치 큰 사람을 밀어 떨어뜨려야만 기차가 멈춘다면 어떨까?\""}, {"id": 6, "sub": "쉽지 않은 대답", "title": "마음속 저울", "quote": "한 사람도 아무 잘못이 없잖아요.", "text": "소라는 깜짝 놀라 두 손을 휘휘 저으며 \"그건 안 돼요!\" 하고 외쳤어요. \"숫자로 보면 똑같이 한 명을 희생해서 다섯 명을 살리는 건데, 왜 이건 안 될 것 같을까요?\" 소라는 가슴이 답답해져서 고개를 갸웃했어요. \"그 사람은 아무 잘못도 없는데 사람을 직접 밀어 떨어뜨리는 건 너무 끔찍해요.\" 할아버지는 흐뭇하게 웃으며 \"바로 그 마음속의 망설임이 정의를 생각하는 출발점이란다\" 하고 말씀하셨어요."}, {"id": 7, "sub": "첫 번째 생각 · 공리주의", "title": "저울 위의 행복", "quote": "더 많은 사람이 행복하면 옳다.", "text": "\"첫 번째 생각은 '공리주의'란다. 이름은 어렵지만 뜻은 간단해.\" \"영국의 학자 제러미 벤담은 가장 많은 사람에게 가장 큰 행복을 주는 일이 옳다고 말했단다.\" \"저울 한쪽에는 행복을, 다른 쪽에는 고통을 올려놓고 어느 쪽이 더 무거운지 재 보는 것과 같지.\" 소라는 \"그럼 기차 문제에서는 다섯 명을 살리는 게 옳겠네요\" 하고 고개를 끄덕였어요. \"하지만 소라야, 한 사람의 권리를 많은 사람의 행복을 위해 마음대로 써도 되는지는 공리주의가 풀기 어려운 숙제란다.\""}, {"id": 8, "sub": "두 번째 생각 · 자유지상주의", "title": "내가 키운 감", "quote": "내 것은 내 마음대로 해도 돼.", "text": "마침 마을에서는 추수를 기념하는 잔치가 열려서, 감 부자로 소문난 할머니가 커다란 바구니를 들고 나타나셨어요. \"이 감은 내가 새벽마다 나무를 돌보며 정성껏 키운 것이니, 누구에게 얼마를 주든 내 마음이야.\" 몇몇 아이들은 \"저렇게 많은 감을 혼자 가지고 계시면서 너무해요\" 하고 입을 삐죽였어요. 할머니는 단호하게 \"내가 땀 흘려 얻은 것은 내가 정하는 거란다\" 하고 말씀하셨어요. 소라는 두 사람의 말이 모두 일리 있는 것 같아서 마음이 복잡해졌어요."}, {"id": 9, "sub": "두 번째 생각 · 자유지상주의", "title": "내 것은 내 자유", "quote": "내 것은 내 자유!", "text": "할아버지는 \"그것이 두 번째 생각, '자유지상주의'란다\" 하고 설명을 이어 가셨어요. \"이 생각은 사람마다 자기 몸과 자기가 번 것의 주인이니, 나라가 억지로 빼앗아 남에게 나눠 주면 안 된다고 보지.\" \"유명한 농구 선수가 큰돈을 버는 것도 사람들이 기꺼이 표를 사서 보러 갔기 때문이니 정당하다는 거야.\" 소라는 \"그러면 가난한 사람이 도움을 받는 건 안 되나요?\" 하고 조심스럽게 물었어요. 할아버지는 \"그 질문이 바로 이 생각이 풀어야 할 숙제란다. 자유는 소중하지만 운이 나쁜 사람은 어떻게 하느냐는 거지\" 하고 대답하셨어요."}, {"id": 10, "sub": "세 번째 생각 · 공정한 약속", "title": "누가 자를지 모른다면", "quote": "내가 어느 조각을 받을지 모른다면?", "text": "할아버지는 잔칫상에 놓인 커다란 케이크를 가리키셨어요. \"세 아이가 케이크를 나누는데, 칼을 든 아이가 자기 몫이 어느 조각인지 미리 안다면 어떻게 될까?\" 소라는 웃으며 \"자기가 제일 큰 조각을 가져가겠죠!\" 하고 대답했어요. \"그럼 누가 자를지도, 어느 조각을 받을지도 아무도 모른다면?\" 하는 물음에 소라는 손뼉을 치며 \"그럼 모두 똑같이 자르겠네요!\" 하고 외쳤어요. 할아버지는 \"철학자 존 롤스는 이것을 '무지의 베일'이라고 불렀단다. 자기가 부자일지 가난할지 모르는 채로 약속을 정하면 공정해진다는 생각이지\" 하고 설명해 주셨어요."}, {"id": 11, "sub": "네 번째 생각 · 어울리는 자리", "title": "가장 좋은 피리는 누구에게", "quote": "잘 부는 사람이 피리를 불어야 해.", "text": "잔치가 무르익자 마을 사람들이 노래를 부르기 시작했고, 한쪽에는 낡은 피리 하나가 놓여 있었어요. \"이 피리를 가장 아름답게 불 줄 아는 사람에게 주는 게 좋을까, 아니면 제비뽑기로 아무에게나 주는 게 좋을까?\" 소라는 곰곰이 생각하다가 \"피리를 잘 부는 사람에게 줘야 음악이 더 아름다울 것 같아요\" 하고 대답했어요. 할아버지는 \"아주 먼 옛날 그리스의 철학자 아리스토텔레스도 같은 생각을 했단다\" 하고 말씀하셨어요. \"그는 물건마다 쓰임새가 있고, 그 쓰임새를 가장 잘 살릴 사람이 그것을 받는 것이 정의롭다고 보았지.\""}, {"id": 12, "sub": "네 번째 생각 · 어울리는 자리", "title": "자격에 맞게", "quote": "자격과 쓰임에 맞게!", "text": "\"그러니 이 생각에서 정의란 사람들이 가진 자격과 덕을 알아보고 존중하는 일이란다.\" 소라는 피리 소리에 귀를 기울이다가 \"그럼 누가 어떤 자격이 있는지는 누가 정하나요?\" 하고 물었어요. 할아버지는 \"바로 그게 어려운 점이야. 무엇이 훌륭한 삶이고 어떤 일이 존중받아야 하는지를 함께 이야기해서 정해야 하거든\" 하고 말씀하셨어요. 소라는 정의가 계산이나 규칙만이 아니라 '어떤 삶이 좋은 삶인가' 하는 물음과도 이어져 있다는 사실이 신기했어요. 달빛 아래 피리 소리가 마을 구석구석으로 부드럽게 퍼져 나갔어요."}, {"id": 13, "sub": "함께 사는 마을", "title": "우물을 파는 사람들", "quote": "영차, 영차!", "text": "다음 날 아침, 할아버지는 소라를 데리고 마을 한가운데 있는 오래된 우물로 가셨어요. \"이 우물은 아주 오래전 마을 사람들이 삽과 곡괭이를 들고 함께 파서 만든 것이란다.\" \"누구는 힘이 세서 흙을 퍼내고, 누구는 밥을 지어 나르고, 누구는 아이들을 돌보며 저마다 맡은 일을 했지.\" 소라는 상상 속에서 사람들이 \"영차, 영차!\" 하고 외치는 소리를 들은 것만 같았어요. 우물가에는 그날의 땀방울처럼 오래된 돌들이 아침 햇살에 반짝이고 있었어요."}, {"id": 14, "sub": "함께 사는 마을", "title": "모두가 판 우물", "quote": "우리가 함께 만든 우물이야.", "text": "\"지금 이 우물물은 누구의 것일까? 처음 판 사람들의 것일까, 아니면 오늘 물을 긷는 우리 모두의 것일까?\" 소라는 잠시 생각하더니 \"우리 모두의 것이에요. 그리고 우물이 더러워지지 않게 지킬 책임도 우리 모두에게 있어요\" 하고 대답했어요. 할아버지는 \"그렇지. 혼자 사는 것 같아도 우리는 이웃과 먼저 살다 간 분들에게 많은 빚을 지고 있단다\" 하고 말씀하셨어요. \"그래서 어떤 학자들은 정의를 이야기할 때 서로에 대한 책임과 함께 사는 공동체의 좋음도 꼭 생각해야 한다고 말한단다.\" 소라는 정의가 나 혼자만의 문제가 아니라 '우리'의 문제라는 것을 가슴으로 느꼈어요."}, {"id": 15, "sub": "교실에서", "title": "모른 척하지 않기", "quote": "같이 놀자, 이리 와!", "text": "월요일 아침, 학교 운동장에는 가을 햇살이 넓게 퍼져 있었어요. 소라는 운동장 구석 벤치에 혼자 앉아 있는 반 친구를 발견했어요. 그 친구는 얼마 전에 전학을 와서 아직 친구가 없었는데, 아이들은 모두 바빠 보여서 아무도 말을 걸지 않았어요. 소라는 \"저건 내가 모른 척하면 안 되는 일이야\" 하고 마음속으로 말했어요. 할아버지와 나눈 이야기가 머릿속에 떠올라서, 소라는 용기를 내어 친구에게 다가갔어요."}, {"id": 16, "sub": "교실에서", "title": "함께 웃는 친구", "quote": "우리 같이 앉자!", "text": "\"같이 놀자, 이리 와!\" 소라가 환하게 웃으며 손을 내밀었어요. 친구는 깜짝 놀라더니 수줍게 웃으며 소라의 손을 잡았어요. 둘은 나란히 벤치에 앉아 좋아하는 노래와 간식 이야기를 나누며 금세 가까워졌어요. 소라는 정의가 거창한 이론만이 아니라 작은 친절과 공정한 마음으로 매일 이어지는 것이라는 사실을 알게 되었어요. 멀리서 지켜보던 다른 아이들도 하나둘 다가와 함께 어울리기 시작했어요."}, {"id": 17, "sub": "저녁 밥상 앞에서", "title": "정답은 하나일까?", "quote": "정답은 이야기하며 찾는 거란다.", "text": "그날 저녁, 소라는 할아버지와 마주 앉아 따뜻한 보리차를 마시며 하루 있었던 일을 이야기했어요. \"할아버지, 공리주의도 맞는 것 같고 자유도 소중한 것 같고 공정한 약속도 중요한 것 같은데, 도대체 어느 것이 정답이에요?\" 할아버지는 찻잔을 내려놓으며 \"소라야, 학자들도 아직 하나의 정답에 합의하지 못했단다\" 하고 솔직하게 말씀하셨어요. \"그래서 중요한 건 정답을 외우는 것이 아니라, 서로 이유를 들어 이야기하고 생각을 나누는 거야.\" \"내 생각이 틀렸다면 고치고 남의 생각에서 배울 점은 받아들이는 것, 그것이 정의를 찾아가는 길이란다.\""}, {"id": 18, "sub": "친구들과 토론", "title": "내 생각, 네 생각", "quote": "네 생각은 어때? 나는 이렇게 생각해.", "text": "며칠 뒤, 소라는 학교 친구들과 운동장 잔디에 둥글게 앉아 토론을 해 보기로 했어요. 주제는 \"급식 반찬이 모자랄 때 어떻게 나누는 것이 가장 공정할까?\"였어요. 어떤 친구는 \"모두 똑같이 나눠야 해\"라고 했고, 어떤 친구는 \"배고픈 사람이 더 먹어야 해\"라고 했어요. 소라는 \"나는 먼저 순서를 정하고 부족하면 서로 조금씩 양보하면 좋겠어. 네 생각은 어때?\" 하고 물었어요. 친구들은 서로 말을 끊지 않고 끝까지 귀 기울여 들었고, 소라는 이런 대화 자체가 이미 정의로운 일이라고 생각했어요."}, {"id": 19, "sub": "별이 빛나는 밤", "title": "별빛 아래에서", "quote": "옳은 게 뭘까? 계속 물어보자.", "text": "그날 밤, 소라는 마당에 나가 하늘을 올려다보았어요. 맑은 가을 하늘에는 별이 가득 떠 있었고, 서늘한 바람이 감잎을 흔들며 지나갔어요. 소라는 오늘 하루 있었던 일과 지난 며칠 동안 할아버지께 배운 이야기들을 차근차근 떠올려 보았어요. 기차 문제, 저울, 케이크, 피리, 우물, 그리고 친구의 손까지 모든 장면이 하나의 길처럼 이어지는 것 같았어요. 소라는 별빛 아래에서 마음속 질문을 다시 꺼내 보았어요."}, {"id": 20, "sub": "별이 빛나는 밤", "title": "끝없이 묻는 일", "quote": "무엇이 옳을까?", "text": "정의란 무엇일까, 소라는 이제 조금은 대답할 수 있을 것 같았어요. 정의는 모두의 행복을 생각하고, 한 사람 한 사람의 자유와 권리를 존중하며, 공정한 약속을 만들고, 각자의 쓰임과 자격을 살피며, 함께 사는 이웃에 대한 책임을 다하는 일이라는 걸 알게 되었어요. 하지만 그것들을 어떻게 저울질할지는 책에 적힌 정답이 아니라 우리가 함께 이야기하며 찾아야 한다는 것도 알게 되었어요. 그래서 소라는 앞으로 새로운 중학교에 들어가서도 \"무엇이 옳을까?\" 하고 끝없이 물어보기로 마음먹었어요. 소라는 손에 든 등불을 높이 들어 올리며 환하게 웃었어요."}];

    SCENES.forEach(s => s.imgData = IMAGES_B64[s.id] || "");

    let currentIndex = 0;
    let currentMode = 'book';
    let synth = window.speechSynthesis;
    let isSpeaking = false;

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('bookView').style.display = mode === 'book' ? 'block' : 'none';
      document.getElementById('galleryView').style.display = mode === 'gallery' ? 'flex' : 'none';
      document.getElementById('btnModeBook').classList.toggle('active', mode === 'book');
      document.getElementById('btnModeGallery').classList.toggle('active', mode === 'gallery');
      if (mode === 'book') renderBookSpread(currentIndex);
      else synth.cancel();
    }

    function renderBookSpread(idx) {
      if (idx < 0 || idx >= SCENES.length) return;
      currentIndex = idx;
      const s = SCENES[idx];
      document.getElementById('bookImg').src = s.imgData;
      document.getElementById('bookSceneNum').textContent = `SCENE ${String(s.id).padStart(2, '0')} / 20`;
      document.getElementById('bookSub').textContent = s.sub;
      document.getElementById('bookTitle').textContent = s.title;
      document.getElementById('bookQuote').textContent = `"${s.quote}"`;
      document.getElementById('bookText').textContent = s.text;
      document.getElementById('bookPageIndicator').textContent = `${s.id} / 20 페이지`;
      document.getElementById('sceneSlider').value = s.id;
      synth.cancel(); isSpeaking = false;
    }

    function prevScene() { if (currentIndex > 0) renderBookSpread(currentIndex - 1); }
    function nextScene() { if (currentIndex < SCENES.length - 1) renderBookSpread(currentIndex + 1); }
    function onSliderChange(val) { renderBookSpread(parseInt(val) - 1); }
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') prevScene();
      if (e.key === 'ArrowRight') nextScene();
      if (e.key === 'Escape') closeLightbox();
    });

    function buildGallery() {
      const container = document.getElementById('galleryView');
      container.innerHTML = '';
      SCENES.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <div class="gallery-art" onclick="openLightboxImg(SCENES[${i}].imgData)">
            <img src="${s.imgData}" alt="${s.title}" loading="lazy">
          </div>
          <div class="gallery-content">
            <div class="gallery-meta"><span class="gallery-num">SCENE ${String(s.id).padStart(2, '0')}</span></div>
            <h2 class="gallery-title">${s.title}</h2>
            <div class="gallery-quote">"${s.quote}"</div>
            <p class="gallery-text">${s.text}</p>
          </div>`;
        container.appendChild(card);
      });
    }

    function openLightboxCurrent() { openLightboxImg(SCENES[currentIndex].imgData); }
    function openLightboxImg(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

    function toggleTtsCurrent() {
      if (isSpeaking) { synth.cancel(); isSpeaking = false; }
      else {
        const utter = new SpeechSynthesisUtterance(SCENES[currentIndex].title + ". " + SCENES[currentIndex].text);
        utter.lang = 'ko-KR'; utter.rate = 0.92;
        utter.onend = () => { isSpeaking = false; };
        synth.speak(utter);
        isSpeaking = true;
      }
    }

    let audioCtx = null, isMusicPlaying = false, musicTimer = null;
    function toggleMusic() {
      if (isMusicPlaying) {
        isMusicPlaying = false;
        clearTimeout(musicTimer);
        document.getElementById('btnMusic').classList.remove('playing');
      } else {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isMusicPlaying = true;
        document.getElementById('btnMusic').classList.add('playing');
        const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        let idx = 0;
        function play() {
          if (!isMusicPlaying) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(notes[idx % notes.length], audioCtx.currentTime);
          idx++;
          gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 1.9);
          musicTimer = setTimeout(play, 900);
        }
        play();
      }
    }

    window.onload = () => { renderBookSpread(0); buildGallery(); };
  </script>
