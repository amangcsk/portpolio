<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#7c3f1d;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}

.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div class="brand"><span>📖</span> <span class="brand-title">김유정 이야기책 · 봄봄 · 동백꽃</span></div>
<div class="nav-actions">
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span><span id="bookSub"></span></div>

<div class="quote-label" id="bookQLabel"></div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p>
<div class="terms" id="bookTerms"></div></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn" id="btnTts" onclick="toggleTtsCurrent()">🔊 읽어주기</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="10" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 책은 김유정 선생님(1908~1937)의 소설 「봄봄」「동백꽃」의 줄거리를 쉬운 말로 풀어 10부분으로 나눈 것입니다. 큰 글자 상자 속 한 줄 가운데 '원문'이라고 적은 것만 원작의 글이고, 나머지는 이해를 돕기 위해 풀어 쓴 문장입니다.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"id": 1, "work": "봄봄", "sub": "봄봄 ① 시작", "title": "삼 년 칠 개월의 머슴살이", "qlabel": "이 대목의 핵심", "quote": "장가들려고 일한 지 삼 년 칠 개월이 되도록, 아직도 혼례 날짜를 못 받았다.", "text": "봄이 오는 강원도 산골 마을입니다. 이야기를 들려주는 '나'는 점순이라는 처녀와 혼인하려고 점순이네 집에서 삼 년 칠 개월째 일을 하고 있는 총각입니다. 월급은 한 푼도 없습니다. 대신 \"일을 잘하면 딸과 혼인시켜 주겠다\"는 약속 하나만 믿고 사는 것이지요.\n\n그런데 점순이의 아버지, 곧 '나'가 장인님이라고 부르는 어른은 도무지 혼례를 시켜 줄 생각이 없습니다. 사람 좋은 척 웃다가도 혼인 이야기만 나오면 \"점순이가 아직 덜 컸다\"며 딴청을 부립니다. 사실은 공짜로 부릴 일꾼을 놓치기 싫은 속셈입니다. '나'는 그것도 모르고 오늘도 논으로 밭으로 뛰어다닙니다.", "terms": ["데릴사위: 딸을 시집보내지 않고, 사위가 처갓집에 들어와 일을 도우며 사는 풍습. 이 이야기에서는 '장가를 들기 전에 먼저 일부터 하는 사위감'을 뜻합니다.", "머슴: 남의 집에서 1년 단위로 품삯을 받고 농사일을 해 주는 사람. 이 이야기의 '나'는 품삯도 없이 일합니다.", "성례(成禮): 혼인식을 올리는 일."]}, {"id": 2, "work": "봄봄", "sub": "봄봄 ② 장인님", "title": "키가 자라기를 기다리는 사람", "qlabel": "이 대목의 핵심", "quote": "점순이 키가 안 컸으니 안 된다. 크거든 시켜 주마.", "text": "점순이는 정말로 키가 작았습니다. 그런데 장인님의 말대로라면 점순이는 해가 바뀌어도 도무지 자라지 않는 것 같습니다. '나'는 속이 타서 점순이 키를 눈으로 재 보고, 주먹으로도 재 보지만 몇 해를 두고 보아도 그대로입니다.\n\n장인님은 몸집이 작고 배가 불룩한 사람입니다. 한 번 화가 나면 거침없이 사람을 때리고 돌아서서는 모른 척하는 성미라, 마을에서도 별로 좋은 소문이 없습니다. 이미 딸이 둘이나 있었는데, 먼저 온 사위들도 모두 몇 해 일하다 쫓겨나듯 떠났다는 말까지 있습니다. '나'는 그 이야기를 들으면서도 점순이를 생각하며 꾹 참고 일합니다.", "terms": ["장인: 아내의 아버지. 장가들 사람에게는 '아내가 될 사람의 아버지'입니다.", "마름: 땅 주인을 대신해서 소작인들을 관리하던 사람. 점순이 아버지가 이 일을 맡고 있어 마을에서 힘이 셌습니다."]}, {"id": 3, "work": "봄봄", "sub": "봄봄 ③ 구장님", "title": "구장님을 찾아가 하소연하다", "qlabel": "이 대목의 핵심", "quote": "구장님, 제발 저 좀 장가들게 해 주십시오.", "text": "참다못한 '나'는 마을에서 어른 대접을 받는 구장님을 찾아가 하소연합니다. \"삼 년 하고도 칠 개월을 일했는데 아직도 혼인을 안 시켜 줍니다. 이게 말이 됩니까?\" 구장님은 고개를 끄덕이며 장인님을 불러다 타일러 보기로 합니다.\n\n하지만 장인님은 말솜씨가 좋고 힘도 있습니다. 구장님이 \"이제 혼인을 시켜 주게\" 하고 말해도 이런저런 핑계로 쏙 빠져나가고, 오히려 \"사위가 일을 게을리한다\"고 큰소리를 칩니다. 결국 일은 흐지부지 끝나 버립니다. '나'는 가슴이 답답해 허탈한 걸음으로 돌아옵니다.", "terms": ["구장: 지금의 이장(마을 대표)과 같은 사람. 마을 일을 의논하고 판단해 주던 어른입니다."]}, {"id": 4, "work": "봄봄", "sub": "봄봄 ④ 점순이", "title": "점순이의 한마디", "qlabel": "이 대목의 핵심", "quote": "이 바보야, 시키는 대로 일만 하면 언제 장가를 가니?", "text": "그날 저녁, 점순이가 슬그머니 '나'를 불러 말합니다. \"너는 왜 그렇게 바보처럼 일만 하니? 아버지가 시키는 대로 하면 언제 혼인할 수 있겠니?\" '나'는 점순이도 한편으로는 자기 마음을 알고 있다는 생각에 가슴이 뜁니다. 한편으로는 야속한 마음도 듭니다.\n\n다음 날은 모를 심는 날입니다. 온 마을이 바쁜 날입니다. '나'는 점순이 말을 곰곰이 되새기다가 마음을 단단히 먹습니다. \"오늘은 일을 하지 않겠다. 혼인 날짜를 정해 주기 전에는 한 발짝도 움직이지 않겠다!\" 그러고는 논둑에 벌렁 드러누워 버립니다.", "terms": ["모내기: 봄에 볍씨를 키운 모를 논에 옮겨 심는 일. 일손이 많이 필요해 한 해 농사에서 가장 바쁜 때 중 하나입니다."]}, {"id": 5, "work": "봄봄", "sub": "봄봄 ⑤ 마지막", "title": "한바탕 싸움, 그리고 다시 일터로", "qlabel": "이 대목의 핵심", "quote": "장인님이 \"이 자식, 일 안 해!\" 하고 소리를 지르며 몽둥이를 들었다.", "text": "일을 하지 않고 누워 있는 사위를 보고 장인님이 가만있을 리 없습니다. 지게 막대기를 들고 달려와 '나'를 마구 때립니다. 맞고만 있던 '나'는 그만 장인님의 수염을 움켜쥐고 맞서고, 두 사람은 한데 엉켜 논바닥을 뒹굽니다. 구장님 집 앞에서 벌어진 일이라 온 마을 사람이 구경을 합니다.\n\n바로 그때 점순이가 달려옵니다. 그런데 편은 들어 주지 않고 오히려 '나'의 귀를 잡아당기며 \"이 바보야, 누구한테 이러니?\" 하고 야단을 칩니다. '나'는 어이가 없어 힘이 쭉 빠지고, 장인님은 그 틈을 타서 \"일어나서 일해라!\" 하고 호통을 칩니다. '나'는 결국 쓴웃음을 지으며 다시 일터로 돌아갑니다. 혼인은 여전히 기약이 없지만, 점순이에 대한 마음만은 그대로입니다. 웃음 속에 쓸쓸함이 남는 결말입니다.", "terms": ["지게: 짐을 등에 지고 나르는 우리나라 전통 운반 도구. 막대기는 그 지게를 받치는 긴 작대기입니다."]}, {"id": 6, "work": "동백꽃", "sub": "동백꽃 ① 시작", "title": "오늘도 또 쫓기는 우리 수탉", "qlabel": "원문 첫 문장", "quote": "오늘도 또 우리 수탉이 막 쫓기었다.", "text": "'나'는 산골 마을의 소작인 아들입니다. 집에 수탉 한 마리를 키우는데, 요즘은 그 수탉이 하루가 멀다 하고 얻어맞고 쫓겨 돌아옵니다. 닭 볏이 찢어지고 피가 흐르는 모습을 보면 속이 상합니다.\n\n그 닭을 이렇게 괴롭히는 건 바로 이웃집 점순이입니다. 점순이네는 마름 집안이라 마을에서 형편이 좋은 집이고, 점순이는 일부러 자기 집 큰 수탉을 우리 닭에게 풀어놓아 싸움을 붙입니다. 나는 점순이를 이길 수도 없고 함부로 대들 수도 없어, 주먹만 불끈 쥔 채 분을 삼킵니다.", "terms": ["소작인: 자기 땅이 없어서 남의 땅을 빌려 농사짓고 수확의 일부를 땅 주인에게 내는 농부.", "수탉: 수컷 닭. 서로 부리와 발톱으로 싸우는 습성이 있어 '닭싸움'을 붙이기도 했습니다."]}, {"id": 7, "work": "동백꽃", "sub": "동백꽃 ② 감자", "title": "점순이가 내민 구운 감자", "qlabel": "이 대목의 핵심", "quote": "느 집엔 이런 감자 없지?", "text": "이야기는 며칠 전으로 거슬러 올라갑니다. '나'가 혼자 울타리 옆에서 일을 하는데, 점순이가 슬그머니 다가와 따끈한 구운 감자 하나를 쑥 내밉니다. \"느 집엔 이런 감자 없지?\" 하며 자랑하듯 말합니다.\n\n'나'는 마음이 불편해서 \"우리도 있어, 너나 먹어\" 하고 거절합니다. 소작인 아들이 마름 집 딸에게 선물을 받는 것이 괜히 부끄럽고 두려웠기 때문입니다. 그러자 점순이는 얼굴이 새빨개지고 눈에 눈물이 맺히더니 감자를 도로 가져가 버립니다. 그때부터 점순이의 괴롭힘이 시작되었습니다. 사실 점순이는 마음을 표현하려 했는데, 눈치 없는 '나'가 그걸 모르고 거절한 것입니다.", "terms": ["감자 선물: 이 이야기에서는 점순이가 마음을 전하는 첫 번째 표시입니다. 그러나 '나'는 그 뜻을 알지 못합니다."]}, {"id": 8, "work": "동백꽃", "sub": "동백꽃 ③ 닭싸움", "title": "고추장을 먹인 수탉", "qlabel": "이 대목의 핵심", "quote": "닭이 힘을 내려면 고추장을 먹이면 되겠지.", "text": "그날 이후 점순이는 날마다 자기 집 수탉을 내 닭에게 달려들게 합니다. 어떤 날은 점순이가 닭싸움을 붙여 놓고는 울타리에 기대어 배를 잡고 웃기까지 합니다. 약이 오른 '나'는 닭을 이기게 해 줄 방법을 궁리합니다.\n\n\"그래, 닭이 기운이 없어서 그런 거야.\" 하고 생각한 '나'는 매운 고추장을 닭 입에 먹이면 기운이 솟을 거라 믿고 고추장을 가져다 먹입니다. 하지만 닭은 캑캑거리며 쓰러질 듯 비틀거릴 뿐입니다. 힘을 내기는커녕 더 약해져서 다시 싸움에서 지고 돌아옵니다. 점순이는 \"하하하\" 웃으며 약을 올립니다.", "terms": ["고추장: 고추를 갈아 메주가루와 섞어 숙성시킨 매운 장. 닭에게 먹이면 입 안이 타서 오히려 해롭습니다."]}, {"id": 9, "work": "동백꽃", "sub": "동백꽃 ④ 산 위", "title": "산비탈에서 만난 점순이", "qlabel": "이 대목의 핵심", "quote": "점순이는 풀피리를 불며 일부러 닭싸움을 붙였다.", "text": "어느 날 '나'는 나무를 하러 산에 올라갑니다. 지게에 한 짐 가득 나무를 해서 내려오려는데, 저쪽 바위 위에서 점순이가 호드기를 불며 앉아 있습니다. 그 옆에는 또 자기네 큰 수탉이 서 있습니다.\n\n점순이는 \"어서 와서 보라\"는 듯 일부러 닭을 풀어놓고, 이번에도 '나'의 수탉은 호되게 얻어맞습니다. 닭은 피투성이가 되어 곧 숨이 넘어갈 지경입니다. 그 모습을 보던 '나'의 마음속에서 참았던 화가 확 치밀어 오릅니다. \"이 못된 것, 이젠 안 참는다!\"", "terms": ["호드기: 봄에 물오른 버드나무 가지 껍질을 비틀어 빼서 만든 풀피리."]}, {"id": 10, "work": "동백꽃", "sub": "동백꽃 ⑤ 마지막", "title": "알싸한 동백꽃 향기", "qlabel": "원문 마지막 대목", "quote": "그 순간 달콤하고 알싸한 향기에 나는 땅이 꺼지는 듯이 정신이 아찔하였다.", "text": "화가 난 '나'는 작대기를 들어 점순네 수탉을 힘껏 내려칩니다. 그만 닭이 쓰러져 죽어 버립니다. 일이 이렇게 되자 '나'는 겁이 덜컥 납니다. 마름 집 닭을 죽였으니 이제 집안이 어떻게 될지 모릅니다. 눈물이 날 것 같아 땅바닥에 주저앉았습니다.\n\n그때 점순이가 다가와 \"너 이 담부터 안 그럴 테냐?\" 하고 묻습니다. '나'가 \"그래!\" 하고 대답하자 \"닭싸움 붙여도 그만두지?\" 하고 다시 묻고, '나'는 또 \"그래!\" 하고 답합니다. 순간 점순이가 '나'를 덮치듯 안아 함께 노란 동백꽃 무더기 속으로 쓰러지고, 꽃에서 풍기는 알싸한 향기에 '나'는 정신이 아찔해집니다. 점순이는 \"닭이 죽은 건 비밀로 해 주겠다\"는 듯 속삭이고, 두 사람 사이의 어색하던 마음은 풀려 버립니다. 이 이야기에서 말하는 '동백꽃'은 남쪽의 붉은 동백이 아니라, 강원도 봄 산에 노랗게 피는 생강나무 꽃입니다.", "terms": ["동백꽃(생강나무 꽃): 강원도에서는 이른 봄에 노란 꽃을 피우는 생강나무를 '동백'이라고 불렀습니다. 향기가 알싸하고 맵싸합니다.", "알싸하다: 맵고 쌉쌀한 향이 코를 쏘듯이 짜릿한 느낌."]}];
let currentIndex=0, synth=window.speechSynthesis, isSpeaking=false;
function termsHtml(s){return s.terms&&s.terms.length?'<h3>📝 낱말 풀이</h3><ul>'+s.terms.map(t=>'<li>'+t+'</li>').join('')+'</ul>':'';}
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
if(m==='book')renderBookSpread(currentIndex);else{synth.cancel();isSpeaking=false;}}
function renderBookSpread(i){if(i<0||i>=SCENES.length)return;currentIndex=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 10';
document.getElementById('bookSub').textContent=s.sub;
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQLabel').textContent=s.qlabel;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookTerms').innerHTML=termsHtml(s);
document.getElementById('bookPageIndicator').textContent=s.id+' / 10 쪽';
document.getElementById('sceneSlider').value=s.id;synth.cancel();isSpeaking=false;window.scrollTo(0,0);}
function prevScene(){if(currentIndex>0)renderBookSpread(currentIndex-1);}
function nextScene(){if(currentIndex<SCENES.length-1)renderBookSpread(currentIndex+1);}
function onSliderChange(v){renderBookSpread(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700">제 '+s.id+' 부 · '+s.sub+'</div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p><div class="terms"></div>';
d.querySelector('.gallery-title').textContent=s.title;d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';
d.querySelector('.gallery-text').textContent=s.text;d.querySelector('.terms').innerHTML=termsHtml(s);c.appendChild(d);});}
function toggleTtsCurrent(){if(isSpeaking){synth.cancel();isSpeaking=false;}else{
const u=new SpeechSynthesisUtterance(SCENES[currentIndex].title+'. '+SCENES[currentIndex].text);
u.lang='ko-KR';u.rate=.9;u.onend=()=>{isSpeaking=false;};synth.speak(u);isSpeaking=true;}}
let audioCtx=null,isMusicPlaying=false,musicTimer=null;
function toggleMusic(){if(isMusicPlaying){isMusicPlaying=false;clearTimeout(musicTimer);document.getElementById('btnMusic').classList.remove('active');}
else{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();
isMusicPlaying=true;document.getElementById('btnMusic').classList.add('active');
const notes=[523.25,587.33,659.25,783.99,880,1046.5];let idx=0;
function play(){if(!isMusicPlaying)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.frequency.setValueAtTime(notes[idx++%notes.length],audioCtx.currentTime);
g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+.05);
