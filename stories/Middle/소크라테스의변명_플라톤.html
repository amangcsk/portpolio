<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소크라테스의 변명 - 플라톤 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#2f4a5e;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.tts-btn{font-size:1.2rem;font-weight:700;background:#fff7e0;border:2px solid #c28b38}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div><span>📖</span> <span class="brand-title">플라톤 · 소크라테스의 변명</span></div>
<div class="nav-actions">
<button class="btn tts-btn" onclick="toggleTts()">🔊 읽어주기 (끝까지 이어서)</button>
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>
<div class="quote-label">이 장면의 한마디</div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn tts-btn" onclick="toggleTts()">🔊 읽어주기 (끝까지 이어서)</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="16" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 책은 플라톤의 「소크라테스의 변명」을 청소년이 읽기 쉽도록 줄거리 중심으로 풀어 쓴 것입니다. 원문 그대로가 아니며, 설명을 더하거나 줄인 곳이 있어 번역본과 다를 수 있습니다. 정확한 문장은 꼭 원작 번역본으로 확인해 주세요.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"title": "기원전 399년, 아테네의 법정", "quote": "일흔 살 소크라테스는 태어나 처음으로 재판을 받게 되었습니다.", "text": "기원전 399년, 지금으로부터 2,400년도 더 된 옛날에 그리스의 도시 아테네에서 재판이 열렸습니다. 재판을 받는 사람은 일흔 살 노인 소크라테스였습니다. 그는 돌을 다듬는 석공의 아들로 태어나, 평생 아테네의 거리와 시장을 돌아다니며 사람들과 이야기 나누기를 즐긴 철학자였습니다. 철학이란 ‘지혜를 사랑한다’는 뜻으로, 삶과 세상에 대해 끝까지 따져 묻는 공부를 말합니다.\n\n그를 고발한 사람은 멜레토스라는 젊은 시인이었고, 그 뒤에서 아니토스와 뤼콘이라는 사람들이 힘을 보탰습니다. 죄목은 크게 두 가지였습니다. 하나는 젊은이들을 나쁜 길로 이끌었다는 것이고, 다른 하나는 나라가 모시는 신들을 믿지 않고 새로운 신령한 것을 끌어들였다는 것이었습니다.\n\n재판은 판사 한 사람이 정하는 방식이 아니었습니다. 추첨으로 뽑힌 오백 명이 넘는 보통 시민들이 배심원이 되어 변론을 직접 듣고, 마지막에 표를 던져 결론을 냈습니다. 배심원이란 재판에서 말을 듣고 유죄인지 무죄인지 판단하는 시민을 말합니다.\n\n소크라테스는 일흔이 되도록 법정에 서 본 적이 한 번도 없다고 했습니다. 그래서 법정에서 쓰는 말투가 낯설다는 말로 이야기를 시작합니다.\n\n‘변명’이라는 제목은 오늘날 말하는 ‘핑계’와는 다릅니다. 원래의 뜻은 자기에게 쏟아진 고발에 대해 스스로 해명하고 맞서는 연설입니다. 이 글은 제자 플라톤이 스승의 재판을 바탕으로 쓴 것입니다. 플라톤도 그날 법정에 있었다고 직접 밝혔습니다. 이제부터 소크라테스가 오백 명 앞에서 무슨 말을 했는지 차근차근 따라가 보겠습니다.", "id": 1}, {"title": "말솜씨 없는 노인의 약속", "quote": "나는 꾸민 말이 아니라 평소 하던 대로, 있는 그대로 말하겠습니다.", "text": "소크라테스는 먼저 자기를 고발한 사람들의 말솜씨부터 이야기합니다. 그들의 말이 어찌나 그럴듯한지 자기도 하마터면 넘어갈 뻔했다고 합니다. 그런데 그 말 속에는 진실이 거의 없었다는 것입니다. 특히 어이없었던 것은 ‘소크라테스는 말을 아주 잘하니 속지 않도록 조심하라’는 경고였습니다. 지금 입을 열면 말재주가 없다는 사실이 곧 드러날 텐데, 그런 말을 하다니 부끄러움을 모른다는 것이지요.\n\n그러면서 그는 자기가 하려는 말은 곱게 다듬은 문장이 아니라 생각나는 대로 하는 솔직한 말이라고 밝힙니다. 시장의 환전상 탁자 곁에서, 또 여러 곳에서 늘 하던 말투 그대로 말하겠으니 낯설어하지 말라고 부탁합니다. 다른 나라에서 온 사람이 자기 나라 말투로 말하면 그대로 들어 주듯이, 일흔 살 노인이 평소 말투로 말하는 것도 이해해 달라는 것입니다.\n\n그가 배심원들에게 바란 것은 단 하나였습니다. 내 말이 옳은지 그른지만 살펴 달라는 것입니다. 소크라테스는 그것이 재판관이 갖추어야 할 좋은 태도이고, 연설하는 사람에게는 진실을 말하는 것이 그런 태도라고 했습니다.\n\n이어서 그는 이야기의 순서를 정합니다. 지금 자기를 고발한 멜레토스 등에게 답하기 전에, 먼저 아주 오래전부터 자기를 헐뜯어 온 소문부터 풀어야 한다고 합니다. 그 소문이 더 무섭다고 보았기 때문입니다.", "id": 2}, {"title": "오래된 소문과 돈 받는 선생들", "quote": "소크라테스가 하늘과 땅 밑을 캐고 나쁜 말을 좋게 꾸민다는 소문이 있었습니다.", "text": "소크라테스가 보기에 더 무서운 고발자들은 법정 밖에 있었습니다. 아테네 사람들이 어린 시절부터 귀에 못이 박히도록 들어 온 소문입니다. 소크라테스라는 지혜로운 사람이 있는데, 하늘 위의 일과 땅 밑의 일을 캐고 다니며, 약한 주장을 강한 주장처럼 보이게 만들고, 그 기술을 남에게 가르친다는 소문이었습니다.\n\n이 소문을 퍼뜨린 사람 가운데 이름이 알려진 한 사람이 희극 작가 아리스토파네스입니다. 그는 연극 『구름』에서 소크라테스라는 이름의 인물이 바구니를 타고 공중에 매달려 해를 살피는 우스꽝스러운 모습을 그렸습니다. 극장에서 그 장면을 본 사람들은 실제 소크라테스가 그런 사람이라고 믿게 되었습니다.\n\n소크라테스는 이 자리에 있는 많은 사람이 자기가 그런 이야기를 하는 것을 들은 적이 있느냐고 되묻습니다. 그런 적이 있는 사람은 이웃에게 말해 보라고 합니다. 자신은 그런 공부를 깎아내리려는 것이 아니라 그저 그것에 대해 아는 바가 없다는 것입니다.\n\n돈을 받고 가르친다는 말도 사실이 아니라고 합니다. 당시 아테네에는 고르기아스, 프로디코스, 힙피아스 같은 선생들이 있었습니다. 이들은 소피스트라고 불렸는데, 이는 돈을 받고 말하는 기술과 지식을 가르치던 선생들을 가리키는 말입니다. 소크라테스는 이들이 도시에서 도시로 다니며 젊은이들을 설득해 돈을 받고 가르친다고 말합니다. 자신에게도 그런 재주가 있다면 자랑스러웠겠지만, 그런 재주는 없다고 했습니다.", "id": 3}, {"title": "델포이의 신탁", "quote": "‘소크라테스보다 지혜로운 사람은 없다’는 신의 대답이 모든 일의 시작이었습니다.", "text": "그렇다면 어째서 소크라테스에게 ‘지혜롭다’는 이름이 붙었을까요? 소크라테스는 그 까닭을 이야기합니다. 어릴 적부터 친구였던 카이레폰이라는 사람이 있었습니다. 그는 무슨 일이든 열심히 하는 성격이었는데, 어느 날 그리스에서 가장 유명한 델포이의 신전에 찾아갔습니다. 델포이는 아폴론이라는 신을 모시는 곳이며, 그곳의 여사제가 신의 뜻을 전해 주는 것을 신탁이라고 합니다.\n\n카이레폰은 용감하게 물었습니다. 소크라테스보다 지혜로운 사람이 있느냐고요. 여사제는 없다고 대답했습니다. 카이레폰은 이미 세상을 떠났지만 그의 동생이 지금 이 법정에 있으니 사실인지 물어보라고 소크라테스는 말합니다.\n\n그 이야기를 전해 들은 소크라테스는 깜짝 놀랐습니다. 자신은 크든 작든 지혜롭지 않다는 것을 스스로 잘 알고 있었기 때문입니다. 신이 거짓말을 할 리는 없으니, 도대체 무슨 뜻일까 오랫동안 고민했습니다.\n\n그러다 한 가지 방법을 생각해 냅니다. 지혜롭다고 소문난 사람을 찾아가 이야기를 나누어 보고, 그가 정말 자기보다 지혜롭다면 신에게 가서 ‘이 사람이 저보다 지혜롭습니다’ 하고 말해 보겠다는 것입니다. 소크라테스는 이렇게 신의 말씀이 맞는지 틀린지를 직접 확인하러 나섰고, 이 일이 그의 남은 삶을 완전히 바꾸어 놓았습니다.", "id": 4}, {"title": "정치가, 시인, 장인을 찾아가다", "quote": "나는 모르는 것을 모른다고 여기는 만큼 그 사람보다 조금 더 지혜롭습니다.", "text": "소크라테스가 처음 찾아간 사람은 지혜롭기로 이름난 정치가였습니다. 이야기를 나누어 보니 그 사람은 다른 사람들에게도, 자기 자신에게도 지혜로운 사람처럼 보였지만 실제로는 그렇지 않았습니다. 소크라테스가 그 점을 일깨워 주려 하자 그 사람은 불쾌해했고, 곁에 있던 사람들도 소크라테스를 좋게 보지 않았습니다.\n\n돌아오는 길에 소크라테스는 이렇게 생각했습니다. ‘나는 저 사람보다 지혜롭다. 우리 둘 다 정말 중요한 것에 대해서는 아무것도 모르는 것 같다. 그런데 저 사람은 모르면서도 안다고 믿고, 나는 모르니까 모른다고 생각한다. 바로 그 작은 차이만큼 내가 조금 더 낫다.’\n\n다음에는 시인들을 찾아갔습니다. 소크라테스는 시인들이 쓴 작품 가운데 가장 잘 썼다고 생각되는 구절을 들고 가서 무슨 뜻인지 물었습니다. 그런데 곁에 있던 사람들이 시인보다 더 잘 설명하는 경우가 많았습니다. 그는 시인들이 지혜로 시를 쓰는 것이 아니라 타고난 재능과 영감으로 쓴다는 것을 알게 되었습니다. 예언자가 좋은 말을 하면서도 자기가 무슨 말을 하는지 모르는 것과 비슷하다는 것입니다.\n\n마지막으로 기술을 가진 장인들을 찾아갔습니다. 그들은 정말 자기 일에 대해서는 소크라테스가 모르는 것을 많이 알고 있었습니다. 하지만 자기 일을 잘하니 다른 중요한 일도 잘 안다고 생각하는 잘못을 저지르고 있었고, 그 때문에 그들의 지식이 빛을 잃고 있었습니다.", "id": 5}, {"title": "신이 맡기신 일, 그리고 미움", "quote": "내가 이 일을 계속하는 것은 신이 내게 맡긴 일이기 때문입니다.", "text": "이렇게 사람들을 찾아다니는 동안 소크라테스는 많은 사람에게 미움을 샀고, 그 미움은 날이 갈수록 깊어졌습니다. 게다가 사람들은 그가 남의 잘못을 밝혀낼 때마다 ‘저 사람은 정말 지혜롭구나’ 하고 생각했습니다. 그는 이것도 오해라고 말합니다. 실제로 지혜로운 것은 신뿐이라는 것입니다.\n\n소크라테스가 이해한 신탁의 뜻은 이러했습니다. 사람의 지혜는 신의 지혜에 비하면 거의 보잘것없다는 것입니다. 그리고 신이 ‘소크라테스가 가장 지혜롭다’고 한 것은 이 사람을 본보기로 삼아, 자기 지혜가 보잘것없음을 아는 사람이 가장 지혜로운 사람이라고 가르치려 한 것이라는 풀이입니다.\n\n그래서 그는 신을 섬기는 마음으로 지금도 아테네 시민이든 외국인이든 지혜롭다고 생각되는 사람이 있으면 찾아가 살펴보고, 실은 지혜롭지 않다는 것을 깨우쳐 준다고 합니다. 이 일에 매달리느라 나랏일에 참여할 틈도 없었고 집안일을 돌볼 틈도 없어서, 지금은 아주 가난하게 살고 있다고 말합니다.\n\n그런데 집안이 넉넉하고 시간 여유가 많은 젊은이들이 스스로 소크라테스를 따라다니며 사람들이 질문에 답하지 못하고 쩔쩔매는 모습을 구경하길 좋아했고, 자기들도 흉내를 내어 다른 사람들을 따져 묻기 시작했습니다. 그러자 질문을 받은 사람들은 자기 잘못을 돌아보는 대신 ‘소크라테스라는 나쁜 놈이 젊은이들을 망친다’고 화를 냈습니다. 그리고 소크라테스가 무엇을 가르치기에 그러느냐고 물으면 대답할 말이 없어서 ‘하늘과 땅 밑의 일을 살핀다, 신을 믿지 않는다, 나쁜 말을 좋게 만든다’ 같은 흔한 비난만 되풀이했다는 것입니다.", "id": 6}, {"title": "멜레토스를 심문하다 ①  누가 젊은이를 좋게 만드는가", "quote": "젊은이를 좋게 만드는 일에 관심이 있다면 누가 그들을 낫게 하는지 말해 보시오.", "text": "이제 소크라테스는 새로운 고발자인 멜레토스에게 직접 질문합니다. 법정에서 고발당한 사람이 고발한 사람에게 따져 묻는 장면입니다. 소크라테스는 멜레토스에게 ‘젊은이들을 가장 좋은 사람으로 만드는 것이 당신에게 중요한 일이라고 했으니, 누가 그들을 더 좋게 만드는지 말해 보라’고 합니다.\n\n멜레토스는 처음에 ‘법’이라고 대답합니다. 소크라테스가 ‘그것을 만든 사람이 누구인지 묻는 것’이라고 하자 ‘재판관들’이라고 합니다. 이 법정에 앉은 모든 사람이냐고 물으니 ‘그렇다’고 합니다. 방청객도 그렇다, 의회 의원도 그렇다, 시민 모임에 나온 사람들도 그렇다고 합니다. 결국 멜레토스는 아테네 사람 모두가 젊은이를 좋게 만들고, 소크라테스 한 사람만 나쁘게 만든다고 말한 셈이 되었습니다.\n\n소크라테스는 이것을 말에 비유합니다. 말을 훌륭하게 길들일 수 있는 사람은 말을 다루는 일을 배운 소수의 조련사이고, 보통 사람들은 오히려 말을 망치기 쉽다는 것입니다. 젊은이를 가르치는 일도 마찬가지일 텐데, 멜레토스는 한 번도 젊은이들의 좋은 점을 위해 마음을 쓴 적이 없다는 것이 이것으로 드러났다고 말합니다.\n\n또 한 가지를 묻습니다. 나쁜 사람 곁에 살면 해를 입고 좋은 사람 곁에 살면 이익을 얻는다는 것은 누구나 압니다. 그렇다면 자기가 해를 입기를 바라는 사람이 있겠느냐고요. 만약 내가 일부러 젊은이들을 나쁘게 만들어 나쁜 이웃이 되고 스스로 해를 입는다면 바보일 것이고, 내가 몰라서 그랬다면 잘못을 일깨워 가르쳐 주면 될 일이지 법정에 끌고 올 일이 아니라는 것입니다.", "id": 7}, {"title": "멜레토스를 심문하다 ②  신을 믿는가", "quote": "신령한 것은 믿는다면서 어떻게 신은 안 믿는다고 하는 것입니까?", "text": "멜레토스는 더 나아가 소크라테스가 신을 전혀 믿지 않는다고 주장했습니다. 심지어 소크라테스가 해를 돌이라고 하고 달을 흙이라고 말하는 사람이라고 했습니다. 소크라테스는 웃으며 ‘당신은 아낙사고라스를 고발하는 것이냐’고 되묻습니다. 그런 이야기는 아낙사고라스라는 철학자가 쓴 책에 나오는데, 그 책은 시장에서 아주 싼값에 구할 수 있어서 젊은이들이 소크라테스에게 배울 필요도 없다는 것입니다.\n\n그리고 소크라테스는 멜레토스의 앞뒤가 맞지 않는 점을 파고듭니다. 멜레토스는 한편으로는 소크라테스가 ‘새로운 신령한 것’을 믿는다고 고발했고, 다른 한편으로는 ‘신을 전혀 믿지 않는다’고 말했습니다. 그런데 신령한 것을 믿는 사람이 어떻게 신을 믿지 않을 수 있느냐고 묻습니다.\n\n신령한 것이란 신의 자식이나 신에 가까운 존재라고 사람들은 믿어 왔습니다. 그렇다면 신의 자식은 믿으면서 신은 믿지 않는다는 말이 됩니다. 소크라테스는 이것을 노새에 빗대어 말합니다. 말과 당나귀의 새끼인 노새가 있다고 믿으면서, 말과 당나귀가 있다는 것은 믿지 않는다는 말과 같다는 것입니다.\n\n이어서 소크라테스는 이렇게 정리합니다. 멜레토스의 고발장은 마치 수수께끼 같아서, 일부러 자기를 시험해 보려고 쓴 것처럼 앞뒤가 맞지 않는다고 합니다. 그러면서 자신이 유죄가 된다면 멜레토스나 아니토스 때문이 아니라 많은 사람의 미움과 시기심 때문일 것이라고 말합니다. 이 미움이 이미 수많은 훌륭한 사람을 쓰러뜨렸고, 앞으로도 그럴 것이라고요.", "id": 8}, {"title": "나는 죽음을 두려워하지 않습니다", "quote": "죽음이 무엇인지 모르면서 나쁜 것이라고 단정하는 것이야말로 모르면서 안다고 믿는 것입니다.", "text": "혹시 누군가는 이렇게 물을지 모릅니다. 이런 삶을 살다가 죽을 위험에 처했는데 부끄럽지 않으냐고요. 소크라테스는 대답합니다. 쓸모 있는 사람이라면 살 수 있는지 죽을 수 있는지를 따질 것이 아니라, 자기가 하는 일이 옳은 일인지 그른 일인지, 좋은 사람이 할 일인지 나쁜 사람이 할 일인지만 살펴야 한다고 말입니다.\n\n그는 트로이 전쟁의 영웅 아킬레우스를 예로 듭니다. 아킬레우스의 어머니는 여신이었는데, 아들이 친구의 원수를 갚으면 곧 죽게 된다고 일러 주었습니다. 그래도 아킬레우스는 죽음이나 위험보다 비겁하게 사는 것을 더 두려워해서 원수를 갚으러 나갔습니다.\n\n소크라테스 자신도 아테네가 전쟁을 치르던 포티다이아, 암피폴리스, 델리온 같은 전쟁터에서 지휘관이 맡긴 자리를 끝까지 지켰습니다. 그런데 이번에는 신이 ‘철학을 하며 자기 자신과 남을 살피는 삶을 살라’고 맡긴 자리가 있는데, 죽음이 두렵다고 그 자리를 떠난다면 그야말로 부끄러운 일이라고 합니다.\n\n그는 죽음을 두려워하는 것이야말로 알지 못하는 것을 안다고 믿는 어리석음이라고 합니다. 아무도 죽음이 좋은 것 중 가장 좋은 것일지 모른다는 것을 알지 못하면서, 마치 가장 나쁜 것인 양 두려워한다는 것입니다.\n\n그러면서 만약 ‘철학을 그만두겠다고 약속하면 풀어 주겠다’고 한다면 어떻게 하겠느냐고 스스로 묻습니다. 그의 대답은 분명했습니다. 아테네 시민들을 사랑하고 존경하지만 나는 여러분보다 신에게 복종하겠다고, 숨을 쉬는 동안, 힘이 있는 동안은 철학을 그만두지 않겠다고 말입니다.", "id": 9}, {"title": "나는 아테네의 등에입니다", "quote": "내가 없어지면 여러분은 졸다가 영영 깨어나지 못할 수도 있습니다.", "text": "소크라테스는 자기를 죽이면 오히려 아테네에 손해라고 말합니다. 그리고 이렇게 빗댑니다. 말 가운데에는 몸집이 크고 혈통이 좋지만 큰 몸 때문에 굼뜬 말이 있습니다. 그런 말에게는 등에 같은 것이 달라붙어 쏘아 주어야 정신을 차립니다. 등에란 말이나 소에 붙어 피를 빨며 살갗을 따끔하게 쏘는 큰 파리 같은 벌레를 말합니다.\n\n아테네는 크고 이름난 나라이지만 그만큼 졸고 있기 쉽습니다. 신이 자기를 이 나라에 붙여 놓은 것은 바로 그 등에와 같은 역할을 하라는 것이라고 소크라테스는 말합니다. 하루 종일 어디서나 여러분 한 사람 한 사람 곁에 붙어서 깨우고, 설득하고, 꾸짖는 일을 그치지 않는다는 것입니다.\n\n그러니 나를 죽이면 이런 사람을 쉽게 다시 찾기 어려울 것이고, 신이 여러분을 불쌍히 여겨 또 한 사람을 보내 주지 않는 한 여러분은 남은 인생을 졸며 보내게 될 것이라고 경고합니다. 소크라테스는 이것이 자기를 위한 말이 아니라 여러분을 위한 말이라고 강조합니다.\n\n그가 신이 보낸 사람이라고 믿는 이유도 이야기합니다. 보통 사람이라면 몇 해씩이나 자기 집안일을 돌보지 않고 남의 일에만 매달릴 수는 없다는 것입니다. 그는 아버지나 형처럼 사람 한 사람 한 사람을 찾아다니며 재산이나 명예보다 마음을 가꾸는 일, 곧 좋은 사람이 되는 일에 마음을 쓰라고 권했습니다.\n\n만약 돈을 벌려고 한 일이었다면 돈을 받았을 것이지만, 부끄러움을 모르는 고발자들조차 소크라테스가 돈을 받거나 요구했다는 증인을 한 명도 세우지 못했습니다. 소크라테스는 자신의 가난이 가장 확실한 증거라고 말합니다.", "id": 10}, {"title": "내 안의 신령한 목소리와 정치", "quote": "정의를 위해 싸우는 사람이 정치에 오래 남아 목숨을 보전하기는 어렵습니다.", "text": "어떤 사람은 이렇게 물을지도 모릅니다. 그렇게 남의 일에 참견하고 다니면서 어째서 나랏일에는 나서서 충고하지 않았느냐고요. 소크라테스는 어릴 때부터 자기에게 찾아오는 신령한 목소리 때문이라고 설명합니다. 그것은 목소리 같은 것인데, 무엇을 하라고 시키는 법은 없고 늘 하려던 일을 말리기만 한다고 합니다. 바로 그 목소리가 정치에 뛰어드는 것을 막았다는 것입니다.\n\n그는 그것이 옳은 판단이었다고 말합니다. 정치에 나섰다면 자기는 이미 오래전에 죽었을 것이고, 여러분에게도 자기에게도 도움이 되지 못했을 거라는 것입니다. 정의를 위해 끝까지 싸우려는 사람은 민주주의 나라든 어떤 나라든 큰 무리에 맞서서는 오래 살아남기 어렵다고 합니다.\n\n그리고 증거로 두 가지 사건을 이야기합니다. 첫째는 아르기누사이라는 바다에서 벌어진 전투 뒤의 일입니다. 아테네는 이겼지만 쓰러진 병사를 건지지 못했다는 이유로 장군들을 한꺼번에 재판에 세우려 했는데, 이것은 법을 어기는 일이었습니다. 마침 소크라테스는 의회에서 회의를 이끄는 당번이었는데 그 자리에서 혼자 반대했습니다. 연설가들이 감옥에 가두겠다, 죽이겠다고 위협했지만 그는 법과 정의 편에 서는 것이 옳다고 보았습니다.\n\n둘째는 아테네에 폭력적인 30인 참주의 정권이 들어섰던 때의 일입니다. 그들은 소크라테스를 포함한 다섯 사람을 불러 살라미스 사람 레온을 붙잡아 오라고 명령했습니다. 레온은 억울하게 죽게 될 사람이었습니다. 다른 네 사람은 명령대로 했지만 소크라테스는 그냥 집으로 돌아갔습니다. 그 정권이 곧 무너지지 않았다면 자신도 죽었을 것이라고 합니다. 이 두 일로 그는 죽음이 두려워서 옳은 일을 버리지 않는다는 것을 보였다고 말합니다.", "id": 11}, {"title": "눈물로 호소하지 않겠습니다", "quote": "재판관이 있는 것은 선심을 쓰려는 것이 아니라 법에 따라 판단하려는 것입니다.", "text": "소크라테스는 자기는 누구의 선생도 아니었다고 다시 한번 밝힙니다. 누구든 자기가 하는 말을 듣고 싶어서 곁에 오면 가난한 사람이든 부자든 가리지 않았고, 그 가운데 누가 잘되었거나 잘못되었다고 해서 자기 책임이라고 할 수 없다는 것입니다.\n\n그는 곁에 있던 사람들 가운데 이 자리에 나와 있는 이들을 가리킵니다. 같은 나이였던 친구 크리톤과 그의 아들 크리토불로스, 그리고 플라톤과 아폴로도로스 같은 사람들입니다. 만약 소크라테스가 이들을 정말 나쁜 사람으로 만들었다면, 이제 어른이 된 이들이 스스로 나와 증언했을 것입니다. 아직 어린 사람이라면 그 아버지나 형제들이 나와 소크라테스에게 책임을 물었을 것입니다. 그러나 오히려 이들은 소크라테스를 도우려고 이곳에 와 있습니다. 이것이야말로 멜레토스가 거짓말을 했다는 증거라고 말합니다.\n\n그런 다음 소크라테스는 법정의 관례를 이야기합니다. 보통 재판받는 사람은 눈물을 흘리며 배심원에게 용서를 빌고, 어린 자식들과 가족을 데려와 동정을 얻으려 합니다. 소크라테스에게도 자식이 셋 있었는데 하나는 청소년이고 둘은 아직 어렸지만, 그는 아무도 데려오지 않았습니다.\n\n그것은 자기가 잘난 척해서도, 여러분을 얕보아서도 아니라고 말합니다. 그런 모습은 자기에게도, 여러분에게도, 나라 전체에도 부끄러운 일이라는 것입니다. 지혜롭다는 이름을 얻은 사람이 눈물로 목숨을 구걸하는 모습을 보인다면 다른 사람들이 아테네를 얕볼 것이라고 했습니다.\n\n또 재판관은 선심을 베푸는 자리가 아니라 법에 따라 판단하겠다고 맹세한 자리에 앉아 있다고 말합니다. 눈물로 호소해서 맹세를 깨뜨리게 만든다면 그것은 오히려 신을 믿지 않는 행동을 가르치는 일이 될 것이라고 합니다.", "id": 12}, {"title": "유죄 판결과 소크라테스가 제안한 벌", "quote": "살펴보지 않는 삶은 사람이 살 만한 삶이 아닙니다.", "text": "투표가 끝나고 소크라테스는 유죄 판결을 받았습니다. 그는 이 결과에 화내지 않았다고 말합니다. 오히려 이미 예상한 일이었고, 놀라운 것은 표 차이가 생각보다 적다는 점이었다고 합니다. 겨우 서른 표만 반대쪽으로 돌았더라면 무죄가 되었을 것이라고 했습니다.\n\n그다음에는 형벌을 정하는 차례가 왔습니다. 고발자 멜레토스는 사형을 요구했습니다. 이럴 때는 유죄 판결을 받은 사람이 자기에게 알맞다고 생각하는 벌을 따로 제안할 수 있었고, 배심원은 둘 중 하나를 골라야 했습니다.\n\n소크라테스는 이렇게 말합니다. 나는 평생 여러분이 더 좋은 사람이 되도록 돕는 일을 했으니, 마땅히 받아야 할 것은 벌이 아니라 대접이다. 올림픽에서 이긴 사람들에게 나라가 영빈관에서 식사를 대접하듯이 나도 그렇게 대접받아야 한다고요. 영빈관이란 나라에 큰 공을 세운 사람이나 귀한 손님을 모시는 곳입니다. 이 말을 들은 사람들은 더욱 화를 냈습니다.\n\n그는 감옥에 가는 것도, 나라 밖으로 쫓겨나는 것도 받아들이지 않겠다고 했습니다. 나이 든 자신이 어디로 가든 그곳 젊은이들이 따라다닐 테고, 입을 다물고 조용히 살라는 말은 신을 거스르는 일이어서 따를 수 없다는 것입니다. 그러면서 이런 유명한 말을 합니다. 살펴보지 않는 삶은 사람이 살 만한 삶이 아니라고요. 날마다 좋은 삶에 대해 이야기하며 자기와 남을 살피는 것이 사람이 할 수 있는 가장 좋은 일이라는 뜻입니다.\n\n끝으로 그는 돈이 없다는 것을 알면서도 벌금 1므나(당시의 돈 단위)를 내겠다고 했습니다. 그리고 친구들인 플라톤, 크리톤, 크리토불로스, 아폴로도로스가 30므나로 올리라며 자기들이 보증을 서겠다고 해서 그렇게 제안했습니다. 그러나 배심원들은 이를 받아들이지 않고 사형을 택했습니다.", "id": 13}, {"title": "사형을 선고받은 뒤 ①  나를 죽인 사람들에게", "quote": "나를 죽여서 비판을 막을 수 있다고 생각한다면 큰 착각입니다.", "text": "사형 선고를 받은 소크라테스는 먼저 자기에게 유죄 표를 던진 사람들에게 말합니다. 여러분은 조금만 기다렸으면 저절로 죽었을 늙은 사람 하나를 죽였을 뿐인데, 이제 ‘지혜로운 사람을 죽인 도시’라는 나쁜 이름을 얻게 되었다고요. 소크라테스는 자신이 지혜롭다고 생각한 적이 없지만, 사람들은 자기들의 잘못을 가리려고 그렇게 말할 것이라는 뜻입니다.\n\n그는 자기가 진 것은 말솜씨가 모자랐기 때문이 아니라 뻔뻔함이 모자랐기 때문이라고 말합니다. 눈물로 호소하고, 듣기 좋은 소리를 하고, 남들이 하는 대로 했더라면 풀려났을지도 모르지만 그런 방식으로 위험을 피하고 싶지는 않았다는 것입니다. 그리고 부끄럽게 사느니 올바르게 죽겠다고 합니다.\n\n또 예언 같은 말을 남깁니다. 여러분은 이제 삶을 돌아보라는 요구에서 벗어나려고 나를 죽였지만, 결과는 정반대가 될 것이다. 나를 비판하던 사람이 더 많아질 것이다. 지금까지는 내가 막고 있었지만 앞으로는 젊고 더 거칠게 따져 묻는 사람들이 나올 것이고 여러분은 그들을 막지 못할 것이다.\n\n그러면서 그는 이렇게 충고합니다. 사람을 죽여서 잘못을 지적하는 사람의 입을 막으려는 것은 좋은 방법이 아니다. 가장 쉽고 가장 훌륭한 방법은 다른 사람의 입을 막는 것이 아니라 자기 자신이 가능한 한 훌륭한 사람이 되도록 노력하는 것이라고 말합니다. 이것이 자신에게 유죄를 선고한 사람들에게 남기는 마지막 예언이자 충고였습니다.", "id": 14}, {"title": "사형을 선고받은 뒤 ②  나를 풀어 준 사람들에게", "quote": "오늘 내 신령한 목소리는 한 번도 나를 말리지 않았습니다.", "text": "다음에는 무죄 표를 던져 준 사람들에게 말합니다. 소크라테스는 이들을 ‘친구들’이라고 부르며, 아직 관리들이 바빠서 나를 감옥으로 데려가기 전이니 그동안 나와 이야기를 나누자고 청합니다.\n\n그러고는 신기하게 느낀 일을 털어놓습니다. 평소에는 아주 사소한 일을 하려 할 때도 그의 신령한 목소리가 불쑥 나타나 자주 말렸습니다. 그런데 오늘만은 아침에 집을 나설 때도, 법정으로 올 때도, 연설하는 도중에도 한 번도 그가 하려던 일을 말리지 않았다고 합니다. 이 일 전체를 두고 그 목소리가 조용했다는 것입니다.\n\n소크라테스는 그것을 이렇게 풀이합니다. 지금 내게 일어난 일은 좋은 일일 수 있다는 것이다. 죽음이 나쁜 것이라고 우리가 믿는 것은 아마도 잘못일 것이다. 만약 내가 하려는 일이 나쁜 것이었다면 그 목소리가 틀림없이 막았을 텐데, 아무 말도 하지 않았으니 이것이 좋은 일의 증거라는 말입니다.\n\n이 대목에서 소크라테스는 사람이 두려워하는 죽음이 어떤 것인지 차분히 살펴보기 시작합니다. 이 긴 이야기는 다음 장면에서 이어집니다. 사형을 앞두고도 겁에 질리지 않고 오히려 평소처럼 질문하고 생각하는 모습이 이 장면의 핵심입니다.", "id": 15}, {"title": "죽음은 나쁜 것이 아닐지도 모릅니다", "quote": "떠날 때가 되었습니다. 나는 죽으러, 여러분은 살러 가지만 어느 쪽이 더 좋은지는 신만이 압니다.", "text": "소크라테스는 죽음에 두 가지 가능성이 있다고 말합니다. 하나는 죽음이 아무것도 없는 상태, 곧 느낌도 생각도 없는 것이라는 가능성입니다. 그렇다면 죽음은 꿈 하나 꾸지 않는 깊은 잠과 같을 것입니다. 살아오면서 그렇게 푹 잔 밤을 떠올려 보고 그보다 더 즐겁게 보낸 낮과 밤이 얼마나 되는지 세어 보면, 그런 죽음은 오히려 큰 이득이라는 것입니다.\n\n다른 하나는 죽음이 영혼이 이 세상에서 다른 곳으로 옮겨 가는 것이라는 이야기입니다. 정말 그렇다면 저세상에서는 오르페우스나 헤시오도스, 호메로스 같은 옛 시인들과 이야기를 나눌 수 있고, 트로이 전쟁의 영웅들도 만날 수 있을 것이라고 합니다. 그곳에서도 사람들을 만나 누가 지혜롭고 누가 지혜롭다고 착각하고 있는지 따져 보는 일을 계속할 수 있다면 그보다 큰 행복이 어디 있겠느냐고 말합니다. 더구나 저세상에서는 질문한다고 사람을 죽이지 않을 것이라고 농담처럼 덧붙입니다.\n\n그래서 그는 판결 앞에서 모두에게 밝은 희망을 가지라고 말합니다. 착한 사람에게는 살아 있을 때나 죽은 뒤에나 나쁜 일이 없고, 신들은 그의 일을 모른 체하지 않는다는 것입니다. 그는 자기를 고발한 사람들에게도 화를 내지 않는다고 합니다. 해를 끼치려는 마음은 있었으니 꾸짖을 만하다는 말은 남겼습니다.\n\n마지막으로 그는 한 가지만 부탁합니다. 내 아들들이 자라서 덕보다 재물을 앞세우거나, 별것 아니면서 대단한 사람인 척하면 내가 여러분을 괴롭혔던 것처럼 그들을 괴롭혀 달라고요. 그래야 나도 내 아들들도 여러분에게서 공정한 대접을 받는 것이라고 말합니다.\n\n그리고 이렇게 끝맺습니다. 이제 떠날 시간이 되었다. 나는 죽으러 가고 여러분은 살러 간다. 우리 가운데 누가 더 좋은 길로 가는지는 신만이 안다. 플라톤의 다른 글에 따르면 소크라테스는 이 뒤 한 달쯤 감옥에 있다가 친구들이 지켜보는 가운데 독이 든 잔을 마시고 세상을 떠났다고 전해집니다.\n\n이 이야기는 지금도 우리에게 묻습니다. 나는 정말 아는 것일까, 아니면 안다고 믿고 있을 뿐일까. 그리고 내 마음을 돌보는 일을 돈이나 이름보다 더 소중하게 여기고 있을까 하고 말입니다.", "id": 16}];
let cur=0,synth=window.speechSynthesis,reading=false,token=0;
function stopReading(){reading=false;token++;try{synth.cancel();}catch(e){}
document.querySelectorAll('.tts-btn').forEach(b=>{b.textContent='🔊 읽어주기 (끝까지 이어서)';b.classList.remove('active');});}
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
stopReading();render(cur);}
function render(i){if(i<0||i>=SCENES.length)return;cur=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 16';
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookPageIndicator').textContent=s.id+' / 16 쪽';
document.getElementById('sceneSlider').value=s.id;
if(document.getElementById('galleryView').style.display==='flex'){const c=document.querySelectorAll('.gallery-card')[i];if(c)c.scrollIntoView({behavior:'smooth',block:'start'});}else window.scrollTo(0,0);}
function userGo(i){stopReading();render(i);}
function prevScene(){if(cur>0)userGo(cur-1);}
function nextScene(){if(cur<SCENES.length-1)userGo(cur+1);}
function onSliderChange(v){userGo(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700"></div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p>';
d.firstChild.textContent='제 '+s.id+' 부';d.querySelector('.gallery-title').textContent=s.title;
d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';d.querySelector('.gallery-text').textContent=s.text;c.appendChild(d);});}
function speakScene(i,myToken){
if(!reading||myToken!==token)return;
render(i);
const s=SCENES[i];
const u=new SpeechSynthesisUtterance('제 '+s.id+' 부. '+s.title+'. '+s.text.replace(/\n+/g,' '));
u.lang='ko-KR';u.rate=.9;
u.onend=()=>{if(!reading||myToken!==token)return;
 if(i<SCENES.length-1){setTimeout(()=>speakScene(i+1,myToken),700);}
 else{stopReading();}};
u.onerror=()=>{};
synth.speak(u);}
function toggleTts(){
if(!synth){alert('이 기기에서는 읽어주기를 쓸 수 없습니다.');return;}
if(reading){stopReading();return;}
try{synth.cancel();}catch(e){}
reading=true;token++;
document.querySelectorAll('.tts-btn').forEach(b=>{b.textContent='⏹ 읽기 멈추기';b.classList.add('active');});
speakScene(cur,token);}
let ac=null,playing=false,mt=null;
function toggleMusic(){if(playing){playing=false;clearTimeout(mt);document.getElementById('btnMusic').classList.remove('active');}
else{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
playing=true;document.getElementById('btnMusic').classList.add('active');
const n=[523.25,587.33,659.25,783.99,880,1046.5];let k=0;
(function play(){if(!playing)return;const o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(n[k++%n.length],ac.currentTime);
g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.06,ac.currentTime+.05);
g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.8);o.connect(g);g.connect(ac.destination);
o.start();o.stop(ac.currentTime+1.9);mt=setTimeout(play,900);})();}}
window.onload=()=>{render(0);buildGallery();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScene();if(e.key==='ArrowLeft')prevScene();});
</script></body></html>
