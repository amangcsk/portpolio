<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데미안 - 헤르만 헤세 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#3b3a5c;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div><span>📖</span> <span class="brand-title">헤르만 헤세 · 데미안</span></div>
<div class="nav-actions">
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>
<div class="quote-label">이 장면의 한마디</div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn" onclick="toggleTtsCurrent()">🔊 읽어주기</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="15" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 책은 헤르만 헤세의 「데미안」 원문이 아니라, 줄거리를 쉬운 말로 풀어 길게 엮은 이야기책입니다. 세부 장면은 보태거나 줄인 곳이 있어 원작과 다를 수 있으니, 자세한 내용은 꼭 원작 책으로 확인해 주세요.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"title": "나 자신의 이야기를 쓰는 까닭", "quote": "사람은 누구나 단 한 번뿐인 소중한 시도이다.", "text": "이 이야기는 에밀 싱클레어라는 사람이 어른이 되어 자기 어린 시절부터 젊은 날까지를 돌아보며 쓴 기록입니다. 그는 이야기를 시작하기에 앞서 이렇게 마음을 밝힙니다. 자기는 남들이 만들어 준 길이 아니라, 자기 안에서 저절로 솟아 나오는 것을 살아 보려고 했을 뿐인데, 그것이 왜 그토록 어려웠는지 적어 보고 싶다는 것입니다.\n\n싱클레어는 사람이란 저마다 자연이 단 한 번 시도해 본, 다시는 되풀이되지 않는 소중한 존재라고 믿습니다. 그러면서도 대부분의 사람들은 그 사실을 모른 채 남들과 똑같이 살다 갑니다. 그는 자기 이야기가 대단해서가 아니라, 자기 자신에게로 가는 길을 걸어 보았기 때문에 글로 남긴다고 말합니다. 그 길은 누구에게나 쉽지 않고, 때로는 무섭기까지 한 길입니다. 이제 그 길의 첫 장면, 열 살 무렵의 어린 싱클레어의 이야기가 시작됩니다.", "id": 1}, {"title": "밝은 세계와 어두운 세계", "quote": "세상은 두 개로 나뉘어 있었고, 나는 그 사이에 서 있었다.", "text": "열 살 무렵의 싱클레어는 작은 도시의 라틴어 학교에 다니는 소년이었습니다. 그의 집은 부유하고 따뜻한 집안이었습니다. 아버지와 어머니는 점잖고 다정했고, 집 안에는 맑은 기도 소리와 깨끗한 옷, 부드러운 목소리, 책과 단정한 예절이 있었습니다. 싱클레어는 그것을 '밝은 세계'라고 느꼈습니다.\n\n그런데 집 바로 옆에는 또 하나의 세계가 숨 쉬고 있었습니다. 부엌에서 일하는 하녀들이 수군거리는 귀신 이야기, 시장에서 싸우는 사람들, 술 취한 장인들, 경찰에게 끌려가는 사람들, 무섭고 끔찍한 소문들이 거기에 있었습니다. 싱클레어는 그것을 '어두운 세계'라고 불렀습니다. 이상하게도 그는 밝은 집에 있으면서도 어두운 세계가 몹시 궁금했고, 한편으로는 두려웠습니다. 두 세계의 경계가 얇다는 것을 소년은 어렴풋이 알고 있었습니다. 그리고 곧 그 경계를 넘어서는 일이 벌어집니다.", "id": 2}, {"title": "크로머에게 한 거짓말", "quote": "자랑하고 싶은 마음이 나를 어두운 곳으로 이끌었다.", "text": "어느 날 싱클레어는 동네 아이들과 어울려 놀다가, 열세 살 정도 된 거친 소년 프란츠 크로머를 알게 되었습니다. 크로머는 하층민 집안의 아이로, 힘이 세고 말투가 거칠었습니다. 싱클레어는 그에게 잘 보이고 싶은 마음에 그만 거짓말을 해 버렸습니다. 어느 과수원에서 사과를 훔친 일이 있다고 큰소리를 쳤던 것입니다. 사실은 그런 일이 없었습니다.\n\n크로머는 그 말에 눈을 번쩍 뜨더니, 과수원 주인이 도둑을 잡아 오면 상금을 준다고 했다며, 이 일을 이르면 어떻게 되는지 아느냐고 위협했습니다. 놀란 싱클레어가 거짓말이었다고 털어놓았지만 소용이 없었습니다. 크로머는 입을 다물어 줄 테니 돈을 내놓으라고 했습니다. 싱클레어는 순식간에 어두운 세계의 사슬에 묶인 몸이 되고 말았습니다. 거짓말 하나가 소년의 마음을 이렇게까지 무겁게 짓누를 줄은 누구도 몰랐습니다.", "id": 3}, {"title": "끝나지 않는 협박", "quote": "나는 어디에서도 평화를 찾을 수 없었다.", "text": "싱클레어는 가진 돈이 없었습니다. 그는 몰래 저금통을 털어 크로머에게 건네 보았지만, 크로머는 더 많은 돈을 요구했습니다. 휘파람 소리가 들리면 싱클레어는 가슴이 철렁했습니다. 크로머가 부르는 신호였기 때문입니다. 크로머는 점점 더 모질어져서 싱클레어를 심부름꾼처럼 부리고, 나중에는 싱클레어의 누이까지 데려오라고 윽박질렀습니다.\n\n싱클레어는 밥을 먹을 수도, 잠을 잘 수도 없었습니다. 집은 여전히 밝고 따뜻했지만, 그는 더 이상 그 세계에 속한 사람처럼 느껴지지 않았습니다. 어머니의 눈을 똑바로 쳐다보기가 괴로웠고, 아버지의 다정한 말도 날카로운 가시처럼 들렸습니다. 마음의 병이 몸의 병으로 번져 소년은 앓아눕기까지 했습니다. 고백하고 싶었지만 용기가 나지 않았습니다. 그가 이 구렁텅이에서 건져 올려지기까지는 한 소년의 등장이 필요했습니다.", "id": 4}, {"title": "막스 데미안의 등장", "quote": "카인의 표적은 부끄러움이 아니라 남다름의 표시일 수도 있다.", "text": "그 무렵 싱클레어가 다니던 학교에 새로운 학생이 전학을 왔습니다. 막스 데미안이었습니다. 그는 싱클레어보다 몇 살 위였고, 얼굴이 이상할 만큼 침착하고 어른스러웠습니다. 아이들은 그를 낯설어했지만, 데미안은 누구의 눈치도 보지 않았습니다. 어느 날 학교에서 돌아오는 길에 데미안이 싱클레어에게 말을 걸었습니다.\n\n데미안은 성경에 나오는 카인과 아벨 이야기를 이렇게 읽을 수도 있다고 했습니다. 카인의 이마에 새겨진 표적은 낙인이 아니라, 다른 사람들이 두려워할 만큼 용기와 개성이 있다는 표시일지도 모른다는 것입니다. 사람들은 자기들과 다른 사람을 무서워해서, 그를 나쁜 사람으로 만들어 버린 것이 아니겠느냐고도 했습니다. 싱클레어는 놀라고 혼란스러웠지만, 이상하게 마음이 끌렸습니다. 어른들이 가르쳐 준 것과는 전혀 다른 생각이 소년의 마음에 처음으로 씨앗처럼 떨어졌습니다.", "id": 5}, {"title": "크로머에게서 풀려나다", "quote": "데미안은 무엇을 했는지 끝내 말해 주지 않았다.", "text": "데미안은 싱클레어가 무언가에 시달리고 있다는 것을 눈치채고 있었습니다. 싱클레어는 이야기를 다 털어놓지는 못했지만, 크로머라는 이름만은 조심스럽게 입 밖에 꺼냈습니다. 데미안은 가만히 들었고, 겁낼 것 없다고만 말했습니다.\n\n그 뒤로 이상한 일이 벌어졌습니다. 크로머가 싱클레어를 찾아오지 않았고, 휘파람 소리도 더는 들리지 않았습니다. 길에서 마주쳐도 크로머는 얼굴이 하얗게 질려 슬그머니 피했습니다. 데미안이 무슨 말을 했는지, 어떻게 했는지는 알 수 없었습니다. 싱클레어가 물어도 데미안은 대답을 하지 않았습니다. 마음의 짐을 벗은 싱클레어는 어머니 품에 안겨 울며 아프던 시간을 털어 냈습니다. 그리고 마음 한구석에는 자기를 구해 준 이 이상한 친구에 대한 감사와 두려움이 함께 남았습니다. 그 감정은 오래도록 싱클레어의 삶을 따라다닙니다.", "id": 6}, {"title": "두 도둑과 문장의 새", "quote": "착하기만 한 사람보다 자기 뜻이 분명한 사람이 낫지 않을까.", "text": "싱클레어는 그 일 이후로 데미안과 가까워졌습니다. 어느 날 학교에서 종교 수업을 받는 동안, 데미안은 예수와 함께 십자가에 매달린 두 도둑 이야기를 꺼냈습니다. 한 도둑은 뉘우치고 예수를 따랐고, 다른 도둑은 끝까지 뉘우치지 않았다는 이야기였습니다. 데미안은 뉘우친 쪽이 겁이 많아서 그런 것은 아니겠느냐고 했고, 끝까지 자기 길을 고집한 쪽이 오히려 기개가 있다고 말했습니다. 싱클레어는 또다시 가슴이 두근거렸습니다.\n\n싱클레어의 집 대문 위에는 오래된 새 문장이 새겨져 있었는데, 데미안이 그 새를 그림으로 그려 보기도 했습니다. 얼마 후 데미안은 학교를 떠났고, 싱클레어도 부모님의 뜻에 따라 먼 도시의 기숙학교로 가게 되었습니다. 두 사람은 어쩔 수 없이 헤어졌습니다. 그러나 데미안이 심어 준 생각들은 싱클레어 마음속에서 조용히 자라고 있었습니다.", "id": 7}, {"title": "기숙학교에서의 방황", "quote": "길을 잃은 소년은 술집에서 쓸쓸히 웃고 있었다.", "text": "기숙학교에서 싱클레어는 처음에는 몹시 외로웠습니다. 그러다 한 선배 알폰스 벡을 알게 되었는데, 벡은 규칙을 어기고 술집을 드나드는 것을 자랑으로 삼는 학생이었습니다. 싱클레어는 외로움 때문에 벡을 따라다니며 술을 마시고 큰소리치는 날들을 보냈습니다. 성적은 곤두박질치고, 선생님들의 눈 밖에 났으며, 마음은 점점 거칠어졌습니다.\n\n겉으로는 어른이 된 척했지만 속으로는 허전하고 공허했습니다. 술집에서 웃고 떠들수록 외로움이 더 깊어졌습니다. 어린 날 크로머에게 짓눌렸던 때와는 또 다른 종류의 어둠이었습니다. 그는 자기가 어디로 가고 있는지 알 수 없었습니다. 그렇게 길을 잃고 있던 어느 날, 싱클레어의 인생을 바꾸어 놓는 한 장면이 우연처럼 다가옵니다.", "id": 8}, {"title": "베아트리체를 만나다", "quote": "나는 이름도 모르는 그녀를 베아트리체라고 불렀다.", "text": "어느 봄날, 싱클레어는 공원을 산책하다가 날씬하고 맑은 얼굴의 한 소녀를 보았습니다. 그녀는 소년처럼 단정하고 신비로운 분위기를 가졌습니다. 싱클레어는 말 한마디 건네 보지 못했지만, 그날 이후 그 소녀를 마음속 깊이 우러러보게 되었습니다. 그는 그녀에게 베아트리체라는 이름을 붙였습니다. 옛 시인 단테가 평생 그리워했던 여인의 이름이었습니다.\n\n신기하게도 그 순간부터 싱클레어의 생활이 달라졌습니다. 술집 출입을 끊고, 단정한 옷을 입고, 방을 정리하고, 책을 읽기 시작했습니다. 그는 베아트리체의 모습을 그림으로 그려 보려 했지만, 잘 되지 않았습니다. 몇 번을 고쳐 그리다 보니, 그림 속 얼굴은 소녀 같기도 하고 소년 같기도 한 이상한 얼굴로 변해 갔습니다. 어딘가 데미안을 닮은 듯하기도 했고, 또 어딘가 자기 자신을 닮은 듯하기도 했습니다. 그리고 그림은 곧 새로운 모습을 만들어 냅니다.", "id": 9}, {"title": "새는 알에서 나오려고 싸운다", "quote": "태어나려는 자는 하나의 세계를 깨뜨려야 한다.", "text": "베아트리체의 그림을 그리던 싱클레어는 어느 날 꿈에서 본 듯한 새를 그리게 되었습니다. 날카로운 눈매의 매 같은 새가 둥근 지구 같은 알을 깨고 나오는 모습이었습니다. 완성한 그림은 어렸을 때 본 집 대문 위의 새를 떠올리게 했습니다. 싱클레어는 어쩐지 이 그림을 데미안에게 보내고 싶었고, 주소도 모른 채 그림을 꾸려 보냈습니다.\n\n며칠 뒤, 책상 위에 작은 쪽지가 놓여 있었습니다. 새는 알에서 나오려고 싸운다는 말, 알은 세계라는 말, 태어나려는 자는 하나의 세계를 깨뜨려야 한다는 말, 새는 신에게로 날아가는데 그 신의 이름이 아브락사스라는 말이 적혀 있었습니다. 싱클레어는 몇 번이고 그 글을 되풀이해 읽었습니다. 아브락사스가 무엇인지는 알 수 없었지만, 자기가 어디로 가야 하는지를 알려 주는 첫 이정표를 만난 듯한 기분이 들었습니다.", "id": 10}, {"title": "피스토리우스와 아브락사스", "quote": "신은 선한 것만이 아니라 악한 것까지 품고 있었다.", "text": "싱클레어는 우연히 한 교회에서 오르간 소리에 이끌렸고, 연주자였던 피스토리우스와 알게 되었습니다. 피스토리우스는 신학을 공부했지만 교회의 가르침에 만족하지 못하고 홀로 철학을 파고든 사람이었습니다. 그는 싱클레어에게 아브락사스에 대해 가르쳐 주었습니다. 아브락사스는 선과 악, 밝음과 어둠을 모두 품은 신이라는 것이었습니다. 싱클레어가 어린 시절 느꼈던 두 세계가 하나의 신 안에 함께 있다는 뜻이었습니다.\n\n피스토리우스는 벽난로의 불을 한참씩 바라보게 하며, 자기 마음속의 소리를 들어 보라고 가르쳤습니다. 싱클레어는 그에게서 많은 것을 배웠지만, 시간이 지날수록 피스토리우스가 과거의 가르침에 매달려 앞으로 나아가지 못하는 사람이라는 것을 깨달았습니다. 싱클레어는 한동안 고마운 스승과 작별하며, 자기만의 길을 걸어야 한다는 사실을 마음에 새겼습니다.", "id": 11}, {"title": "야곱의 싸움", "quote": "나는 내 안의 그 소리에 귀를 기울여야 했다.", "text": "싱클레어는 성경에서 야곱이 천사와 밤새 씨름한 이야기처럼, 자기 자신과 오래도록 씨름하는 시간을 보냈습니다. 누구에게서 배운 것을 따르는 것이 아니라, 마음속에서 들리는 소리를 따라가려니 불안하고 두려웠습니다. 때로는 외로움에 몸부림쳤고, 때로는 꿈속에서 강렬한 상징들을 만났습니다.\n\n그는 꿈에서 자신을 이끄는 여인의 모습을 보았습니다. 어머니 같기도 하고 연인 같기도 한, 크고 온화하면서도 신비로운 존재였습니다. 그는 그 모습을 그림으로 옮기며, 마음의 고통을 조금씩 풀어 갔습니다. 그러는 사이 싱클레어는 어른이 되었고, 대학에 가기 위해 다른 도시로 떠났습니다. 길 위의 모든 방황은 그를 서서히 자기 안의 중심으로 이끌고 있었습니다.", "id": 12}, {"title": "다시 만난 데미안, 에바 부인", "quote": "그녀의 얼굴은 내가 그린 꿈속의 얼굴이었다.", "text": "대학이 있는 도시에서 싱클레어는 우연한 계기로 데미안을 다시 만났습니다. 오랜만에 만난 데미안은 어른이 되어 있었고, 어릴 때와 같은 평온한 눈빛을 가진 채 싱클레어를 반겨 주었습니다. 데미안은 싱클레어를 자기 집에 데려가 어머니 에바 부인을 소개했습니다.\n\n에바 부인을 본 순간 싱클레어는 숨이 멎는 듯했습니다. 그녀의 얼굴이 꿈속에서 그토록 그리던, 자기가 그림으로 그렸던 바로 그 얼굴이었기 때문입니다. 에바 부인은 크고 따뜻한 사람이었으며, 마치 모든 것을 이미 알고 있는 듯 다정했습니다. 그 집에는 데미안과 같은 생각을 가진 사람들이 모여 있었고, 그들은 자신을 '표적을 가진 사람들'이라 여기며 조용히 마음을 나누었습니다. 싱클레어는 처음으로 자기가 있을 곳에 돌아왔다는 편안함을 느꼈습니다.", "id": 13}, {"title": "다가오는 폭풍", "quote": "낡은 세계는 무너지고 새 세계가 오고 있었다.", "text": "에바 부인의 집에서 보낸 날들은 싱클레어에게 가장 평화로운 시간이었습니다. 그는 에바 부인을 마음 깊이 사랑하게 되었지만, 그 사랑은 욕심이 아니라 자기가 가야 할 방향을 알려 주는 별빛 같은 것이었습니다. 에바 부인도 그의 마음을 부드럽게 받아 주었습니다.\n\n그러나 데미안은 밖의 세상이 곧 크게 흔들릴 것이라고 이야기했습니다. 유럽 사람들이 안으로 쌓아 온 불만과 두려움이 곧 터져 나올 것이고, 낡은 세상은 무너질 수밖에 없다는 것입니다. 싱클레어와 친구들은 어딘가 서늘한 예감을 느끼며 하늘을 바라보곤 했습니다. 얼마 지나지 않아 데미안의 말은 현실이 되었고, 전쟁이 일어났다는 소식이 도시에 퍼졌습니다. 사람들은 환호하며 거리로 나왔지만, 싱클레어는 가슴 한쪽이 서늘했습니다.", "id": 14}, {"title": "전쟁터에서의 이별", "quote": "나는 거울 속에서 그를 보았다.", "text": "싱클레어도 데미안도 군인이 되어 전쟁터로 나갔습니다. 포탄이 터지는 밤, 싱클레어는 어느 전투에서 부상을 입고 쓰러졌습니다. 정신이 아득한 가운데 정신을 차려 보니, 야전 병원 안이었습니다. 바로 옆 자리에 데미안이 누워 있었습니다. 데미안은 조용히 싱클레어를 바라보며, 이제 자기는 떠나야 한다고 했습니다.\n\n데미안은 앞으로 싱클레어가 힘들어 누군가를 찾게 되면, 말을 타고 기차를 타고 올 수는 없지만 마음속으로 귀를 기울이면 자기가 그 안에 있음을 알게 될 것이라고 말했습니다. 그리고 에바 부인의 입맞춤을 전하며 싱클레어에게 입을 맞추었습니다. 싱클레어가 잠에서 깨어났을 때 데미안의 자리에는 낯선 사람이 누워 있었습니다. 훗날 거울을 들여다본 싱클레어는 자신의 얼굴에서 데미안의 모습을 보았습니다. 이제 그는 밖에서 길을 안내해 줄 누군가가 아니라, 자기 안에서 자기를 이끄는 존재와 하나가 된 것입니다. 이렇게 싱클레어의 긴 여정은 조용히 끝을 맺습니다.", "id": 15}];
let cur=0,synth=window.speechSynthesis,speaking=false;
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
if(m==='book')render(cur);else{synth.cancel();speaking=false;}}
function render(i){if(i<0||i>=SCENES.length)return;cur=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 15';
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookPageIndicator').textContent=s.id+' / 15 쪽';
document.getElementById('sceneSlider').value=s.id;synth.cancel();speaking=false;window.scrollTo(0,0);}
function prevScene(){if(cur>0)render(cur-1);}
function nextScene(){if(cur<SCENES.length-1)render(cur+1);}
function onSliderChange(v){render(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';

let ac=null,playing=false,mt=null;
function toggleMusic(){if(playing){playing=false;clearTimeout(mt);document.getElementById('btnMusic').classList.remove('active');}
else{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
playing=true;document.getElementById('btnMusic').classList.add('active');
const n=[523.25,587.33,659.25,783.99,880,1046.5];let k=0;
(function play(){if(!playing)return;const o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(n[k++%n.length],ac.currentTime);
g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.06,ac.currentTime+.05);
g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.8);o.connect(g);g.connect(ac.destination);
o.start();o.stop(ac.currentTime+1.9);mt=setTimeout(play,900);})();}}
