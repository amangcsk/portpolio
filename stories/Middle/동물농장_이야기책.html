<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동물농장 - 조지 오웰 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#4a5d3a;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div><span>📖</span> <span class="brand-title">조지 오웰 · 동물농장</span></div>
<div class="nav-actions">
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>

<p class="story-paragraph" id="bookText"></p></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn" onclick="toggleTtsCurrent()">🔊 읽어주기</button></div></div>

<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 책은 조지 오웰(1903~1950)의 소설 「동물농장」(1945)의 줄거리를 제가 풀어 15부분으로 엮은 것입니다. 원문을 그대로 옮기지 않았고, 장면과 대사의 세부는 이야기를 잇기 위해 보태 쓰거나 줄인 곳이 있어 원작과 다를 수 있습니다. 정확한 내용은 번역된 책으로 확인해 주세요.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"title": "존스 농장의 밤", "quote": "오늘 밤 모두 큰 헛간으로 모여라. 늙은 메이저 영감이 꿈 이야기를 하신단다.", "text": "영국의 시골에 매너 농장이라는 곳이 있었습니다. 주인은 존스 씨라는 사람이었는데, 술을 좋아하고 일에는 게을렀습니다. 어느 날 밤 존스 씨는 평소처럼 술에 취해 비틀거리며 닭장 문을 닫는 둥 마는 둥 하고 침실로 들어가 잠들어 버렸습니다. 불이 꺼지자 마당 건너 헛간에서는 수군수군 소리가 번졌습니다.\n\n그날 낮, 농장에서 가장 나이가 많고 존경받는 수퇘지 메이저 영감이 \"간밤에 이상한 꿈을 꾸었으니 밤에 모두 헛간에 모이라\"는 말을 퍼뜨렸기 때문입니다. 말과 소와 양, 오리와 닭, 당나귀와 고양이, 심지어 쥐까지 하나둘 헛간으로 모여들었습니다. 짐수레를 끄는 힘센 말 복서와 그 곁을 지키는 암말 클로버, 늘 비꼬듯 말하는 늙은 당나귀 벤저민도 있었습니다. 호화로운 리본으로 치장한 암말 몰리는 맨 뒤에서 어슬렁어슬렁 들어왔습니다.\n\n메이저 영감은 짚단 위 높은 자리에 올라 앉아 천천히 목을 가다듬었습니다. 모든 동물이 조용히 숨을 죽였습니다.", "id": 1}, {"title": "늙은 메이저의 꿈", "quote": "우리 삶은 비참하고 고달프며 짧습니다. 그 모든 죄는 사람에게 있습니다.", "text": "메이저 영감은 이렇게 연설을 시작했습니다. \"동지들이여, 영국의 동물들은 한 살이 지나면 행복이 무엇인지 알지 못합니다. 우리는 태어나서 겨우 목숨을 이어 갈 만큼의 먹이를 받고, 쓸모 있는 동안은 끝까지 일을 하다가, 쓸모가 없어지는 순간 잔인하게 도살됩니다. 이것이 동물의 삶의 전부입니다.\"\n\n영감은 한 가지 사실을 강조했습니다. 농장의 땅은 풍요로워서 지금 사는 동물보다 훨씬 많은 동물을 배불리 먹일 수 있다는 것입니다. 그런데도 우리가 굶주리는 이유는, 우리가 만들어 낸 모든 것을 사람이 가져가기 때문입니다. \"사람은 생산하지 않고 소비만 하는 유일한 동물입니다. 젖을 짜고, 알을 가져가고, 힘을 빌리고, 결국 고기마저 취합니다. 사람만 없다면 우리는 굶주림과 과로에서 영원히 벗어날 수 있습니다.\"\n\n영감은 \"그러니 사람에 대항해 반란을 일으켜야 합니다\"라고 말했습니다. 또한 마지막으로 이렇게 당부했습니다. \"어떤 동물도 다른 동물을 해쳐서는 안 됩니다. 모든 동물은 평등합니다. 그리고 사람의 습관을 흉내 내서도 안 됩니다.", "id": 2}, {"title": "짐승들의 노래", "quote": "영국의 짐승들이여, 아일랜드의 짐승들이여, 온 세상 모든 짐승들이여.", "text": "연설이 끝나갈 무렵 메이저 영감은 간밤 꿈속에서 어릴 적 들었던 노래가 되살아났다고 말했습니다. 오래전 잊힌 줄 알았던 가락이었습니다. 영감은 목을 가다듬고 '영국의 짐승들'이라는 노래를 불렀습니다. 처음에는 쉰 목소리로 시작했지만 갈수록 가락에 힘이 실렸고, 곧 모든 동물이 한목소리로 따라 부르기 시작했습니다.\n\n노래는 황금빛 미래를 약속하고 있었습니다. 폭군 인간이 사라지는 날, 영국의 땅은 오직 짐승들의 것이 된다는 내용이었습니다. 소들은 낮게 울고, 개들은 짖고, 양들은 메에 소리 지르고, 말들은 히힝 울며 노래를 따라 불렀습니다. 어찌나 소리가 컸던지 멀리 침실의 존스 씨까지 잠에서 깨어 총을 들고 마당으로 나와 어두운 하늘에 대고 한 방을 쏘았습니다.\n\n총소리에 놀란 동물들은 흩어져 잠자리로 돌아갔습니다. 하지만 그 노래는 모두의 가슴에 깊이 새겨졌습니다. 사흘 뒤 메이저 영감은 잠자던 채로 조용히 세상을 떠났습니다.", "id": 3}, {"title": "반란의 날", "quote": "그날 존스 씨는 점심때가 되어서야 겨우 깨어났다.", "text": "메이저 영감이 죽은 뒤 동물들은 은밀히 반란을 준비했습니다. 이 일을 이끈 것은 똑똑한 돼지들이었습니다. 그중에서도 눈에 띄는 셋이 있었습니다. 활기차고 영리한 스노볼, 덩치가 크고 말수는 적지만 고집이 센 나폴레옹, 그리고 말솜씨가 좋아 검은 것도 희다고 설득하는 스퀄러였습니다.\n\n세 돼지는 메이저 영감의 가르침을 '동물주의'라는 이름으로 정리했습니다. 동물들은 밤마다 모여 이야기를 나누었습니다. 어떤 동물은 \"반란이 정말 가능할까?\" 하고 의심했고, 어떤 동물은 \"우리가 안 해도 주인을 위해 일해야 하느냐\"며 되물었습니다. 그러던 어느 여름날, 반란은 예상보다 훨씬 일찍 찾아왔습니다.\n\n존스 씨가 술에 취해 하루 종일 동물들에게 먹이를 주지 않았던 것입니다. 배고픔을 참다못한 소들이 창고 문을 뿔로 들이받았고, 동물들이 우르르 몰려들어 먹이 창고를 열었습니다. 존스 씨와 일꾼들이 채찍을 들고 나왔지만, 분노한 동물들이 한꺼번에 달려들자 겁에 질려 도망쳤습니다. 존스 부인도 짐을 싸서 뒷문으로 달아났습니다. 이렇게 매너 농장은 단 몇 분 만에 동물들의 것이 되었습니다.", "id": 4}, {"title": "일곱 계명", "quote": "모든 동물은 평등하다.", "text": "동물들은 승리의 기쁨에 취해 농장을 한 바퀴 돌았습니다. 존스 씨의 채찍, 재갈, 고삐, 도살용 칼 같은 것들을 우물에 던져 버렸습니다. 그리고 농장의 이름도 '동물농장'으로 바꾸었습니다. 대문에 걸려 있던 '매너 농장' 간판은 흰 페인트로 지워졌습니다.\n\n글을 읽을 수 있는 돼지들은 헛간 벽 위에 계명을 적었습니다. 동물주의의 일곱 가지 규칙은 이러했습니다. 첫째, 두 발로 걷는 것은 모두 적이다. 둘째, 네 발로 걷거나 날개가 있는 것은 모두 벗이다. 셋째, 어떤 동물도 옷을 입지 않는다. 넷째, 어떤 동물도 침대에서 자지 않는다. 다섯째, 어떤 동물도 술을 마시지 않는다. 여섯째, 어떤 동물도 다른 동물을 죽이지 않는다. 일곱째, 모든 동물은 평등하다.\n\n글을 읽지 못하는 동물들을 위해 돼지들은 이 규칙을 짧은 구호로 줄였습니다. \"네 발은 좋고, 두 발은 나쁘다.\" 양들은 이 구호가 마음에 들어서 하루 종일 되뇌며 풀을 뜯었습니다. 동물들은 가슴이 벅찼습니다. 처음으로 자기 자신을 위해 일할 수 있게 된 것입니다.", "id": 5}, {"title": "풍성한 첫 수확", "quote": "저는 더 열심히 일하겠습니다. 이것이 제 좌우명입니다.", "text": "존스 씨 없이 맞은 첫 추수철은 눈부셨습니다. 동물들은 서툰 발굽과 앞발로 낫을 들고 건초를 베고 말렸습니다. 돼지들은 직접 일을 하지는 않았지만 감독하고 지시했습니다. 그들이 가장 똑똑했기 때문에 지도자 역할이 자연스럽게 주어진 것입니다.\n\n가장 큰 힘이 된 것은 말 복서였습니다. 복서는 누구보다 일찍 일어나 누구보다 늦게까지 일했습니다. 모두가 지쳐 쓰러질 때도 복서는 \"내가 더 열심히 일하겠다\"는 말을 되풀이하며 묵묵히 짐을 끌었습니다. 복서에게는 또 하나의 좌우명이 생겼는데, 어려운 일이 생길 때마다 \"나폴레옹 동지는 언제나 옳다\"고 말하는 것이었습니다.\n\n수확량은 존스 시절보다 훨씬 많았습니다. 아무도 굶지 않았고 서로 도둑질할 필요도 없었습니다. 일요일은 쉬는 날이어서 국기 게양식과 회의가 열렸습니다. 다만 그때까지는 아무도 알지 못했습니다. 이 아름다운 시작이 어디로 흘러갈지를.", "id": 6}, {"title": "우유와 사과", "quote": "돼지들은 머리를 쓰는 일꾼이다. 건강을 위해 우유와 사과가 필요하다.", "text": "그런데 이상한 일이 하나둘 생겨났습니다. 암소들의 젖은 모두 짜 놓았는데, 어느새 그 우유가 어디론가 사라져 버린 것입니다. 그 대신 돼지들의 먹이에 우유가 섞여 있다는 소문이 돌았습니다. 얼마 뒤 농장에서 가장 잘 익은 사과가 바람에 떨어졌는데, 동물들이 그것을 나누어 먹으려 하자 돼지들은 이렇게 말했습니다. \"사과는 돼지들 몫으로 따로 모아 둔다.\"\n\n동물들은 항의했지만 스퀄러가 나서서 설득했습니다. \"동지들, 설마 우리 돼지들이 이것을 특권이나 이기심 때문에 먹는다고 생각하십니까? 오히려 싫어하는 이도 많습니다. 하지만 우리는 머리를 쓰는 일꾼입니다. 농장 전체의 경영과 조직이 우리 두뇌에 달려 있습니다. 만약 우리가 쓰러지면 존스가 돌아올 겁니다. 존스가 돌아오기를 원하십니까?\"\n\n동물들은 무서운 이름 앞에 아무 말도 하지 못했습니다. 그렇게 우유와 사과는 돼지의 몫이 되었고, 그것이 첫 번째 균열이었습니다.", "id": 7}, {"title": "외양간 전투", "quote": "동물농장을 지켜 낸 날이었다.", "text": "소문을 들은 이웃 농장의 사람들이 동물농장의 반란이 자기네 농장에도 번질까 두려워했습니다. 존스 씨는 이웃 사람 몇 명과 함께 총을 들고 다시 농장을 되찾으러 쳐들어왔습니다. 스노볼은 미리 율리우스 카이사르의 전쟁 이야기책을 읽어 두었기 때문에 작전을 세울 수 있었습니다.\n\n동물들은 매복했다가 일제히 달려들었습니다. 비둘기들은 하늘에서 사람들을 습격했고, 거위들은 정강이를 물어뜯었으며, 양과 소는 정면으로 부딪혔습니다. 존스 씨가 총을 쏘는 바람에 스노볼의 등에 상처가 났지만 그는 굴하지 않고 앞장서 싸웠습니다. 복서는 뒷발로 일어서서 마구간 일꾼 하나를 한 방에 쓰러뜨렸으나 죽은 줄 알고 깜짝 놀라 \"죽일 생각은 없었다\"며 후회했습니다.\n\n결국 사람들은 모두 쫓겨났습니다. 이 전투는 '외양간 전투'라 불리게 되었고, 스노볼과 복서에게는 '동물 영웅 일등 훈장'이 주어졌습니다. 동물들은 이날을 해마다 기념하기로 했습니다.", "id": 8}, {"title": "나폴레옹과 스노볼", "quote": "풍차를 세웁시다. 그러면 모두의 일이 훨씬 쉬워집니다.", "text": "승리 이후 농장 운영을 놓고 스노볼과 나폴레옹의 의견이 사사건건 갈라졌습니다. 스노볼은 언덕 위에 풍차를 세워 전기를 만들자고 주장했습니다. 전기를 쓰면 일은 줄고 생활은 편해지며 겨울에도 따뜻한 마구간에서 지낼 수 있다는 이야기였습니다. 스노볼은 설계도까지 그려 가며 열정적으로 동물들을 설득했습니다.\n\n반면 나폴레옹은 \"먹이를 늘리는 것이 먼저다\"라며 반대했습니다. 풍차 공사에 매달리면 오히려 굶주릴 것이라고 했습니다. 회의 때마다 두 돼지는 날 선 말다툼을 벌였고, 동물들은 어느 쪽 말도 옳아 보여서 갈팡질팡했습니다. 양들은 두 돼지가 말을 할 때마다 \"네 발은 좋고 두 발은 나쁘다!\" 하고 큰 소리로 외쳐서 상대의 연설을 가로막기 일쑤였습니다.\n\n결정의 날이 다가왔습니다. 스노볼이 멋지게 연설을 마치자 모두 풍차 쪽으로 마음이 기운 듯 보였습니다. 그때 나폴레옹이 일어나 낮은 소리로 휘파람을 불었습니다.", "id": 9}, {"title": "쫓겨난 스노볼", "quote": "나폴레옹의 개들이 스노볼을 향해 달려들었다.", "text": "휘파람 소리가 울리자 헛간 밖에서 거대한 개 아홉 마리가 쏜살같이 뛰어들어 왔습니다. 놋쇠 징이 박힌 목걸이를 한 사나운 개들이었습니다. 그들은 곧장 스노볼을 향해 달려들었고, 스노볼은 간신히 몸을 피해 농장 밖으로 도망쳤습니다. 개들은 한참을 뒤쫓다가 돌아왔습니다.\n\n그 개들은 나폴레옹이 어미 개들에게서 새끼 때 데려다가 몰래 키운 것이었습니다. 동물들은 그제야 그 사실을 알았지만 이미 너무 늦었습니다. 나폴레옹은 개들을 거느린 채 높은 단 위에 올라 선언했습니다. \"앞으로 일요일 회의는 폐지한다. 모든 중요한 일은 돼지들로 구성된 특별위원회가 결정하고, 그 결과를 동물들에게 알릴 것이다.\"\n\n몇몇 동물이 항의하려 했지만 개들의 으르렁거림 앞에 곧 입을 다물었습니다. 며칠 뒤 스퀄러가 나서서 말했습니다. \"동지들, 나폴레옹 동지께서 이 모든 무거운 짐을 짊어지시는 희생을 하고 계십니다.\" 그리고 놀라운 사실을 밝혔습니다. \"풍차 계획은 사실 나폴레옹 동지의 구상이었고, 스노볼이 훔쳐 갔던 것입니다.", "id": 10}, {"title": "풍차와 돼지들의 집", "quote": "동물들은 자기들이 존스 시절보다 훨씬 힘든 삶을 산다는 것을 깨닫지 못했다.", "text": "풍차 공사가 시작되었습니다. 동물들은 일요일에도 쉬지 못하고 자원이라는 이름 아래 일해야 했습니다. 먹이는 줄어들었는데 일은 늘어났습니다. 그래도 스퀄러는 \"존스 시절보다 훨씬 나아졌다\"며 숫자를 읊어 대었고, 동물들은 자기 기억이 틀린 것은 아닌가 의심하며 입을 다물었습니다.\n\n복서는 점점 더 지치면서도 \"내가 더 열심히 일하겠다\"며 새벽 한 시간 일찍 일어나 돌을 날랐습니다. 한편 돼지들은 농장 집으로 거처를 옮겼고, 어느새 침대에서 잠을 자고 있었습니다. 일부 동물이 \"계명에 침대에서 자지 않는다고 적혀 있지 않았나?\" 하고 의아해하자, 클로버는 헛간 벽을 다시 읽어 보았습니다. 거기에는 \"어떤 동물도 시트를 깐 침대에서 자지 않는다\"고 적혀 있었습니다.\n\n공사가 거의 끝나 갈 즈음 거센 폭풍이 몰아쳤고, 아침에 보니 풍차가 무너져 있었습니다. 나폴레옹은 단호하게 외쳤습니다. \"이것은 스노볼의 소행이다!\" 그날 이후 농장에 닥치는 모든 불행은 스노볼 탓이 되었습니다.", "id": 11}, {"title": "숙청의 시간", "quote": "동물농장에서 피가 흐르기 시작했다.", "text": "혹독한 겨울이 닥쳤습니다. 먹이는 부족했고 동물들은 굶주렸지만, 나폴레옹은 이웃 농장주들에게 숨기려고 창고에 가득 찬 것처럼 꾸몄습니다. 그러면서 암탉들에게는 알을 팔아야 한다고 명령했습니다. 암탉들은 자기 알을 빼앗기는 것에 분노하여 서까래 위에서 알을 떨어뜨려 깨뜨리는 방식으로 저항했습니다.\n\n나폴레옹의 답은 잔인했습니다. 그는 암탉들의 먹이를 끊어 굶겼습니다. 닷새 만에 암탉 아홉 마리가 굶어 죽자 나머지는 항복했습니다. 곧이어 나폴레옹은 \"스노볼과 내통했다\"며 몇몇 동물을 끌어내 심문하기 시작했습니다. 그러자 동물들은 차례로 엉뚱한 자백을 했고, 자백이 끝나는 즉시 개들이 목을 물어뜯었습니다.\n\n마당에는 시체가 쌓여 갔습니다. 살아남은 동물들은 공포에 질려 한곳에 모였습니다. 클로버는 이 모든 일이 반란의 꿈과 얼마나 다른지 생각하며 눈물을 흘렸습니다. 그리고 부지불식간에 '영국의 짐승들'을 부르기 시작했지만, 곧 개들이 다가와 그 노래를 금지시켰습니다.", "id": 12}, {"title": "복서의 마지막", "quote": "나폴레옹 동지는 언제나 옳다.", "text": "그해 가을 풍차는 더 튼튼하게 다시 지어졌습니다. 그러나 이웃 농장주 프레더릭과의 거래에서 속임수에 당해, 풍차는 폭탄으로 파괴되고 말았습니다. 복서는 이 전투에서 큰 부상을 입고도 일을 멈추지 않았습니다. \"내가 더 열심히 일하겠다.\" 복서의 좌우명이었습니다.\n\n그러던 어느 날 복서가 돌 수레를 끌다가 쓰러졌습니다. 폐에 병이 든 것이었습니다. 나폴레옹은 \"수의사가 있는 병원에 보내겠다\"고 선언했습니다. 이튿날 마차 한 대가 도착해 복서를 실었습니다. 마차 옆면에는 '도살업자'라는 글씨가 적혀 있었습니다. 벤저민이 큰 소리로 외쳤습니다. \"어서 도망쳐! 저건 말 도살업자의 마차야!\" 하지만 복서는 이미 기운이 없어 마차 속에서 발길질을 하다 멈추고 말았습니다.\n\n며칠 뒤 스퀄러가 \"복서가 병원에서 평안히 눈을 감았다\"고 발표했습니다. 그러나 그날 돼지들의 집에서는 새 위스키 상자가 열렸습니다. 복서의 운명이 어떻게 되었는지 아는 동물들은 입을 다물었습니다.", "id": 13}, {"title": "변해 가는 계명", "quote": "모든 동물은 평등하다. 그러나 어떤 동물은 다른 동물보다 더 평등하다.", "text": "세월이 흘렀습니다. 반란을 직접 겪은 동물들은 하나둘 죽거나 늙어 갔고, 젊은 동물들은 존스 시절이 어땠는지 전혀 알지 못했습니다. 스퀄러는 계속해서 숫자를 읊어 가며 \"농장이 더욱 번영하고 있다\"고 말했고, 동물들은 기억이 가물가물하여 따질 수가 없었습니다.\n\n계명도 소리 없이 바뀌었습니다. \"어떤 동물도 술을 마시지 않는다\"는 문구에는 \"지나치게\"라는 말이 덧붙여졌고, \"어떤 동물도 다른 동물을 죽이지 않는다\"에는 \"이유 없이\"라는 말이 붙었습니다. 돼지들은 점차 두 다리로 걷기 시작했고, 채찍을 들고 다니기도 했습니다. 양들은 \"네 발은 좋고 두 발은 더 좋다!\" 하고 새 구호를 외쳤습니다.\n\n어느 날 아침 동물들은 헛간 벽을 올려다보고 숨을 죽였습니다. 일곱 계명은 모두 사라지고 단 한 줄만 남아 있었습니다. \"모든 동물은 평등하다. 그러나 어떤 동물은 다른 동물보다 더 평등하다.\" 아무도 그 말을 소리 내어 묻지 못했습니다.", "id": 14}, {"title": "구별할 수 없는 얼굴", "quote": "동물들은 돼지에서 인간으로, 인간에서 돼지로 번갈아 바라보았다.", "text": "어느 저녁, 이웃 농장주들이 동물농장을 방문했습니다. 농장 집 안에서는 돼지들이 사람들과 어울려 카드놀이를 하고 있었습니다. 창밖에서 그 모습을 엿보던 동물들은 눈을 의심했습니다. 나폴레옹은 큰소리로 선언했습니다. \"우리는 이웃과 평화롭게 지내길 원합니다. 앞으로 농장의 이름도 다시 '매너 농장'으로 부르겠습니다.\"\n\n술잔이 부딪히고 웃음소리가 터져 나왔습니다. 그런데 곧 사람과 돼지 사이에 카드 한 장을 놓고 다툼이 일어났습니다. 서로 같은 카드를 내밀며 고함을 지르고 주먹다짐 직전까지 가는 모습이 창밖에 선명하게 비쳤습니다. 동물들은 한참을 숨죽이고 지켜보았습니다.\n\n그들의 시선은 돼지의 얼굴에서 사람의 얼굴로, 사람의 얼굴에서 다시 돼지의 얼굴로 오갔습니다. 그러나 어느 것이 돼지이고 어느 것이 사람인지, 더는 분간할 수 없었습니다. 이렇게 이야기는 막을 내립니다. 폭군을 몰아내고 평등을 꿈꾸었던 동물들의 반란은, 결국 또 하나의 폭군을 낳고 말았습니다.", "id": 15}];
let cur=0,synth=window.speechSynthesis,speaking=false;
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
if(m==='book')render(cur);else{synth.cancel();speaking=false;}}
function render(i){if(i<0||i>=SCENES.length)return;cur=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 15';
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookPageIndicator').textContent=s.id+' / 15 쪽';
document.getElementById('sceneSlider').value=s.id;synth.cancel();speaking=false;window.scrollTo(0,0);}
function prevScene(){if(cur>0)render(cur-1);}
function nextScene(){if(cur<SCENES.length-1)render(cur+1);}
function onSliderChange(v){render(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700"></div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p>';
d.firstChild.textContent='제 '+s.id+' 부';d.querySelector('.gallery-title').textContent=s.title;
d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';d.querySelector('.gallery-text').textContent=s.text;c.appendChild(d);});}
function toggleTtsCurrent(){if(speaking){synth.cancel();speaking=false;}else{
const u=new SpeechSynthesisUtterance(SCENES[cur].title+'. '+SCENES[cur].text);
u.lang='ko-KR';u.rate=.9;u.onend=()=>{speaking=false;};synth.speak(u);speaking=true;}}
let ac=null,playing=false,mt=null;
function toggleMusic(){if(playing){playing=false;clearTimeout(mt);document.getElementById('btnMusic').classList.remove('active');}
else{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
playing=true;document.getElementById('btnMusic').classList.add('active');
const n=[523.25,587.33,659.25,783.99,880,1046.5];let k=0;
(function play(){if(!playing)return;const o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(n[k++%n.length],ac.currentTime);
g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.06,ac.currentTime+.05);
g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.8);o.connect(g);g.connect(ac.destination);
o.start();o.stop(ac.currentTime+1.9);mt=setTimeout(play,900);})();}}
window.onload=()=>{render(0);buildGallery();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScene();if(e.key==='ArrowLeft')prevScene();});
</script></body></html>
