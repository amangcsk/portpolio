<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소나기 - 황순원 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#4a5d3a;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.tts-btn{font-size:1.2rem;font-weight:700;background:#fff7e0;border:2px solid #c28b38}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div><span>📖</span> <span class="brand-title">황순원 · 소나기</span></div>
<div class="nav-actions">
<button class="btn tts-btn" onclick="toggleTts()">🔊 읽어주기 (끝까지 이어서)</button>
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>
<div class="quote-label">이 장면의 한마디</div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn tts-btn" onclick="toggleTts()">🔊 읽어주기 (끝까지 이어서)</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="10" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 책은 황순원 선생님의 단편소설 「소나기」를 줄거리 중심으로 쉽게 풀어 쓴 것입니다. 원문 그대로가 아니며, 세부 장면은 더하거나 줄인 곳이 있어 원작과 다를 수 있습니다. 정확한 문장은 꼭 원작 책으로 확인해 주세요.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"title": "개울가의 낯선 아이", "quote": "징검다리 한가운데에 서울 아이가 앉아 있었습니다.", "text": "시골 마을에 사는 소년은 아침마다 개울 건너 들길을 걸어 다니는 열대여섯 살 아이입니다. 어느 날부터인가 개울가에 처음 보는 소녀가 나와 있었습니다. 서울에서 이사 와서 윤 초시 댁에 머무는 아이라고 했습니다.\n\n소녀는 개울물에 손을 담그고 세수를 하며 물장난을 쳤습니다. 하필 징검다리 한가운데에 쪼그려 앉아 있어서, 소년은 개울을 건널 수가 없었습니다. 말을 걸 용기도 없고 비켜 달라고 할 수도 없어서, 소년은 그저 멀찍이 서서 소녀가 일어나기를 기다렸습니다.\n\n소녀는 소년이 한참을 기다리는 줄도 모르는 듯 물만 만지작거렸습니다. 소년은 얼굴이 달아올라 어쩔 줄 몰랐습니다. 그 모습이 소녀에게는 답답하게 보였던 것인지도 모릅니다.\n\n이야기의 무대는 가을이 깊어 가는 한적한 시골 마을입니다. 소년은 가난하지만 부지런한 집 아이이고, 소녀는 도시에서 온 몸이 가냘픈 아이입니다. 서로 사는 곳도 자란 모습도 다른 두 아이가 개울 하나를 사이에 두고 처음 마주치는 장면이 이야기의 시작입니다.", "id": 1}, {"title": "이 바보, 하고 던진 조약돌", "quote": "소녀는 흰 조약돌 하나를 던지고는 달아났습니다.", "text": "한참 뒤에야 소녀가 몸을 일으켰습니다. 그러더니 물속에서 흰 조약돌을 하나 건져 소년 쪽으로 휙 던졌습니다. 그러고는 바보라고 한마디 하고는 갈밭 사이로 뛰어 달아났습니다.\n\n소년은 멍하니 서 있다가 소녀가 사라진 쪽을 바라보았습니다. 화가 난 것도 아니고 기분이 나쁜 것도 아닌, 이름 붙이기 어려운 마음이 가슴속에 일었습니다. 소년은 소녀가 던지고 간 조약돌을 집어 들었습니다.\n\n그 조약돌은 보통 돌이었지만 소년에게는 그렇지 않았습니다. 소년은 그것을 주머니에 넣어 두고 틈날 때마다 만지작거리게 되었습니다.\n\n소년은 그날 밤 잠자리에 누워서도 개울가의 일이 자꾸 떠올랐습니다. 소녀가 왜 그런 말을 했는지, 자기가 뭘 잘못했는지 곰곰이 따져 보았지만 답은 나오지 않았습니다. 다만 소녀의 얼굴이 눈앞에서 사라지지 않았고, 그것이 낯설고 설레는 일이라는 것만은 알 수 있었습니다.", "id": 2}, {"title": "기다리는 날들", "quote": "소년은 날마다 개울가에 나가 소녀를 기다렸습니다.", "text": "그날 이후 소년은 개울가에 나가는 일이 가슴 뛰는 일이 되었습니다. 소녀가 또 나와 있을까, 오늘은 만날 수 있을까 하는 마음으로 걸음이 저절로 빨라졌습니다. 그러나 소녀는 한동안 나타나지 않았습니다.\n\n소년은 일부러 개울가에서 오래 머물렀고, 괜히 물가의 돌을 뒤집어 보기도 했습니다. 소녀가 아파서 못 나오는 건 아닐까, 이사를 간 것은 아닐까 하는 걱정도 들었습니다. 그러면서도 소년은 누구에게도 속마음을 털어놓지 못했습니다.\n\n그러던 어느 날, 소녀가 다시 개울가에 모습을 드러냈습니다. 전보다 얼굴이 조금 야위어 보였지만, 눈빛은 여전히 맑았습니다. 이번에는 소녀가 먼저 소년에게 말을 걸어 왔습니다.\n\n기다림이 길어질수록 소년은 말없이 마음을 키워 갔습니다. 개울물 소리, 갈대 흔들리는 소리, 멀리서 들리는 소 울음소리까지 평소와 달리 또렷하게 들렸습니다. 사랑이라는 말을 알지 못해도, 소년의 마음은 이미 그쪽으로 한 걸음씩 걸어가고 있었습니다.", "id": 3}, {"title": "산 너머로 가 보자", "quote": "소녀는 저 산 너머에 가 본 적이 있느냐고 물었습니다.", "text": "소녀는 소년에게, 저 산 너머에 가 본 적이 있느냐고 물었습니다. 소년은 없다고 대답했습니다. 소녀는 그곳에 가 보고 싶다며 같이 가자고 했습니다. 소년은 쑥스러워서 망설였지만, 소녀가 앞장서자 말없이 뒤를 따랐습니다.\n\n둘은 가을 들길을 걸었습니다. 벼가 누렇게 익어 가는 논둑을 지나고, 허수아비가 서 있는 들판을 지났습니다. 소녀는 서울에서는 볼 수 없던 풍경이 신기한지 연신 두리번거렸습니다. 소년은 그런 소녀를 보며 같이 걷고 있다는 사실만으로도 마음이 부풀었습니다.\n\n걷는 동안 소녀는 이것저것 물었고, 소년은 짧게 대답했습니다. 말수는 적었지만 두 사람 사이에는 어느새 따뜻한 기운이 흐르고 있었습니다.\n\n소녀는 걷다가 힘이 들면 잠시 쉬어 가자고 하면서도 발길을 멈추지 않았습니다. 새로운 곳을 보고 싶다는 마음이 몸의 피곤함보다 컸던 모양입니다. 소년은 소녀의 걸음에 맞춰 일부러 천천히 걸었고, 그 배려를 소녀가 알아챘는지는 알 수 없지만 소녀는 가끔 소년을 돌아보며 웃어 주었습니다.", "id": 4}, {"title": "들꽃과 시큼한 무", "quote": "소년은 소녀가 좋아할 만한 것들을 하나하나 찾아 주었습니다.", "text": "길가에는 가을꽃이 흐드러지게 피어 있었습니다. 소녀는 꽃을 보면 멈춰 서서 이름을 물었고, 마음에 드는 꽃이 있으면 소년이 꺾어 주었습니다. 소녀의 손에는 보랏빛, 노란빛 꽃다발이 점점 커졌습니다.\n\n소년은 무밭에서 무를 하나 뽑아 껍질을 벗겨 소녀에게 건네기도 했습니다. 소녀는 조심스럽게 한입 베어 물었다가, 맛이 너무 시큼해서 얼굴을 찡그렸습니다. 두 사람은 그 모습을 보고 서로 웃음을 터뜨렸습니다.\n\n소년은 소녀가 도시 아이라서 시골의 것들을 낯설어한다는 것을 알았습니다. 하지만 그것이 부끄럽기보다는, 자기가 아는 것을 소녀에게 보여 줄 수 있어서 기쁘기도 했습니다.\n\n소녀는 소년이 아는 풀과 꽃과 열매 이야기를 신기한 듯 들었습니다. 도시에서 자란 소녀에게는 모든 것이 처음 보는 것이었고, 소년에게는 늘 보던 것이 소녀 덕분에 새롭게 보이기 시작했습니다. 두 아이는 그렇게 서로에게 처음 보는 세상을 보여 주고 있었습니다.", "id": 5}, {"title": "갑자기 몰려온 먹구름", "quote": "맑던 하늘이 어느새 검게 변해 있었습니다.", "text": "한참을 놀다 보니 어느새 먼 산을 넘어 먹구름이 몰려오고 있었습니다. 맑았던 하늘이 갑자기 어두워지더니 바람이 불고 굵은 빗방울이 하나둘 떨어지기 시작했습니다. 이윽고 소나기가 쏟아졌습니다.\n\n소년과 소녀는 비를 피할 곳을 찾아 허둥지둥 달렸습니다. 마침 가까운 곳에 원두막이 하나 있었지만, 지붕이 낡아 빗물이 줄줄 샜습니다. 두 사람은 그 아래에서 몸을 웅크리고 비가 그치기를 기다렸습니다.\n\n소녀의 입술이 파랗게 질리고 몸이 떨리는 것을 본 소년은 마음이 급해졌습니다. 어떻게든 소녀가 비를 덜 맞게 해 주어야 한다고 생각했습니다.\n\n소년은 빗속에서 소녀의 손을 잡아 주지도, 따뜻한 말을 건네지도 못했습니다. 그러나 비를 맞는 소녀 곁에서 어쩔 줄 몰라 하는 마음은 어떤 말보다 분명하게 전해지고 있었습니다. 하늘은 야속하게도 한동안 비를 멈추지 않았습니다.", "id": 6}, {"title": "수숫단 속의 소녀", "quote": "소년은 소녀를 수숫단 속으로 들어가게 했습니다.", "text": "소년은 근처 밭에 세워 둔 수숫단을 보았습니다. 그는 수숫단을 헤쳐 속에 작은 공간을 만들고, 소녀에게 그 안으로 들어가라고 했습니다. 소녀는 말없이 들어가 몸을 웅크렸습니다.\n\n소년은 소녀가 비를 덜 맞도록 수숫단 겉에서 그것을 붙잡아 주었습니다. 자기는 비를 고스란히 맞으면서도 소년은 불평 한마디 하지 않았습니다. 그저 소녀가 괜찮은지, 춥지는 않은지만 걱정했습니다.\n\n소나기는 얼마 뒤 점차 잦아들었습니다. 수숫단 속에서 나온 소녀는 얼굴빛이 하얗게 질려 있었고, 입술은 여전히 떨리고 있었습니다.\n\n소년의 어깨는 비에 흠뻑 젖었고 옷에서는 물이 뚝뚝 떨어졌습니다. 그런데도 소년은 소녀 쪽을 자꾸 돌아보며 괜찮으냐고 물었습니다. 이 짧은 시간 동안 소년은 누군가를 지켜 주고 싶다는 마음이 어떤 것인지를 처음으로 알게 되었습니다.", "id": 7}, {"title": "불어난 개울, 소년의 등", "quote": "소년은 소녀를 업고 불어난 개울을 건넜습니다.", "text": "비가 그치고 돌아가려는데 그 사이 개울물이 크게 불어나 있었습니다. 아침에 건너온 징검다리가 물에 잠겨 보이지 않았습니다. 소녀는 물을 보고 선뜻 발을 내딛지 못했습니다.\n\n소년은 잠시 망설이다가 등을 돌려 앉았습니다. 소녀는 말없이 그의 등에 업혔습니다. 소년은 두 다리에 힘을 주고 물살을 가르며 한 걸음 한 걸음 개울을 건넜습니다. 소녀의 몸이 가볍게 느껴졌고, 소녀의 숨소리가 가까이에서 들렸습니다.\n\n무사히 건너편에 닿자 두 사람은 아무 말도 하지 못했습니다. 소년은 마음속으로 이 시간이 조금만 더 길었으면 하고 바랐습니다. 하지만 그것이 둘이 함께한 마지막 즐거운 날이 될 줄은 몰랐습니다.\n\n소녀는 소년의 등에서 내려서도 한동안 말이 없었습니다. 옷에는 소년의 등에 있던 물기와 흙이 배어 있었고, 소녀는 그것을 털어 내지 않았습니다. 해는 다시 구름 사이로 나왔고 들판에는 비 갠 뒤의 맑은 냄새가 가득했지만, 소녀의 얼굴은 어쩐지 쓸쓸해 보였습니다.", "id": 8}, {"title": "앓아누운 소녀", "quote": "소녀는 그날 비를 맞은 뒤로 자리에 눕고 말았습니다.", "text": "소나기를 맞은 뒤로 소녀는 몸져누웠습니다. 원래도 몸이 약했던 아이라 한번 앓기 시작하자 쉽게 낫지 않았습니다. 소년은 개울가에 나가 보았지만 소녀는 보이지 않았습니다.\n\n소년은 소녀가 어떻게 지내는지 궁금했지만 선뜻 찾아갈 수는 없었습니다. 그러던 어느 날 마침내 개울가에서 소녀를 다시 만났습니다. 소녀는 많이 야위어 있었습니다. 소녀는 소년에게 대추를 건네며, 이제 곧 이사를 가게 되었다고 말했습니다.\n\n소년은 갑작스러운 말에 가슴이 철렁했습니다. 소녀는 집안 사정이 어려워져서 떠나게 되었다고 했고, 소년은 아무 대답도 하지 못했습니다. 그저 소녀가 건네준 대추를 손에 꼭 쥐고 있을 뿐이었습니다.\n\n소녀가 건넨 대추는 소년에게 오래도록 잊지 못할 선물이 되었습니다. 소녀는 마지막까지 소년에게 많은 말을 하지 못했습니다. 두 아이는 서로의 마음을 말로 하지 못한 채, 가을이 끝나 가는 개울가에서 헤어질 날을 맞이하고 있었습니다.", "id": 9}, {"title": "소녀가 남긴 마지막 부탁", "quote": "소년은 밤늦게 어른들의 이야기를 엿듣고 말았습니다.", "text": "소년은 소녀에게 줄 호두를 따러 덕쇠 할아버지네 호두밭에 가서 호두를 몰래 따 오려 했습니다. 소녀에게 뭐라도 주고 싶은 마음이 간절했기 때문입니다.\n\n그날 밤, 소년은 잠결에 아버지가 어머니와 나누는 이야기를 들었습니다. 윤 초시 댁이 요즘 형편이 좋지 않아 이사를 가는데, 그 집 아이가 앓다가 끝내 세상을 떠났다는 이야기였습니다. 그 아이는 죽기 전에 자기가 입던 옷을 그대로 입혀서 묻어 달라고 했다고 합니다. 그날 소나기를 맞고 개울을 건널 때 입었던 옷, 소년의 등에서 묻은 흙물이 아직 남아 있는 옷을 말입니다.\n\n소년은 아무 말도 하지 못한 채 어둠 속에서 눈을 크게 뜨고 있었습니다. 소녀가 던진 흰 조약돌이 아직도 주머니 속에 있었습니다. 소년이 알던 가장 맑고 짧은 가을이 그렇게 끝나 있었습니다.\n\n「소나기」는 이렇게 짧은 만남과 갑작스러운 이별을 아주 담담하게 그려 낸 이야기입니다. 소년과 소녀가 함께한 시간은 며칠에 지나지 않지만, 그 맑은 마음은 읽는 사람의 가슴에 오래 남습니다. 소나기가 한바탕 지나가듯 짧았기에, 그 가을은 더욱 깊이 기억됩니다.", "id": 10}];
let cur=0,synth=window.speechSynthesis,reading=false,token=0;
function stopReading(){reading=false;token++;try{synth.cancel();}catch(e){}
document.querySelectorAll('.tts-btn').forEach(b=>{b.textContent='🔊 읽어주기 (끝까지 이어서)';b.classList.remove('active');});}
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
stopReading();render(cur);}
function render(i){if(i<0||i>=SCENES.length)return;cur=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 10';
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookPageIndicator').textContent=s.id+' / 10 쪽';
document.getElementById('sceneSlider').value=s.id;
if(document.getElementById('galleryView').style.display==='flex'){const c=document.querySelectorAll('.gallery-card')[i];if(c)c.scrollIntoView({behavior:'smooth',block:'start'});}else window.scrollTo(0,0);}
function userGo(i){stopReading();render(i);}
function prevScene(){if(cur>0)userGo(cur-1);}
function nextScene(){if(cur<SCENES.length-1)userGo(cur+1);}
function onSliderChange(v){userGo(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700"></div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p>';
d.firstChild.textContent='제 '+s.id+' 부';d.querySelector('.gallery-title').textContent=s.title;
d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';d.querySelector('.gallery-text').textContent=s.text;c.appendChild(d);});}
function speakScene(i,myToken){
if(!reading||myToken!==token)return;
render(i);
const s=SCENES[i];
const u=new SpeechSynthesisUtterance('제 '+s.id+' 부. '+s.title+'. '+s.text.replace(/\n+/g,' '));
u.lang='ko-KR';u.rate=.9;
u.onend=()=>{if(!reading||myToken!==token)return;
 if(i<SCENES.length-1){setTimeout(()=>speakScene(i+1,myToken),700);}
 else{stopReading();}};
u.onerror=()=>{};
synth.speak(u);}
function toggleTts(){
if(!synth){alert('이 기기에서는 읽어주기를 쓸 수 없습니다.');return;}
if(reading){stopReading();return;}
try{synth.cancel();}catch(e){}
reading=true;token++;
document.querySelectorAll('.tts-btn').forEach(b=>{b.textContent='⏹ 읽기 멈추기';b.classList.add('active');});
speakScene(cur,token);}
let ac=null,playing=false,mt=null;
function toggleMusic(){if(playing){playing=false;clearTimeout(mt);document.getElementById('btnMusic').classList.remove('active');}
else{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
playing=true;document.getElementById('btnMusic').classList.add('active');
const n=[523.25,587.33,659.25,783.99,880,1046.5];let k=0;
(function play(){if(!playing)return;const o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(n[k++%n.length],ac.currentTime);
g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.06,ac.currentTime+.05);
g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.8);o.connect(g);g.connect(ac.destination);
o.start();o.stop(ac.currentTime+1.9);mt=setTimeout(play,900);})();}}
window.onload=()=>{render(0);buildGallery();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScene();if(e.key==='ArrowLeft')prevScene();});
</script></body></html>
