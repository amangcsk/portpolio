<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수난이대 - 하근찬 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#5b3a29;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.terms{margin-top:1.6rem;background:#FAF3E0;border:1px dashed #d9c08a;border-radius:10px;padding:1rem 1.2rem}
.terms h3{font-family:var(--font-story);font-size:1.1rem;margin-bottom:.4rem;color:var(--primary-color)}
.terms li{font-size:1.1rem;line-height:1.8;margin-left:1.2rem}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div class="brand"><span>📖</span> <span class="brand-title">하근찬 수난이대 이야기책</span></div>
<div class="nav-actions">
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span><span id="bookSub"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>
<div class="quote-label" id="bookQLabel"></div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p>
<div class="terms" id="bookTerms"></div></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn" id="btnTts" onclick="toggleTtsCurrent()">🔊 읽어주기</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="10" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 책은 하근찬 선생님(1931~2007)의 소설 「수난이대」(1957)의 줄거리를 제가 쉬운 말로 풀어 길게 엮어 10부분으로 나눈 것입니다. 원작은 저작권이 남아 있어 원문을 그대로 옮기지 않았고, 대사와 장면의 세부는 이해를 돕기 위해 보태 쓴 부분이 있습니다. 정확한 원문은 책으로 확인해 주세요.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"id": 1, "sub": "수난이대 ① 아침", "title": "진수가 돌아온다는 소식", "qlabel": "이 대목의 마음", "quote": "오늘은 아들이 돌아오는 날이다.", "text": "날이 막 밝아 오는 늦여름 아침입니다. 시골 마을에 사는 박만도 어른은 평소와 달리 일찍 눈을 떴습니다. 오늘은 전쟁터에 나갔던 외아들 진수가 기차를 타고 돌아오는 날이기 때문입니다. 며칠 전 면사무소에서 \"진수가 오늘 낮 기차로 도착한다\"는 소식을 전해 주었고, 만도는 그 소식을 들은 뒤로 잠을 거의 이루지 못했습니다.\n\n만도는 한쪽 팔이 없는 사람입니다. 오른팔 쪽 소매가 비어서 늘 허리춤에 말아 넣고 다닙니다. 그래서 무슨 일이든 남보다 시간이 오래 걸리지만, 오늘만은 마음이 앞서 발걸음이 저절로 빨라집니다. 아내는 \"아침이나 드시고 가세요\" 하고 말려도, 만도는 \"진수 오는데 밥이 넘어가나\" 하며 대문을 나섭니다.\n\n산과 들은 아직 이슬이 마르지 않았습니다. 어디선가 매미가 울기 시작합니다. 만도는 이 길을 걸으며 지난 몇 해 동안 아들을 기다려 온 마음을 가만히 떠올립니다.", "terms": ["6·25 전쟁: 1950년에 일어나 3년 동안 이어진 우리나라의 전쟁. 수많은 젊은이가 전쟁터에 나갔고 다치거나 돌아오지 못했습니다.", "면사무소: 시골에서 여러 마을을 묶은 '면' 단위의 일을 보는 관청."]}, {"id": 2, "sub": "수난이대 ② 장터", "title": "고등어 한 손을 사다", "qlabel": "이 대목의 마음", "quote": "아들에게 맛있는 걸 먹이고 싶다.", "text": "정거장으로 가는 길목에는 작은 장터가 있습니다. 만도는 그곳 가게 앞에서 걸음을 멈춥니다. 한참 망설이다가 싱싱한 고등어 두 마리를 새끼줄에 꿰어 샀습니다. 이를 '고등어 한 손'이라고 합니다. 가난한 살림에 고등어는 큰맘 먹어야 살 수 있는 귀한 반찬입니다.\n\n\"이걸 구워서 진수 밥상에 올려야지.\" 만도는 혼자 중얼거리며 고등어를 소중히 들고 걷습니다. 아들이 어릴 때부터 고등어를 좋아했던 일이 떠오릅니다. 전쟁터의 거친 음식에 몇 해를 시달렸을 아들이 얼마나 집밥이 그리울까 생각하면 가슴이 뭉클해집니다.\n\n고등어를 든 팔이 하나뿐이라 자꾸 몸이 한쪽으로 기웁니다. 그래도 만도는 즐거운 얼굴입니다. 지나가는 이웃이 \"만도, 오늘 어디 가나?\" 하고 물으면 \"아들 마중 가네\" 하고 자랑스럽게 대답합니다. 그 한마디에 이웃도 반가워 웃어 줍니다.", "terms": ["고등어 한 손: 고등어 두 마리를 묶어 파는 단위. '한 손'은 물고기 두 마리를 뜻합니다.", "새끼줄: 볏짚으로 꼬아 만든 가는 줄. 옛날에는 비닐봉지 대신 물건을 꿰어 들고 다녔습니다."]}, {"id": 3, "sub": "수난이대 ③ 옛 기억", "title": "팔을 잃던 그날", "qlabel": "이 대목의 마음", "quote": "그때 일을 생각하면 아직도 가슴이 서늘하다.", "text": "걷다가 만도는 문득 자기가 한쪽 팔을 잃던 날을 떠올립니다. 그것은 일제강점기 말기, 일본이 우리나라 사람들을 강제로 끌고 가서 일을 시키던 때의 일입니다. 만도는 남쪽 먼 섬으로 끌려가 비행장을 만드는 공사에 동원되었습니다.\n\n산 밑에 굴을 파고 다이너마이트로 바위를 부수는 위험한 일이었습니다. 그날도 굴 속에서 바위에 구멍을 뚫는 일을 하는데, 갑자기 호루라기 소리가 울렸습니다. \"피해라!\" 하는 신호였습니다. 만도는 놀라서 굴 밖으로 뛰쳐나가려 했지만, 한 걸음이 늦었습니다. 꽝 하는 소리와 함께 눈앞이 캄캄해졌습니다.\n\n정신을 차려 보니 팔 하나가 없었습니다. 피가 철철 흐르는 몸으로 겨우 목숨을 건졌고, 얼마 뒤 한쪽 팔이 없는 몸으로 고향에 돌아왔습니다. 그날 이후 만도는 \"내 팔이 이렇게 된 건 나라가 힘이 없어서\"라는 생각을 가슴에 새기고 살아왔습니다.", "terms": ["징용: 전쟁 때 나라가 사람들을 강제로 끌고 가서 일을 시키던 일. 일제강점기 말에 많은 우리 청년들이 끌려갔습니다.", "다이너마이트: 바위나 땅을 부수는 데 쓰는 폭발물. 아주 위험해서 작업할 때 호루라기로 미리 알렸습니다."]}, {"id": 4, "sub": "수난이대 ④ 마을길", "title": "아들이 걸어간 길", "qlabel": "이 대목의 마음", "quote": "그 어린것이 전쟁터에 가다니.", "text": "만도는 이어서 아들 진수를 떠올립니다. 진수는 만도가 불구의 몸으로 돌아온 뒤 낳은 귀한 아들입니다. 팔이 없는 아버지를 보고 자란 진수는 어려서부터 힘든 일을 먼저 나서서 거들었습니다. 그런 아들이 자랑스러워, 만도는 장터에 다녀올 때마다 아들 몫으로 사탕이나 과자를 꼭 챙겼습니다.\n\n그러다 6·25 전쟁이 터졌습니다. 얼마 뒤 진수에게도 군대에 가라는 통지서가 날아왔습니다. 만도는 그 종이를 쥐고 말을 잃었습니다. 자기는 징용에 끌려갔다 팔을 잃었는데, 이제 아들까지 전쟁터로 끌려가는 것입니다. \"몸 성히만 돌아오너라.\" 진수를 보내던 날 만도가 할 수 있었던 말은 그것뿐이었습니다.\n\n그 뒤로 진수에게서는 간간이 편지가 왔습니다. 글을 모르는 만도는 동네 사람에게 편지를 읽어 달라 부탁했고, 그때마다 \"몸은 무사합니다\"라는 구절에 안도의 숨을 내쉬곤 했습니다. 그러던 편지가 어느 순간 끊어졌습니다. 가슴 졸이던 시간이 길게 이어졌습니다.", "terms": ["통지서: 나라에서 어떤 일을 하라고 알리는 문서. 여기서는 군대에 가라는 소집 통지서를 말합니다.", "불구: 몸의 한 부분이 없어지거나 제대로 움직이지 못하는 상태. 지금은 '장애'라는 말을 씁니다."]}, {"id": 5, "sub": "수난이대 ⑤ 정거장", "title": "기적 소리를 기다리며", "qlabel": "이 대목의 마음", "quote": "기차 소리가 들리자 가슴이 쿵 내려앉았다.", "text": "정거장에 닿은 만도는 시간을 물어보고서야 기차가 오려면 아직 한참 남았다는 것을 알았습니다. 그늘에 앉아 기다리면서도 만도는 가만히 있지를 못합니다. 일어섰다 앉았다를 되풀이하며 철길 쪽을 자꾸 바라봅니다.\n\n시간이 흘러 멀리서 \"뿌우—\" 하는 기적 소리가 울립니다. 만도의 가슴이 세차게 뜁니다. 연기를 내뿜으며 기차가 들어오고, 쇳소리를 내며 멈춥니다. 문이 열리자 사람들이 우르르 내려옵니다. 보따리를 인 아낙, 장사꾼, 군복 입은 사람들이 쏟아져 나옵니다.\n\n만도는 고등어를 든 채 발끝을 세우고 사람들 얼굴을 하나하나 살핍니다. \"진수야! 진수야!\" 하고 불러도 사람들 소리에 묻혀 들리지 않습니다. 사람들이 다 빠져나가도록 아들 얼굴은 보이지 않습니다. 가슴이 철렁 내려앉습니다. \"어찌 된 거냐, 못 탄 거냐?\" 다리에 힘이 쭉 풀립니다.", "terms": ["기적 소리: 기차가 출발하거나 도착할 때 울리는 '뿌우—' 하는 소리. 증기기관차 시절에는 아주 크게 들렸습니다.", "정거장: 기차가 서는 곳. 지금의 '역'입니다."]}, {"id": 6, "sub": "수난이대 ⑥ 만남", "title": "뒤에서 들린 한마디, 아버지", "qlabel": "이 대목의 마음", "quote": "아버지, 저 여기 있어요.", "text": "바로 그때 등 뒤에서 낮은 목소리가 들립니다. \"아버지!\" 만도는 깜짝 놀라 돌아봅니다. 그런데 바로 앞에 군복 차림의 청년이 서 있습니다. 얼굴은 분명 진수인데, 한쪽 바짓가랑이가 비어 있고 겨드랑이에는 나무 목발이 끼워져 있습니다.\n\n만도는 처음에는 무슨 일인지 이해하지 못합니다. 눈을 비비고 다시 봐도 아들의 다리 하나가 없습니다. 입이 얼어붙어 아무 말도 나오지 않습니다. 다만 아들의 얼굴이 눈물로 젖어 드는 것을 보고서야 현실이 가슴에 와닿습니다. 만도는 손에 쥐고 있던 고등어를 떨어뜨릴 뻔합니다.\n\n\"이 사람아... 이게 웬일이고...\" 겨우 한마디가 흘러나옵니다. 진수는 아무 대답 없이 고개를 숙이고 입술을 깨뭅니다. 만도의 한쪽뿐인 손이 허공에서 떨립니다. 아들을 안아 주려 하는데, 한 팔로는 아들과 목발을 함께 감싸 안기가 어렵습니다. 두 사람 사이로 말없는 눈물만 흐릅니다.", "terms": ["목발: 다리가 불편한 사람이 겨드랑이에 끼고 짚는 지팡이. 보통 나무로 만들었습니다."]}, {"id": 7, "sub": "수난이대 ⑦ 주막", "title": "술잔 앞에서 터진 속마음", "qlabel": "이 대목의 마음", "quote": "내가 겪은 일을 내 아들이 겪다니.", "text": "정신을 차린 만도는 아들을 데리고 정거장 근처 주막으로 들어갑니다. 아들을 먹이려 한 것인데 실은 자기 마음을 달래려는 것이기도 합니다. 만도는 막걸리를 한 사발 청해 단숨에 들이켭니다. 좀처럼 술을 입에 대지 않는 사람이 연거푸 술잔을 비우니 진수가 걱정스럽게 바라봅니다.\n\n\"아버지, 그만 드세요.\" \"괜찮다. 오늘 같은 날 안 마시고 어쩔끼고.\" 만도의 목소리에 서러움이 묻어납니다. 그는 속으로 같은 말을 되뇝니다. '내 팔이 없는 것도 서러운데, 이제 아들 다리까지 없어졌구나. 어찌 이런 일이 있을꼬.'\n\n진수는 한참 만에 입을 엽니다. \"아버지, 저... 이 몸으로 앞으로 어떻게 삽니까?\" 만도는 대답 대신 국수 한 그릇을 시켜 아들 앞에 밀어 줍니다. \"먼저 먹어라. 사는 일은 그다음 일이다.\" 진수는 젓가락을 들고 천천히 국수를 먹습니다. 그 모습을 지켜보던 만도의 눈가가 다시 젖어 듭니다.", "terms": ["주막: 길가에서 술과 밥을 팔고 잠도 재워 주던 옛날 가게. 지금의 작은 식당 겸 술집입니다.", "막걸리: 쌀로 빚은 뿌연 빛깔의 전통 술. 농사꾼들이 힘들 때 즐겨 마셨습니다."]}, {"id": 8, "sub": "수난이대 ⑧ 진수의 이야기", "title": "전쟁터에서 있었던 일", "qlabel": "이 대목의 마음", "quote": "살아 돌아온 것만으로도 다행이다.", "text": "국수를 다 먹은 진수가 조심스럽게 전쟁터 이야기를 꺼냅니다. 어느 날 산을 오르다 갑작스러운 적의 공격을 받았고, 동료들이 쓰러지는 가운데 정신없이 엎드려 있다가 폭발에 휩쓸렸다고 합니다. 깨어 보니 야전 병원 침대였고, 다리 하나는 이미 없어진 뒤였다고 합니다.\n\n\"처음에는 차라리 죽는 게 낫겠다 싶었습니다.\" 진수의 목소리가 떨립니다. 만도는 아무 말 없이 듣기만 합니다. 자기도 팔을 잃었을 때 똑같은 생각을 했기 때문입니다. 그러나 아들 앞에서는 그 말을 입 밖에 내지 않습니다.\n\n한참 뒤 만도가 가만히 말합니다. \"그래도 이렇게 살아 돌아왔으니 됐다. 사람이 몸 한두 군데 상했다고 사람이 아닌 것도 아니다. 아비를 봐라, 팔이 하나 없어도 이렇게 살고 있지 않으냐.\" 진수는 고개를 들어 아버지의 비어 있는 소매를 한참 바라봅니다. 처음으로 아버지의 아픔이 자기 아픔처럼 느껴집니다.", "terms": ["야전 병원: 전쟁터 가까이에 임시로 세운 군 병원. 다친 병사를 가장 먼저 치료하는 곳입니다."]}, {"id": 9, "sub": "수난이대 ⑨ 돌아가는 길", "title": "고갯길을 넘어 집으로", "qlabel": "이 대목의 마음", "quote": "우리 부자, 어떻게든 살아가자.", "text": "주막을 나선 두 사람은 집으로 가는 길에 오릅니다. 정거장에서 마을까지는 산을 하나 넘어야 하는 먼 길입니다. 진수는 목발을 짚고 한 걸음씩 힘겹게 옮기고, 만도는 고등어를 들고 그 옆을 나란히 걷습니다. 아버지는 아들의 속도에 맞추려 걸음을 한껏 늦춥니다.\n\n해는 서쪽으로 기울어 붉은 노을이 산마루를 물들입니다. 매미 소리가 점점 잦아들고, 길가 풀숲에서는 풀벌레 소리가 들려옵니다. 진수가 헉헉 숨을 몰아쉬자 만도는 걸음을 멈추고 아들이 쉬도록 기다려 줍니다. \"천천히 가자. 우리가 서두를 일이 뭐 있나.\"\n\n가는 동안 만도는 아들에게 마을 소식을 하나하나 들려줍니다. 누구네 집 아들은 먼저 돌아왔고, 누구네 집 소는 새끼를 낳았다는 시시콜콜한 이야기입니다. 진수는 오랜만에 듣는 고향 이야기가 반가워 가끔 고개를 끄덕이고 희미하게 웃기도 합니다. 그 웃음을 본 만도의 마음이 조금씩 풀립니다.", "terms": ["산마루: 산등성이가 가장 높이 이어진 부분. 해 질 녘이면 붉게 물듭니다."]}, {"id": 10, "sub": "수난이대 ⑩ 외나무다리", "title": "외나무다리 위의 두 사람", "qlabel": "이 대목의 마음", "quote": "아버지의 한쪽 팔과 아들의 한쪽 다리가 하나로 모였다.", "text": "고개를 내려오니 개울이 나타납니다. 개울 위에는 널빤지 하나 놓인 외나무다리가 걸려 있습니다. 평소에도 두 팔 벌려 균형을 잡아야 건너는 위험한 다리입니다. 목발을 짚은 진수는 다리 앞에서 우뚝 멈춥니다. 건널 방법이 없습니다.\n\n만도가 말합니다. \"진수야, 업혀라.\" 진수는 놀라서 고개를 젓습니다. \"아버지, 그건 안 됩니다. 아버지는 팔도 하나뿐인데...\" 만도는 단호합니다. \"그래도 이 아비 등은 아직 튼튼하다. 어서 업혀라.\" 망설이던 진수가 아버지의 등에 업힙니다. 만도는 고등어를 아들 손에 쥐여 주고, 남은 한 손으로 아들의 다리를 받치고서 조심조심 다리에 올라섭니다.\n\n한 걸음, 또 한 걸음. 개울물이 발아래로 흐르고 두 사람의 그림자가 노을 속에 길게 늘어집니다. 아버지에게는 팔이 하나 없고 아들에게는 다리가 하나 없지만, 이렇게 서로를 의지해 포개어지니 마치 온전한 한 사람의 모습 같습니다. 아들 등에서 아버지의 숨소리가 거칠게 들리고, 아버지 목덜미에는 아들의 따뜻한 숨결이 닿습니다.\n\n다리를 무사히 건너자 저 멀리 마을의 지붕이 보입니다. 두 부자는 말없이 서로를 바라보며 웃습니다. 한 세대는 일제의 징용으로, 다음 세대는 전쟁으로 몸을 다치는 아픔을 겪었지만, 이 부자는 서로를 업고 업히며 다시 살아갈 힘을 얻습니다. 이야기는 그렇게 따뜻하면서도 서러운 노을빛 속에서 끝이 납니다.", "terms": ["수난이대(受難二代): '수난'은 어려운 일을 당하는 것, '이대'는 두 세대(아버지와 아들)를 뜻합니다. 곧 '아버지와 아들, 두 세대가 겪은 수난'이라는 제목입니다.", "외나무다리: 통나무나 널빤지 하나만 걸쳐 놓은 좁은 다리. 건너기가 위태로워 '어려운 일'을 상징하기도 합니다."]}];
let currentIndex=0, synth=window.speechSynthesis, isSpeaking=false;
function termsHtml(s){return s.terms&&s.terms.length?'<h3>📝 낱말 풀이</h3><ul>'+s.terms.map(t=>'<li>'+t+'</li>').join('')+'</ul>':'';}
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
if(m==='book')renderBookSpread(currentIndex);else{synth.cancel();isSpeaking=false;}}
function renderBookSpread(i){if(i<0||i>=SCENES.length)return;currentIndex=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 10';
document.getElementById('bookSub').textContent=s.sub;
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQLabel').textContent=s.qlabel;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookTerms').innerHTML=termsHtml(s);
document.getElementById('bookPageIndicator').textContent=s.id+' / 10 쪽';
document.getElementById('sceneSlider').value=s.id;synth.cancel();isSpeaking=false;window.scrollTo(0,0);}
function prevScene(){if(currentIndex>0)renderBookSpread(currentIndex-1);}
function nextScene(){if(currentIndex<SCENES.length-1)renderBookSpread(currentIndex+1);}
function onSliderChange(v){renderBookSpread(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700">제 '+s.id+' 부 · '+s.sub+'</div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p><div class="terms"></div>';
d.querySelector('.gallery-title').textContent=s.title;d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';
d.querySelector('.gallery-text').textContent=s.text;d.querySelector('.terms').innerHTML=termsHtml(s);c.appendChild(d);});}
function toggleTtsCurrent(){if(isSpeaking){synth.cancel();isSpeaking=false;}else{
const u=new SpeechSynthesisUtterance(SCENES[currentIndex].title+'. '+SCENES[currentIndex].text);
u.lang='ko-KR';u.rate=.9;u.onend=()=>{isSpeaking=false;};synth.speak(u);isSpeaking=true;}}
let audioCtx=null,isMusicPlaying=false,musicTimer=null;
function toggleMusic(){if(isMusicPlaying){isMusicPlaying=false;clearTimeout(musicTimer);document.getElementById('btnMusic').classList.remove('active');}
else{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();
isMusicPlaying=true;document.getElementById('btnMusic').classList.add('active');
const notes=[523.25,587.33,659.25,783.99,880,1046.5];let idx=0;
function play(){if(!isMusicPlaying)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.frequency.setValueAtTime(notes[idx++%notes.length],audioCtx.currentTime);
g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+.05);
g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+1.8);o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+1.9);musicTimer=setTimeout(play,900);}play();}}
window.onload=()=>{renderBookSpread(0);buildGallery();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScene();if(e.key==='ArrowLeft')prevScene();});
</script></body></html>
