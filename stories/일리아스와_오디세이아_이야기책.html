<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일리아스와 오디세이아 - 호메로스 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#2f4a5e;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div><span>📖</span> <span class="brand-title">호메로스 · 일리아스와 오디세이아</span></div>
<div class="nav-actions">
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>
<div class="quote-label">이 장면의 한마디</div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn" onclick="toggleTtsCurrent()">🔊 읽어주기</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="48" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 책은 호메로스의 원문이 아니라, 두 작품의 줄거리를 쉬운 말로 풀어 엮은 것입니다. 세부는 보태거나 줄인 곳이 있어 원작과 다를 수 있으니, 정확한 내용은 번역된 책으로 확인하십시오.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"title": "[일리아스 1권] 분노의 시작", "quote": "가장 힘센 영웅이 모욕을 당하자, 그의 분노가 온 군대를 흔들었다.", "text": "트로이 성 앞에서 그리스 군대가 싸운 지 벌써 10년째였습니다. 어느 날 총사령관 아가멤논이 아폴론 신을 모시는 사제의 딸을 전리품으로 붙잡아 두고 돌려주지 않았습니다. 화가 난 아폴론이 그리스 진영에 무서운 역병을 내리자 병사들이 날마다 쓰러졌습니다.\n\n결국 아가멤논은 마지못해 그 딸을 돌려보냈습니다. 그러나 대신 가장 용맹한 전사 아킬레우스의 몫이던 여인 브리세이스를 빼앗았습니다. 모든 군사 앞에서 모욕을 당한 아킬레우스는 칼을 뽑을 만큼 분했지만, 지혜의 여신 아테나의 말을 듣고 참았습니다. 그 대신 이제 싸우지 않겠다고 선언했습니다.\n\n아킬레우스의 어머니는 바다의 여신 테티스입니다. 그녀는 신들의 왕 제우스를 찾아가 그리스군이 내 아들의 빈자리를 뼈저리게 느끼게 해 달라고 빌었습니다. 제우스가 고개를 끄덕이자, 전쟁의 운명이 기울기 시작했습니다.", "id": 1}, {"title": "[일리아스 2권] 거짓 꿈과 함선 목록", "quote": "제우스가 보낸 꿈은 달콤했지만, 그것은 거짓이었다.", "text": "제우스는 아킬레우스의 어머니와 한 약속을 지키려고 아가멤논에게 거짓 꿈을 보냈습니다. 꿈은 '지금 공격하면 트로이를 무너뜨릴 수 있다'고 속삭였습니다. 잠에서 깬 아가멤논은 기뻐하며 군사들을 모았습니다.\n\n그는 먼저 병사들의 마음을 떠보려고 '이제 그만 고향으로 돌아가자'고 말했습니다. 그러자 병사들이 기다렸다는 듯이 배로 달려갔습니다. 오디세우스가 달려 나가 그들을 붙잡고 타이르고, 말썽꾼 테르시테스를 지팡이로 때려 조용히 시킨 뒤에야 군사들이 다시 모였습니다.\n\n이어서 어느 나라에서 몇 척의 배를 끌고 왔는지를 길게 읊는 '함선 목록'이 나옵니다. 그리스 전역에서 모여든 영웅들의 이름이 줄줄이 이어지는데, 이 전쟁이 얼마나 큰 전쟁인지를 보여 주는 대목입니다. 트로이 쪽도 헥토르를 앞세워 성문을 열고 나왔습니다.", "id": 2}, {"title": "[일리아스 3권] 파리스와 메넬라오스의 결투", "quote": "이 싸움의 불씨가 된 두 사람이 직접 맞붙기로 했다.", "text": "두 군대가 맞서자, 트로이의 왕자 파리스가 앞으로 나서 그리스의 영웅들에게 도전했습니다. 그런데 그의 빼어난 모습을 가로막고 선 사람이 하필이면 헬레네의 남편 메넬라오스였습니다. 파리스는 겁이 나서 뒤로 물러났습니다. 형 헥토르가 그를 크게 꾸짖었습니다.\n\n부끄러움을 느낀 파리스는, 이 전쟁의 당사자인 자신과 메넬라오스가 일대일로 싸워 이긴 쪽이 헬레네와 보물을 차지하자고 제안했습니다. 양쪽 군대는 맹세를 하고 싸움을 지켜보았습니다. 성벽 위에서는 늙은 왕 프리아모스가 헬레네에게 그리스 장수들의 이름을 하나하나 물었습니다.\n\n결투는 메넬라오스가 우세했습니다. 그가 파리스의 투구 끈을 잡고 끌고 가자 목이 졸리던 파리스가 위험해졌는데, 바로 그 순간 아프로디테 여신이 끈을 끊어 파리스를 구름에 싸서 침실로 데려갔습니다. 메넬라오스는 이긴 채로 상대를 찾아 헤맸고, 아가멤논은 약속대로 헬레네를 돌려받아야 한다고 선언했습니다.", "id": 3}, {"title": "[일리아스 4권] 깨어진 휴전", "quote": "맹세는 하룻밤도 가지 못하고 화살 한 대에 깨졌다.", "text": "올림포스의 신들은 이 일을 두고 의논했습니다. 제우스는 여기서 전쟁을 끝낼 수도 있다고 했지만, 트로이를 몹시 미워하는 헤라와 아테나가 반대했습니다. 결국 신들은 전쟁을 계속하기로 했습니다.\n\n아테나는 트로이의 궁수 판다로스를 찾아가 메넬라오스를 쏘면 큰 상을 받는다고 부추겼습니다. 판다로스가 활을 당기자 화살이 날아가 메넬라오스에게 상처를 입혔습니다. 아테나가 몰래 화살의 방향을 틀어 준 덕분에 상처는 깊지 않았습니다.\n\n맹세를 깨뜨린 일에 그리스군은 크게 분노했습니다. 아가멤논은 병사들 사이를 돌아다니며 용기를 북돋우고, 꾸물대는 장수들을 꾸짖었습니다. 이윽고 두 군대가 함성을 지르며 뒤엉켰고, 들판은 비명과 쇠 부딪히는 소리로 가득 찼습니다. 이제 전쟁은 다시 피할 수 없게 되었습니다.", "id": 4}, {"title": "[일리아스 5권] 디오메데스의 무훈", "quote": "한 젊은 장수가 신까지 물리치며 전장을 휩쓸었다.", "text": "아킬레우스가 빠진 그리스군을 이끈 영웅은 젊은 장수 디오메데스였습니다. 아테나가 그에게 용기와 힘을 불어넣자, 그는 마치 홍수 난 강물처럼 트로이 진영을 휩쓸었습니다. 이렇게 한 영웅이 눈부시게 싸우는 장면을 '무훈'이라 부릅니다.\n\n트로이의 영웅 아이네이아스가 위험에 빠지자 그의 어머니 아프로디테가 아들을 구하려고 나섰습니다. 그러나 디오메데스는 여신의 손목까지 창으로 찔러 피를 보게 했습니다. 아프로디테는 울면서 올림포스로 달아났습니다. 이어서 전쟁의 신 아레스까지 창에 맞아 하늘로 돌아가 아버지 제우스에게 하소연했습니다.\n\n제우스는 오히려 아레스를 나무랐습니다. 사람과 신이 한 전장에서 싸우는 이 장면은, 신들이 이 전쟁에 얼마나 깊이 뛰어들었는지를 잘 보여 줍니다. 그렇게 첫날의 싸움은 그리스군의 기세로 기울었습니다.", "id": 5}, {"title": "[일리아스 6권] 헥토르와 안드로마케", "quote": "죽을 줄 알면서도, 그는 부끄럽지 않게 싸우러 나갔다.", "text": "전투가 잠시 잦아들 때 헥토르는 어머니의 부탁으로 성안에 들어와 여신께 제물을 바치게 했습니다. 그리고 동생 파리스를 찾아가 전쟁터로 나오라고 재촉했습니다. 마지막으로 아내 안드로마케와 어린 아들을 만나러 성문 쪽으로 달려갔습니다.\n\n안드로마케는 눈물을 흘리며 말했습니다. 당신이 죽으면 나는 누구를 의지하느냐, 제발 성벽 안에서 싸워 달라고 애원했습니다. 헥토르는 그 마음을 알았지만 대답했습니다. 언젠가 트로이가 망할 것을 안다, 그렇더라도 비겁하게 숨는다면 사람들 앞에 설 수 없다고 했습니다.\n\n헥토르가 아들을 안으려 하자, 아기는 아버지의 투구에서 흔들리는 말총 깃털에 놀라 울음을 터뜨렸습니다. 두 사람은 얼굴을 마주 보고 웃었고, 헥토르는 투구를 벗어 땅에 놓고 아들을 안아 올리며 아들이 아버지보다 훌륭한 사람이 되기를 빌었습니다. 이 장면은 『일리아스』에서 가장 따뜻하고도 슬픈 장면으로 꼽힙니다.", "id": 6}, {"title": "[일리아스 7권] 헥토르와 아이아스의 결투", "quote": "해가 지자 두 영웅은 서로에게 선물을 주고 헤어졌다.", "text": "트로이로 돌아간 헥토르는 그리스 장수 가운데 한 사람과 일대일로 싸우자고 제안했습니다. 아홉 명이 나서겠다고 했고, 제비뽑기로 거구의 전사 아이아스가 뽑혔습니다. 아이아스는 거대한 방패를 들고 천천히 걸어 나와 헥토르를 마주했습니다.\n\n두 사람은 창을 던지고 큰 바위까지 집어 던지며 싸웠지만 승부가 나지 않았습니다. 그러다 해가 저물자 전령들이 나와 이제 밤이 되었으니 그만하라고 말렸습니다. 헥토르와 아이아스는 상대의 용기를 칭찬하며 선물을 주고받았습니다. 헥토르는 칼을, 아이아스는 허리띠를 주었습니다. 서로 죽이려 싸우고도 존경을 잃지 않는 모습이 인상적입니다.\n\n한편 그리스군은 죽은 이들을 불에 태워 장례를 치르고, 배들을 지키기 위해 높은 방벽과 깊은 도랑을 만들었습니다. 신들 가운데 포세이돈은 이 방벽이 너무 크다고 불평했지만, 결국 이 벽이 훗날 큰 싸움의 무대가 됩니다.", "id": 7}, {"title": "[일리아스 8권] 제우스의 저울", "quote": "제우스는 저울을 들어 올렸고, 그리스의 운명이 아래로 가라앉았다.", "text": "제우스는 올림포스의 신들을 모아 놓고 엄하게 경고했습니다. 누구든 내 허락 없이 전쟁에 끼어들면 하늘에서 내던져 버리겠다는 것이었습니다. 그리고 황금 저울을 꺼내 트로이와 그리스의 운명을 각각 접시에 올렸습니다.\n\n저울에서는 그리스의 접시가 아래로 가라앉았습니다. 이는 그리스군에게 불운이 닥친다는 뜻이었습니다. 제우스가 이다 산에서 번개를 내리치자 그리스 병사들은 겁에 질렸습니다. 디오메데스와 오디세우스 같은 용사들도 물러서야 했습니다.\n\n헥토르는 기세가 올라 그리스 군을 방벽 안까지 몰아붙였습니다. 해가 저물자 트로이군은 처음으로 성 안으로 돌아가지 않고 들판에서 밤을 지새우기로 했습니다. 수많은 모닥불이 별처럼 피어올랐고, 그리스 진영의 사람들은 두려움에 떨며 밤을 맞았습니다. 아킬레우스 없이 이 위기를 넘기기는 어려워 보였습니다.", "id": 8}, {"title": "[일리아스 9권] 아킬레우스에게 온 사절단", "quote": "산더미 같은 선물도, 상한 마음을 돌리지는 못했다.", "text": "다급해진 아가멤논은 장수들을 모아 놓고 자신의 잘못을 인정했습니다. 그리고 오디세우스, 아이아스, 아킬레우스의 옛 스승 포이닉스를 사절로 보내 아킬레우스를 달래기로 했습니다. 빼앗은 브리세이스를 돌려주고 막대한 선물과 자기 딸까지 주겠다는 제안이었습니다.\n\n사절들은 아킬레우스를 찾아가 정성껏 말했습니다. 그러나 아킬레우스는 거절했습니다. 그는 어머니에게서 두 가지 운명을 들었다고 말했습니다. 여기 남아 싸우면 일찍 죽지만 이름이 영원히 남고, 고향에 돌아가면 오래 살지만 이름이 잊힌다는 것이었습니다. 이제는 고향으로 돌아가는 쪽이 낫지 않을까 흔들린다고 털어놓았습니다.\n\n옛 스승 포이닉스는 눈물로 설득했고, 아이아스는 짧고 곧은 말로 호소했습니다. 아킬레우스는 그 말에 마음이 조금 움직였으나 끝내 싸움에 나서겠다고 약속하지는 않았습니다. 사절단은 빈손으로 돌아갔습니다.", "id": 9}, {"title": "[일리아스 10권] 밤의 정찰", "quote": "모두가 잠든 밤, 두 영웅이 어둠 속을 걸어 적진으로 갔다.", "text": "그날 밤 아가멤논도 잠들지 못했습니다. 그는 장수들을 깨워 이 위기를 의논했고, 적진을 몰래 살펴볼 사람을 보내기로 했습니다. 디오메데스가 자원했고, 그가 가장 믿는 동료로 오디세우스를 골랐습니다.\n\n같은 시각 트로이 쪽에서는 돌론이라는 날랜 사람이 그리스 진영을 염탐하러 나섰습니다. 길목에서 기다리던 디오메데스와 오디세우스가 그를 붙잡아 트로이군의 배치를 캐물었습니다. 돌론은 목숨을 구하려고 모든 것을 털어놓았지만 결국 죽임을 당했습니다.\n\n두 사람은 알아낸 정보를 따라 새로 도착한 트라키아 왕 레소스의 진영을 습격해 잠든 병사들을 쓰러뜨리고 아름다운 말들을 끌고 돌아왔습니다. 아테나가 그들을 지켜 주었습니다. 이 대목은 전쟁이 용맹만이 아니라 꾀와 기습으로도 치러진다는 것을 보여 줍니다.", "id": 10}, {"title": "[일리아스 11권] 쓰러지는 장수들", "quote": "그리스의 이름난 장수들이 차례차례 부상을 입었다.", "text": "날이 밝자 아가멤논이 앞장서 눈부신 무훈을 세웠습니다. 그가 적들을 쓰러뜨리며 전진하자 트로이군이 밀려났습니다. 그러나 곧 창에 맞아 부상을 입고 전차를 타고 물러났습니다.\n\n그가 빠지자 헥토르가 다시 기세를 올렸습니다. 디오메데스가 발에 화살을 맞고 물러났고, 오디세우스도 혼자 남아 적에게 둘러싸였다가 부상을 입었습니다. 아이아스가 와서 그를 구해 주었습니다. 의사인 마카온까지 부상을 입자, 그리스군은 순식간에 위태로워졌습니다.\n\n부상자를 살피던 노장 네스토르는 아킬레우스의 친구 파트로클로스를 불러 말했습니다. 아킬레우스가 끝내 나서지 않겠다면, 자네라도 아킬레우스의 갑옷을 입고 나가 병사들의 기운을 북돋워 달라는 것이었습니다. 파트로클로스는 마음이 무거워져 아킬레우스에게 돌아갔습니다. 이 한마디가 훗날 큰 비극으로 이어집니다.", "id": 11}, {"title": "[일리아스 12권] 방벽이 무너지다", "quote": "그리스군이 믿고 쌓은 벽에 마침내 구멍이 뚫렸다.", "text": "트로이군은 도랑을 건너 방벽으로 몰려왔습니다. 전차로는 깊은 도랑을 건널 수 없었으므로, 지혜로운 폴리다마스의 충고에 따라 모두 말에서 내려 걸어서 공격했습니다. 그러나 헥토르는 하늘에서 독수리가 뱀을 놓치는 불길한 징조를 보고도 용기만 믿고 밀어붙였습니다.\n\n방벽 위에서는 아이아스와 그리스 장수들이 필사적으로 막아 냈습니다. 싸움은 한동안 팽팽했습니다. 그러다 헥토르가 커다란 바위를 번쩍 들어 올려 성문에 던졌습니다. 문의 빗장이 부서지고 문짝이 쪼개졌습니다.\n\n트로이군은 함성을 지르며 안으로 몰려 들어왔습니다. 그리스군은 배 쪽으로 도망쳤습니다. 헥토르의 얼굴은 밤처럼 검게 빛났고 그의 눈은 불꽃처럼 타올랐다고 시인은 노래합니다. 이제 그리스 배들이 불탈 위험이 눈앞에 닥쳤습니다.", "id": 12}, {"title": "[일리아스 13권] 포세이돈이 그리스군을 돕다", "quote": "바다의 신이 몰래 나타나 지쳐 가는 병사들의 등을 밀어 주었다.", "text": "제우스가 트로이 쪽에서 눈을 돌린 사이, 포세이돈이 이때다 하고 나섰습니다. 그는 예언자 칼카스의 모습으로 나타나 두 아이아스(큰 아이아스와 작은 아이아스)의 팔다리에 새 힘을 불어넣었습니다. 두 사람은 이전의 기운을 되찾았습니다.\n\n그 후로 그리스군은 서서히 반격했습니다. 크레타의 이도메네우스가 앞장서 활약했고, 많은 트로이 장수들이 쓰러졌습니다. 헥토르가 그리스군의 가장 단단한 곳을 뚫지 못한 채 서로 밀고 밀리는 싸움이 길게 이어졌습니다.\n\n그 와중에도 헥토르는 물러서지 않고 동생 파리스와 폴리다마스를 불러 모아 다시 진을 짜고 공격했습니다. 아이아스가 그에게 외쳤습니다. 가까이 오라, 어차피 네 힘으로 우리 배를 태울 수 없고, 너희 성이 먼저 함락될 것이다. 헥토르는 이 말에 답하며 다시 함성을 지르며 나아갔습니다.", "id": 13}, {"title": "[일리아스 14권] 헤라가 제우스를 잠재우다", "quote": "아내의 계략에 빠진 신들의 왕이 깊은 잠에 들었다.", "text": "그리스군이 밀리는 것을 지켜보던 헤라는 한 가지 꾀를 냈습니다. 제우스의 눈길을 돌려놓으면 포세이돈이 마음 놓고 그리스군을 도울 수 있다는 생각이었습니다. 헤라는 아프로디테에게서 사랑의 허리띠를 빌려 곱게 단장하고 제우스를 찾아갔습니다.\n\n제우스는 헤라의 아름다움에 마음을 빼앗겼습니다. 두 신은 이다 산에서 함께 있었고, 곧 잠의 신 히프노스가 제우스를 깊은 잠에 빠뜨렸습니다. 헤라의 계략은 성공했습니다.\n\n이 틈에 포세이돈이 앞에 나서서 그리스군을 이끌었고, 큰 아이아스가 헥토르의 가슴에 커다란 돌을 던졌습니다. 헥토르는 쓰러져 피를 토했고, 동료들이 그를 부축해 전장 밖으로 데려갔습니다. 트로이군은 크게 흔들려 도망쳤고, 그리스군은 한숨을 돌렸습니다.", "id": 14}, {"title": "[일리아스 15권] 제우스가 깨어나다", "quote": "눈을 뜬 제우스는 노여워하며 전세를 되돌렸다.", "text": "깨어난 제우스는 헤라의 속임수를 알아채고 크게 노했습니다. 그는 포세이돈을 전장에서 물러나게 하고, 아폴론에게 명령해 쓰러진 헥토르를 다시 일으켜 세우게 했습니다. 아폴론의 도움으로 헥토르는 새 힘을 얻었습니다.\n\n제우스는 앞날을 미리 밝혔습니다. 파트로클로스가 죽고, 헥토르가 아킬레우스의 손에 쓰러진 뒤에야 트로이가 함락될 것이라는 것이었습니다. 신들 가운데 이 말을 아는 이는 많지 않았습니다.\n\n아폴론이 방패를 흔들며 앞장서 달려가자 그리스 병사들은 겁에 질려 배 뒤로 도망쳤습니다. 트로이군은 방벽을 넘어 배에까지 닿았습니다. 아이아스는 배 위를 뛰어다니며 긴 창으로 불을 들고 오는 적을 막아 냈습니다. 헥토르는 불을 가져오라고 외쳤습니다. 이제 그리스 배가 불타는 것이 눈앞의 일이 되었습니다.", "id": 15}, {"title": "[일리아스 16권] 파트로클로스의 출전", "quote": "친구의 갑옷을 입은 그는 너무 멀리까지 달려 나갔다.", "text": "배에 불이 붙기 시작하자 파트로클로스가 눈물을 흘리며 아킬레우스에게 갔습니다. 그는 갑옷을 빌려 달라고 청했습니다. 트로이군이 그 갑옷을 보면 아킬레우스가 돌아온 줄 알고 물러설 거라는 이유였습니다. 아킬레우스는 허락하면서 당부했습니다. 배에서 적을 몰아내기만 하고 절대 성벽까지 쫓아가지 말라고 했습니다.\n\n갑옷을 입은 파트로클로스가 나타나자 트로이군은 정말로 겁에 질려 물러났습니다. 그러나 승리에 취한 파트로클로스는 당부를 잊고 성벽 앞까지 쫓아가 수많은 적을 쓰러뜨렸습니다. 제우스의 아들 사르페돈까지 그의 창에 죽었습니다.\n\n그때 아폴론이 나타나 파트로클로스의 등을 쳐 투구와 갑옷을 벗겨 냈습니다. 약해진 파트로클로스를 트로이의 한 장수가 찔렀고, 마지막으로 헥토르가 창으로 찔러 숨을 끊었습니다. 죽어 가며 그는 헥토르에게 너도 곧 죽을 것이라고 말했습니다.", "id": 16}, {"title": "[일리아스 17권] 시신을 둘러싼 싸움", "quote": "이미 죽은 친구를 지키려고 양쪽이 목숨을 걸고 맞붙었다.", "text": "파트로클로스가 쓰러지자 그의 시신을 두고 치열한 싸움이 벌어졌습니다. 메넬라오스와 큰 아이아스가 시신을 지켰고, 트로이군은 그 시신을 끌고 가려고 달려들었습니다. 한쪽은 친구를 위해, 다른 쪽은 영예를 위해 물러서지 않았습니다.\n\n헥토르는 시신의 몸에서 아킬레우스의 갑옷을 벗겨 자기 몸에 입었습니다. 제우스는 그것을 보며 가엾다고 여겼습니다. 이제 곧 죽을 사람이 불멸의 갑옷을 입는다는 안타까움이었습니다.\n\n싸움은 안개 속에서 이어졌습니다. 아이아스가 제우스에게 안개를 걷어 달라고 기도하자 빛이 돌아왔고, 메넬라오스는 안틸로코스를 아킬레우스에게 보내 이 슬픈 소식을 전하게 했습니다. 병사들은 마침내 시신을 어깨에 메고 배 쪽으로 천천히 물러났습니다.", "id": 17}, {"title": "[일리아스 18권] 아킬레우스의 통곡과 새 방패", "quote": "그가 슬픔에 쓰러지자 바다 밑의 어머니가 그 울음을 들었다.", "text": "안틸로코스가 눈물을 흘리며 소식을 전하자, 아킬레우스는 검은 구름 같은 슬픔에 휩싸였습니다. 그는 두 손으로 재를 집어 머리에 뿌리고 먼지 속에 몸을 던져 통곡했습니다. 바다 밑에 있던 어머니 테티스가 그 소리를 듣고 달려왔습니다.\n\n그는 이제 복수만이 남았다고 말했습니다. 어머니는 헥토르가 죽으면 너도 곧 죽을 운명이라고 일러 주었으나, 아킬레우스는 친구를 지키지 못한 채 살아가는 것보다 낫다며 받아들였습니다. 그의 분노는 이제 아가멤논이 아니라 헥토르를 향했습니다.\n\n테티스는 대장장이 신 헤파이스토스를 찾아가 아들의 새 갑옷을 부탁했습니다. 헤파이스토스는 정성껏 방패를 만들었습니다. 방패에는 땅과 하늘과 바다, 혼례와 재판이 있는 도시, 전쟁 중인 도시, 밭 갈고 추수하고 춤추는 사람들의 모습이 새겨졌습니다. 인간 세상의 모든 모습이 그 안에 담겨 있었습니다.", "id": 18}, {"title": "[일리아스 19권] 화해와 단식", "quote": "그는 분노를 거두었지만, 슬픔은 거두지 못했다.", "text": "아킬레우스는 회의를 열고 아가멤논과 화해했습니다. 아가멤논은 자신의 잘못이 신이 마음을 흐리게 한 탓이라고 말하며 약속했던 선물을 모두 내놓았습니다. 브리세이스도 돌아왔습니다. 그녀는 파트로클로스의 시신 앞에서 울며 그가 늘 자신에게 얼마나 다정했는지 말했습니다.\n\n아킬레우스는 전쟁에 나서기 전에 아무것도 먹지 않겠다고 했습니다. 오디세우스는 병사들이 배를 채우고 힘을 내야 한다고 설득했지만 아킬레우스는 듣지 않았고, 아테나가 몰래 신들의 음식을 그의 가슴에 부어 주었습니다.\n\n전차에 오르는 순간 말 크산토스가 신의 힘으로 말을 하며 오늘은 주인을 무사히 데려가겠지만 죽음의 날이 가까웠다고 알려 주었습니다. 아킬레우스는 이미 알고 있다고 답하며, 그 대신 오늘 트로이 사람들이 충분히 싸움을 맛보게 하겠다고 말했습니다.", "id": 19}, {"title": "[일리아스 20권] 신들이 편을 나누다", "quote": "제우스는 신들에게 마음대로 싸움에 나서도 좋다고 허락했다.", "text": "제우스는 신들을 모아 놓고 이번에는 각자 마음대로 편을 들어 싸움에 나서도 좋다고 허락했습니다. 아킬레우스를 그냥 두면 운명을 넘어서 트로이를 무너뜨릴까 걱정했기 때문입니다. 신들은 저마다 그리스와 트로이 편으로 갈렸습니다.\n\n전장에서 아킬레우스는 트로이의 영웅 아이네이아스와 맞섰습니다. 아이네이아스는 아킬레우스의 기세에 눌려 쓰러질 뻔했으나, 포세이돈이 그를 안개로 감싸 멀리 옮겨 구해 주었습니다. 아직 그가 살아서 해야 할 일이 남아 있다는 이유였습니다.\n\n헥토르가 아킬레우스와 맞서려 하자 아폴론이 말렸습니다. 아킬레우스는 닥치는 대로 트로이 병사들을 쓰러뜨렸고, 그의 창과 칼 앞에서 아무도 버티지 못했습니다. 땅이 시체로 덮이고 말발굽이 피에 젖었습니다.", "id": 20}, {"title": "[일리아스 21권] 강의 신과 맞서다", "quote": "강물이 시체로 막히자 강의 신까지 그에게 노했다.", "text": "트로이 병사들은 스카만드로스 강으로 달아났으나, 아킬레우스가 뒤쫓아 강 속에서도 그들을 쓰러뜨렸습니다. 강은 시체로 막혀 흐르지 못하게 되었습니다. 화가 난 강의 신이 사람의 목소리로 아킬레우스를 꾸짖고 물을 일으켜 그를 덮쳤습니다.\n\n아킬레우스는 거센 물결에 휩쓸려 힘을 잃을 뻔했습니다. 그때 포세이돈과 아테나가 나타나 그를 격려했고, 헤라가 대장장이 신 헤파이스토스를 보내 강에 불을 질렀습니다. 불길에 강물이 끓자 강의 신이 항복했습니다.\n\n신들도 서로 싸웠습니다. 아테나가 전쟁의 신 아레스와 아프로디테를 쓰러뜨렸고, 포세이돈과 아폴론은 서로 겨루기를 그만두었습니다. 그 사이 트로이 사람들은 성안으로 도망쳐 들어갔고, 문 앞에서 헥토르만 홀로 밖에 남았습니다.", "id": 21}, {"title": "[일리아스 22권] 헥토르의 죽음", "quote": "세 바퀴를 돌며 달아나던 영웅은 마침내 멈추어 서서 맞섰다.", "text": "성문 앞에 홀로 선 헥토르를 향해 아버지 프리아모스와 어머니가 울며 어서 들어오라고 간청했습니다. 그러나 헥토르는 물러서지 않았습니다. 그러다 아킬레우스가 번쩍이는 갑옷을 입고 다가오는 것을 보자 갑자기 겁이 나서 성벽을 따라 달아나기 시작했습니다.\n\n두 사람은 성벽을 세 바퀴나 돌았습니다. 신들이 지켜보는 가운데 제우스가 저울을 들었고, 헥토르의 접시가 가라앉았습니다. 아테나가 헥토르의 동생 모습으로 나타나 곁에서 싸워 주겠다고 속이자, 헥토르는 멈추어 서서 아킬레우스와 맞섰습니다. 동생은 어디에도 없었고, 그는 자신이 속았다는 것을 깨달았습니다.\n\n그는 이름이라도 남기겠다며 칼을 뽑아 달려들었으나 아킬레우스의 창이 목을 꿰뚫었습니다. 죽어 가며 시신만은 부모에게 돌려 달라고 빌었지만, 아킬레우스는 거절했습니다. 그는 시신을 전차에 매달아 끌고 갔고, 성벽 위에서 부모와 아내 안드로마케가 그 광경을 보며 통곡했습니다.", "id": 22}, {"title": "[일리아스 23권] 파트로클로스의 장례", "quote": "죽은 친구를 위해 그는 큰 불을 놓고 경기를 열었다.", "text": "아킬레우스는 친구의 시신 곁에 앉아 밤새 울었습니다. 꿈에 파트로클로스의 혼이 나타나 어서 장례를 치러 자기가 저승의 문을 지나게 해 달라고 부탁했고, 자신과 아킬레우스의 뼈를 한 항아리에 함께 묻어 달라고 했습니다.\n\n이튿날 그리스 병사들은 산에서 나무를 베어 와 거대한 장작더미를 쌓았습니다. 아킬레우스는 머리카락을 잘라 친구의 몸에 올려 주고 짐승들과 포로들을 제물로 바쳤으며, 바람의 신들에게 불을 지펴 달라고 기도했습니다. 불은 밤새 타올랐습니다.\n\n장례가 끝나자 아킬레우스는 친구를 기려 운동 경기를 열었습니다. 전차 경주, 권투, 씨름, 달리기, 창던지기가 이어졌고, 그는 우승자들에게 값진 상을 나누어 주었습니다. 전쟁 중에도 이렇게 경기를 즐기는 모습이 이 이야기에 잠깐 숨 쉴 틈을 줍니다.", "id": 23}, {"title": "[일리아스 24권] 프리아모스와 아킬레우스", "quote": "아들을 죽인 사람의 손에, 늙은 아버지가 입을 맞추었다.", "text": "아킬레우스는 장례가 끝난 뒤에도 마음이 풀리지 않아, 날마다 헥토르의 시신을 전차에 매달아 파트로클로스의 무덤 둘레를 돌았습니다. 아폴론이 그 시신을 상하지 않게 지켜 주었고, 신들도 이를 불쌍히 여겼습니다. 제우스는 테티스에게 아들을 설득하라고 하고, 프리아모스 왕에게는 직접 몸값을 들고 찾아가라고 했습니다.\n\n늙은 왕은 신 헤르메스의 안내를 받아 한밤중에 홀로 그리스 진영으로 들어갔습니다. 그는 아킬레우스 앞에 무릎을 꿇고 아들을 죽인 그 손에 입을 맞추며 말했습니다. 당신의 아버지를 생각해 달라, 나는 세상에서 아들을 죽인 사람 앞에 손을 내민 아버지라고 했습니다.\n\n아킬레우스는 고향의 늙은 아버지를 떠올렸고, 두 사람은 함께 울었습니다. 그는 시신을 돌려주고 장례가 끝날 때까지 싸움을 멈추겠다고 약속했습니다. 트로이 사람들은 헥토르의 장례를 치렀고, 이야기는 그의 장례로 끝납니다. 이 책의 진짜 끝은 승리가 아니라 이 화해입니다.", "id": 24}, {"title": "[오디세이아 1권] 신들의 회의와 아테나의 방문", "quote": "아버지를 기다리는 아들에게, 여신이 낯선 손님의 모습으로 찾아왔다.", "text": "트로이 전쟁이 끝난 지 10년이 지났지만 오디세우스는 아직 고향 이타케에 돌아오지 못했습니다. 그는 요정 칼립소의 섬에 붙들려 날마다 바닷가에서 고향 쪽을 보며 울고 있었습니다. 신들의 회의에서 아테나가 그를 보내 주자고 간청했습니다.\n\n한편 이타케의 왕궁에는 귀족 청년 백여 명이 눌러앉아 있었습니다. 왕이 죽었다고 여기고 왕비 페넬로페에게 결혼을 강요하면서, 날마다 잔치를 벌여 왕의 소와 양과 포도주를 먹어 치웠습니다. 이들이 구혼자들입니다.\n\n아테나는 낯선 손님의 모습으로 오디세우스의 아들 텔레마코스를 찾아갔습니다. 스무 살 무렵의 그는 아버지 얼굴을 모른 채 자랐고, 집이 망가지는 것을 보며 괴로워하고 있었습니다. 아테나는 구혼자들을 민회에 불러 돌아가라 하고, 배를 마련해 아버지의 소식을 찾아 나서라고 용기를 주었습니다.", "id": 25}, {"title": "[오디세이아 2권] 텔레마코스의 민회", "quote": "젊은 아들이 처음으로 사람들 앞에서 목소리를 높였다.", "text": "이튿날 텔레마코스는 이타케 사람들을 광장에 불러 모았습니다. 그는 아버지가 떠난 뒤 집이 겪는 일을 사람들에게 털어놓고, 구혼자들에게 내 집에서 나가 달라고 요구했습니다. 그러나 구혼자들의 우두머리 안티노오스는 오히려 페넬로페가 약속을 속였다고 비난했습니다.\n\n페넬로페는 시아버지 라에르테스의 수의를 다 짜면 결혼하겠다고 말한 뒤, 낮에 짠 천을 밤마다 몰래 풀어 3년이나 시간을 끌었던 것입니다. 하녀 한 명이 이를 구혼자들에게 일러바쳐 계획은 들통났습니다.\n\n민회는 아무 결론 없이 끝났지만, 텔레마코스는 포기하지 않았습니다. 아테나의 도움으로 배와 선원을 마련한 그는 어머니에게 알리지 않고 밤에 몰래 출항했습니다. 유모 에우리클레이아만이 이 일을 알았고, 그녀는 어머니에게 열이틀 동안 말하지 않겠다고 맹세했습니다.", "id": 26}, {"title": "[오디세이아 3권] 필로스의 네스토르", "quote": "아들은 아버지를 알던 노인에게서 첫 소식을 들었다.", "text": "텔레마코스는 배를 타고 모래가 고운 필로스에 닿았습니다. 마침 그곳에서는 노왕 네스토르가 바닷가에서 포세이돈께 제사를 지내고 있었습니다. 네스토르는 손님이 누구인지 묻기도 전에 먼저 음식을 내어 주고 대접했습니다. 이것이 당시 사람들이 낯선 손님을 맞는 법도였습니다.\n\n네스토르는 트로이 전쟁 이후의 일을 들려주었습니다. 그리스 군이 귀향하던 중 신들의 노여움을 사 뿔뿔이 흩어졌고, 아가멤논은 고향에 돌아가자마자 아내와 그 정부에게 살해당했다고 말했습니다. 오디세우스의 소식은 그도 알지 못했습니다.\n\n네스토르는 아들 페이시스트라토스를 안내인으로 딸려 보내며 스파르타의 메넬라오스를 찾아가 보라고 일러 주었습니다. 이 여행에서 텔레마코스는 처음으로 자기 이름이 세상에서 얼마나 널리 알려져 있는지, 그리고 아버지가 얼마나 존경받는 영웅인지를 알게 됩니다.", "id": 27}, {"title": "[오디세이아 4권] 스파르타의 메넬라오스", "quote": "트로이를 불러온 여인은 이제 평온한 왕비가 되어 있었다.", "text": "텔레마코스와 페이시스트라토스는 마차를 타고 스파르타에 닿았습니다. 마침 왕궁에서는 메넬라오스가 자녀의 혼인 잔치를 열고 있었습니다. 헬레네가 궁정의 여인들과 함께 나타나 손님의 얼굴이 오디세우스를 꼭 닮았다고 말했습니다.\n\n두 사람은 트로이 전쟁에서 오디세우스가 얼마나 지혜롭고 용감했는지를 이야기했습니다. 헬레네는 그가 거지로 변장해 트로이에 잠입했던 일을, 메넬라오스는 트로이 목마 안에서 오디세우스가 병사들을 참게 해 주었던 일을 들려주었습니다.\n\n메넬라오스는 이집트 바닷가에서 바다 노인 프로테우스에게서 들은 이야기를 전했습니다. 오디세우스가 칼립소의 섬에 붙들려 있다는 것이었습니다. 한편 이타케에서는 구혼자들이 텔레마코스가 없어진 것을 알고, 그가 돌아오는 길목에 배를 숨겨 죽이려고 모의하고 있었습니다. 페넬로페는 아들의 출항 소식에 눈물로 밤을 지새웠습니다.", "id": 28}, {"title": "[오디세이아 5권] 칼립소의 섬을 떠나다", "quote": "영원한 삶을 마다하고, 그는 늙어 죽을 고향을 택했다.", "text": "신들의 회의에서 제우스는 오디세우스를 보내 주기로 결정하고 헤르메스를 칼립소에게 보냈습니다. 칼립소는 몹시 서운했지만 신들의 뜻을 어길 수 없었습니다. 그녀는 오디세우스에게 함께 살면 늙지도 죽지도 않게 해 주겠다고 했지만, 그는 아내 페넬로페가 늙어 보여도 집에 가고 싶다고 답했습니다.\n\n오디세우스는 직접 나무를 베어 뗏목을 만들었습니다. 칼립소는 옷과 먹을 것을 마련해 주고 순풍을 보내 주었습니다. 17일 동안 별을 보며 바다를 건넜습니다.\n\n그러나 그를 미워하는 바다의 신 포세이돈이 폭풍을 일으켜 뗏목을 부수었습니다. 오디세우스는 바다에 빠져 허우적댔고, 바다의 여신 레우코테아가 신비한 천을 던져 주어 그것을 가슴에 감고 헤엄쳤습니다. 이틀 밤낮을 헤엄친 끝에 그는 마침내 낯선 섬의 강어귀에 닿았고, 풀숲에 쓰러져 낙엽을 덮고 깊은 잠에 빠졌습니다.", "id": 29}, {"title": "[오디세이아 6권] 공주 나우시카아", "quote": "알몸으로 해안에 쓸려 온 나그네를 한 소녀가 모른 척하지 않았다.", "text": "아테나는 파이아케스인의 공주 나우시카아의 꿈에 나타나 빨래하러 바닷가에 가라고 일렀습니다. 이튿날 나우시카아가 하녀들과 함께 빨래를 마치고 공놀이를 하는데, 공이 물에 빠지고 소리가 나서 잠자던 오디세우스가 깨어났습니다.\n\n그는 수풀에서 나왔습니다. 소금물과 진흙에 뒤덮인 알몸의 낯선 사내를 보고 하녀들은 비명을 지르며 달아났지만, 나우시카아는 도망치지 않았습니다. 오디세우스는 정중하게 말을 걸어 도움을 청했습니다.\n\n공주는 그에게 옷과 먹을 것을 주고, 도시로 가는 길을 알려 주었습니다. 다만 사람들의 소문이 날까 봐 함께 걷지는 않았습니다. 그녀는 궁전에 들어가 왕비 아레테 앞에 먼저 무릎을 꿇으라고 일러 주었습니다. 오디세우스는 아테나 여신의 신성한 숲에서 기도를 올리고 도시로 향했습니다.", "id": 30}, {"title": "[오디세이아 7권] 알키노오스의 궁전", "quote": "왕궁의 황금빛 정원에서 나그네는 따뜻한 환대를 받았다.", "text": "오디세우스는 아테나가 안개로 감싸 준 덕분에 아무에게도 들키지 않고 도시를 지나 궁전에 닿았습니다. 궁전은 청동 벽과 황금 문, 은빛 기둥으로 빛났고, 뜰에는 사시사철 열매가 달리는 과수원이 있었습니다.\n\n그는 왕비 아레테의 무릎을 붙잡고 고향으로 돌아가게 도와 달라고 청했습니다. 왕 알키노오스는 곧 그를 일으켜 자리에 앉히고 음식을 내어 주었습니다. 아직 이름도 묻지 않았습니다. 손님을 먹이고 재운 뒤에야 이름을 묻는 것이 이 나라의 법도였습니다.\n\n잔치가 끝나고 아레테는 오디세우스의 옷이 자기 집에서 만든 것임을 알아보고 어디서 났느냐고 물었습니다. 그는 칼립소의 섬에서 7년을 보낸 일과 폭풍을 만난 일, 그리고 공주가 자신을 도와준 일을 솔직하게 말했습니다. 왕은 그를 배에 태워 고향으로 보내 주겠다고 약속했습니다.", "id": 31}, {"title": "[오디세이아 8권] 파이아케스인의 잔치", "quote": "노래 한 곡이, 숨기던 영웅의 눈물을 터뜨렸다.", "text": "왕은 손님을 위해 잔치와 경기를 열었습니다. 눈먼 가수 데모도코스가 노래를 시작했는데, 처음에는 오디세우스와 아킬레우스가 다툰 이야기를 노래했습니다. 오디세우스는 말없이 외투로 얼굴을 가리고 눈물을 흘렸지만 왕만이 그것을 알아챘습니다.\n\n젊은이들은 오디세우스를 놀리며 경기에 나오라고 했습니다. 그는 무거운 원반을 그들보다 훨씬 멀리 던져 모두를 놀라게 했습니다. 이어서 가수는 전쟁의 신 아레스와 아프로디테의 이야기를 노래해 사람들을 웃게 했습니다.\n\n그 뒤 오디세우스가 직접 부탁해 가수가 트로이 목마의 이야기를 노래했습니다. 오디세우스는 다시 눈물을 쏟았고, 왕은 이제 그만 이름을 밝히라고 청했습니다. 왜 그런 눈물을 흘리느냐, 트로이에서 혹시 친지를 잃었느냐고 물었습니다. 이제 오디세우스가 자신의 이야기를 시작할 차례였습니다.", "id": 32}, {"title": "[오디세이아 9권] 연꽃과 외눈박이 거인", "quote": "'아무도 아니'라는 이름이 그를 살렸고, 자만이 그를 망쳤다.", "text": "오디세우스는 이름을 밝히고 지난 10년의 이야기를 들려주기 시작했습니다. 트로이를 떠난 배들은 먼저 연꽃을 먹는 사람들의 땅에 닿았습니다. 그 열매를 먹은 부하들은 고향을 잊고 눌러앉으려 해서 억지로 끌고 와야 했습니다.\n\n다음에 닿은 곳은 외눈박이 거인 키클롭스들의 땅이었습니다. 거인 폴리페모스의 동굴에 갇히자 거인은 날마다 부하들을 잡아먹었습니다. 오디세우스는 자신의 이름을 '아무도 아니'라고 속이고, 거인에게 독한 포도주를 먹여 잠들게 한 뒤 불에 달군 말뚝으로 눈을 찔렀습니다. 거인이 '아무도 아니가 나를 죽인다'고 소리치자 이웃 거인들은 돌아가 버렸습니다.\n\n일행은 양의 배 밑에 매달려 동굴을 빠져나왔습니다. 그러나 배에 오른 오디세우스는 우쭐해서 자기 진짜 이름을 외쳤고, 거인은 아버지 포세이돈에게 저주를 빌었습니다. 이 한마디 자만이 앞으로 10년 고생의 씨앗이 됩니다.", "id": 33}, {"title": "[오디세이아 10권] 바람의 자루와 마녀 키르케", "quote": "고향이 눈앞에 보였는데, 열린 자루 하나가 모든 것을 되돌렸다.", "text": "다음에 닿은 곳은 바람의 신 아이올로스의 섬이었습니다. 그는 오디세우스에게 역풍을 모두 가둔 가죽 자루를 선물로 주었습니다. 아흐레 동안 순풍을 타고 가서 고향 이타케의 불빛이 보일 만큼 가까워졌을 때, 오디세우스가 지쳐 잠든 사이 부하들이 자루에 보물이 들었다고 여기고 열어 버렸습니다. 바람이 쏟아져 나와 배들은 다시 멀리 날려 갔습니다.\n\n이어서 식인 거인 라이스트리고네스의 땅에서는 배 열두 척 가운데 열한 척이 부서졌습니다. 살아남은 한 척은 마녀 키르케의 섬에 닿았습니다. 키르케는 부하들을 돼지로 바꾸어 버렸습니다.\n\n오디세우스는 헤르메스가 준 약초 덕분에 마법에 걸리지 않았고, 칼을 뽑아 키르케를 위협해 부하들을 사람으로 되돌렸습니다. 키르케는 그들을 환대했고, 일행은 그 섬에서 1년을 머물렀습니다. 마침내 부하들이 고향 생각을 일깨웠을 때, 키르케는 저승에 가서 예언자에게 길을 물어야 한다고 일러 주었습니다.", "id": 34}, {"title": "[오디세이아 11권] 저승 여행", "quote": "죽은 자들의 나라에서 그는 어머니와 옛 전우들을 만났다.", "text": "오디세우스는 키르케의 가르침대로 세상 끝 바다를 건너 죽은 자들의 땅에 닿았습니다. 구덩이를 파고 짐승의 피를 부어 죽은 혼들을 불러냈습니다. 맨 먼저 나타난 것은 키르케의 집 지붕에서 떨어져 죽은 부하 엘페노르였습니다. 그는 장례를 치러 달라고 부탁했습니다.\n\n이어 예언자 테이레시아스의 혼이 나타나 앞날을 일러 주었습니다. 태양신의 소를 건드리지 않으면 고향에 갈 수 있고, 돌아가면 구혼자들을 처단할 것이라고 했습니다. 다음에는 그를 기다리다 죽은 어머니의 혼이 나타났습니다. 오디세우스는 세 번 껴안으려 했으나 그림자처럼 빠져나갔습니다.\n\n아킬레우스의 혼은 죽은 자들의 왕이 되느니 살아서 남의 집 머슴으로 사는 편이 낫다고 말했습니다. 『일리아스』에서 짧고 빛나는 삶을 택했던 영웅의 말이라 더욱 쓸쓸하게 들립니다. 아이아스의 혼은 아직도 노여움이 풀리지 않아 말없이 돌아섰습니다.", "id": 35}, {"title": "[오디세이아 12권] 세이렌과 태양신의 소", "quote": "아름다운 노래도, 좁은 물길도, 마지막엔 굶주림이 그들을 쓰러뜨렸다.", "text": "키르케의 섬으로 돌아온 일행은 다시 항해를 떠났습니다. 키르케는 길에 닥칠 위험을 미리 가르쳐 주었습니다. 첫 번째는 세이렌이었습니다. 노래로 뱃사람을 흘려 죽이는 이들이었는데, 오디세우스는 부하들의 귀를 밀랍으로 막고, 자신은 돛대에 몸을 묶어 노래를 들었습니다. 몸부림쳤지만 부하들은 듣지 못했고, 배는 무사히 지나갔습니다.\n\n다음은 한쪽에는 머리 여섯 달린 괴물 스킬라, 다른 쪽에는 거대한 소용돌이 카리브디스가 있는 좁은 물길이었습니다. 전멸을 피하려고 스킬라 쪽으로 붙어 가다가 부하 여섯 명이 잡아먹혔습니다.\n\n마지막으로 태양신의 섬에 닿았습니다. 오디세우스는 소에 손대지 말라고 당부했으나, 그가 잠든 사이 굶주린 부하들이 소를 잡아먹었습니다. 제우스의 벼락이 배를 부수었고, 오디세우스만 혼자 살아남아 아흐레를 떠돌다 열흘째에 칼립소의 섬에 닿았습니다. 그의 긴 이야기는 여기서 끝났습니다.", "id": 36}, {"title": "[오디세이아 13권] 잠든 채 이타케에 닿다", "quote": "그리운 고향에 왔지만, 그는 자기 땅을 알아보지 못했다.", "text": "이야기를 마친 오디세우스에게 파이아케스인들은 값진 선물을 안겨 주고, 배에 태워 이타케로 보냈습니다. 그는 배 안에서 깊이 잠들었고, 선원들은 잠든 그를 해안에 내려놓은 채 돌아갔습니다. 이 일에 화가 난 포세이돈은 돌아가던 배를 돌로 만들어 버렸습니다.\n\n잠에서 깬 오디세우스는 낯선 땅이라 여기고 한탄했습니다. 20년 만의 고향이 아테나가 안개로 가린 탓에 알아볼 수 없었던 것입니다. 그때 한 소년의 모습으로 나타난 아테나가 이곳이 이타케라고 알려 주었고, 그의 꾀를 칭찬했습니다.\n\n아테나는 구혼자들을 이기려면 지금은 정체를 숨겨야 한다고 일렀습니다. 그녀는 오디세우스의 몸을 늙고 초라한 거지로 바꾸어 놓았습니다. 그리고 먼저 충직한 돼지치기 에우마이오스를 찾아가라고 말한 뒤, 텔레마코스를 데리러 스파르타로 떠났습니다.", "id": 37}, {"title": "[오디세이아 14권] 돼지치기 에우마이오스", "quote": "주인이 돌아온 줄 모르는 하인이 거지를 정성껏 대접했다.", "text": "에우마이오스는 숲속 오두막에서 돼지들을 돌보고 있었습니다. 낯선 거지가 다가오자 사나운 개들이 짖어 댔고, 그는 달려 나와 개들을 쫓은 뒤 손님을 안으로 들였습니다. 가진 것은 적었지만 좋은 돼지를 한 마리 잡아 구워 먹이고, 포도주를 따라 주었습니다.\n\n그는 거지에게 주인 오디세우스가 얼마나 훌륭한 분이었는지, 구혼자들이 얼마나 못되게 구는지 눈물로 털어놓았습니다. 오디세우스는 정체를 숨긴 채 크레타 출신이라고 지어낸 이야기를 들려주고, 그 주인이 곧 돌아올 거라고 말했습니다. 에우마이오스는 그 말을 믿지 않았습니다. 지나가던 거지들이 거짓 소식으로 상을 받으려는 일이 많았기 때문입니다.\n\n밤이 되자 추워졌습니다. 거지가 꾀를 내어 옛 이야기를 지어내자, 에우마이오스는 그에게 두꺼운 망토를 덮어 주었고, 자신은 밖에서 돼지들을 지키며 밤을 보냈습니다. 오디세우스는 이 충직함에 마음이 따뜻해졌습니다.", "id": 38}, {"title": "[오디세이아 15권] 텔레마코스의 귀국", "quote": "아들은 매복을 피해, 아버지가 있는 오두막으로 돌아왔다.", "text": "스파르타에 있던 텔레마코스에게 아테나가 꿈속에 나타나 어서 돌아가라고, 구혼자들이 길목에 매복하고 있으니 다른 길로 돌아가 먼저 돼지치기의 집으로 가라고 일렀습니다. 텔레마코스는 메넬라오스와 헬레네에게서 선물을 받고 인사를 나눈 뒤 길을 떠났습니다.\n\n필로스에서는 도망쳐 온 예언자 테오클리메노스를 배에 태웠습니다. 배는 구혼자들이 숨어 있던 해협을 피해 다른 길로 돌아 이타케에 닿았습니다. 텔레마코스는 일행을 배로 도시에 보내고 자신은 에우마이오스의 집으로 향했습니다.\n\n한편 오두막에서 에우마이오스는 거지에게 자신의 어린 시절 이야기를 들려주었습니다. 그는 원래 왕의 아들이었지만 어릴 때 유괴되어 오디세우스의 아버지 라에르테스에게 팔려 왔다고 했습니다. 이야기를 주고받는 사이 새벽이 되자, 텔레마코스가 오두막으로 다가오는 발소리가 들렸습니다.", "id": 39}, {"title": "[오디세이아 16권] 부자 상봉", "quote": "20년 만에, 아버지와 아들이 서로를 끌어안고 울었다.", "text": "텔레마코스가 오두막에 들어서자 개들은 짖지 않고 꼬리를 흔들었습니다. 에우마이오스는 아들을 안아 주며 울었고, 거지는 일어나 자리를 내주었습니다. 에우마이오스가 페넬로페에게 소식을 전하러 간 사이, 아테나가 오디세우스를 본래 모습으로 바꾸어 놓았습니다.\n\n오디세우스는 아들에게 내가 바로 네 아버지라고 말했습니다. 텔레마코스는 처음에는 믿지 못해 신이 속이는 것이라 의심했습니다. 오디세우스가 그간의 일을 설명하자 아들은 비로소 아버지를 껴안고 소리 내어 울었습니다. 두 사람의 울음은 새끼를 빼앗긴 독수리의 울음 같았다고 시인은 노래합니다.\n\n두 사람은 구혼자들을 어떻게 처리할지 의논했습니다. 오디세우스는 아들에게 일단 집으로 돌아가 구혼자들 사이에 섞여 있으라고 하고, 자신은 거지의 모습으로 뒤따라 들어가기로 했습니다. 집 안의 무기도 몰래 옮겨 두기로 했습니다.", "id": 40}, {"title": "[오디세이아 17권] 거지가 되어 왕궁으로", "quote": "20년을 기다린 늙은 개는 주인을 알아보고 눈을 감았다.", "text": "텔레마코스는 먼저 집으로 돌아가 어머니와 눈물의 재회를 했습니다. 그러나 아버지가 돌아왔다는 이야기는 하지 않았습니다. 오디세우스는 에우마이오스와 함께 거지의 모습으로 도시로 향했습니다.\n\n길에서 염소치기 멜란티오스가 거지를 업신여기며 걷어찼습니다. 오디세우스는 화를 참았습니다. 궁전 문 앞에는 늙은 개 아르고스가 쓰레기 더미 위에 누워 있었습니다. 어릴 때 오디세우스가 직접 기르던 사냥개였습니다. 개는 주인을 알아보고 꼬리를 흔들며 귀를 늘어뜨렸으나 일어날 힘이 없었고, 곧 숨을 거두었습니다.\n\n궁 안에서 오디세우스는 구혼자들에게 음식을 구걸했습니다. 안티노오스는 의자를 집어 던져 그의 어깨를 맞혔고, 다른 구혼자들 중 몇몇은 이를 나무랐습니다. 페넬로페는 이 소식을 듣고 거지를 불러 이야기를 듣고 싶어 했습니다.", "id": 41}, {"title": "[오디세이아 18권] 거지 이로스와 구혼자들", "quote": "참고 또 참던 영웅이 힘을 보여 주자, 구혼자들은 웃음을 거두었다.", "text": "궁에는 이로스라는 동네 거지가 있었는데, 자기 자리를 빼앗길까 두려워 오디세우스에게 시비를 걸었습니다. 구혼자들은 재미있어하며 두 거지를 싸우게 했습니다. 오디세우스는 일부러 힘을 아끼며 한 방에 이로스를 쓰러뜨렸습니다. 구혼자들은 웃으며 그에게 먹을 것을 주었습니다.\n\n그날 밤 페넬로페는 구혼자들 앞에 나타나 선물을 받아 냈습니다. 구혼자들은 앞다투어 값진 선물을 바쳤습니다. 이것도 오디세우스의 마음을 흔들었으나 그는 모든 것을 지켜보고 있었습니다.\n\n저녁에는 하녀 멜란토가 거지에게 욕을 퍼부었고, 구혼자 에우리마코스는 그의 머리가 번쩍인다고 놀리며 의자를 던졌습니다. 오디세우스는 말없이 견뎠습니다. 텔레마코스가 나서서 이제 그만하고 집으로 돌아가라고 말하자 구혼자들은 입을 다물었습니다. 이들은 아직 자신들의 끝이 가까운 줄 몰랐습니다.", "id": 42}, {"title": "[오디세이아 19권] 유모가 흉터를 알아보다", "quote": "발을 씻기던 늙은 손이 오래전 상처를 더듬었다.", "text": "모두 잠든 밤, 오디세우스와 텔레마코스는 집 안의 무기들을 창고로 옮겼습니다. 페넬로페는 거지를 불러 앉히고 남편의 소식을 물었습니다. 오디세우스는 크레타 출신이라고 속이며, 일찍이 오디세우스를 만난 적이 있다고 말했습니다. 그가 입고 있던 옷과 장신구를 정확히 말하자 페넬로페는 눈물을 흘렸습니다. 오디세우스는 그가 곧 돌아올 것이라고 말했지만 그녀는 믿지 못했습니다.\n\n페넬로페는 유모 에우리클레이아에게 손님의 발을 씻기라고 시켰습니다. 유모가 발을 만지다 무릎 위의 오래된 흉터를 알아보았습니다. 어린 시절 멧돼지에게 받힌 상처였습니다. 놀라 대야를 엎지르고 기뻐하려는 유모의 입을 오디세우스가 손으로 막았습니다.\n\n페넬로페는 그 일을 알지 못했는데, 아테나가 그녀의 눈길을 다른 곳으로 돌려 놓았기 때문입니다. 그녀는 다음 날 구혼자들 앞에서 활쏘기 시합을 열어 마지막 결정을 내리겠다고 거지에게 털어놓았습니다.", "id": 43}, {"title": "[오디세이아 20권] 폭풍 전의 밤", "quote": "큰일을 앞둔 밤, 그는 잠들지 못하고 하늘에 징조를 구했다.", "text": "그날 밤 오디세우스는 잠을 이루지 못했습니다. 궁의 하녀들이 구혼자들과 어울려 웃는 소리가 들렸고, 그는 화가 치밀었지만 가슴을 치며 참았습니다. 일찍이 키클롭스의 동굴에서 더한 일도 견뎠다고 스스로를 타일렀습니다.\n\n아테나가 곁에 나타나 안심하라 일렀고, 그는 잠깐 잠이 들었다가 곧 깨어났습니다. 제우스에게 징조를 보여 달라고 기도하자 맑은 하늘에서 천둥이 울렸습니다. 방앗간 여인이 이 소리를 듣고 구혼자들이 오늘 마지막 잔치를 한다고 중얼거렸습니다.\n\n날이 밝자 잔치가 다시 시작되었습니다. 구혼자 한 명이 소의 발을 집어 거지에게 던졌으나 빗나갔고, 텔레마코스가 나서 호통을 쳤습니다. 예언자 테오클리메노스는 구혼자들의 얼굴이 어둠에 싸이고 벽에 피가 뚝뚝 떨어지는 것을 보았다며 어서 도망치라고 했지만, 구혼자들은 비웃으며 그를 쫓아냈습니다.", "id": 44}, {"title": "[오디세이아 21권] 활 시합", "quote": "아무도 당기지 못한 활을, 거지가 가볍게 당겼다.", "text": "페넬로페는 창고에서 오디세우스의 큰 활과 화살을 꺼내 왔습니다. 그리고 선언했습니다. 이 활에 시위를 걸고, 줄지어 세운 도끼 열두 자루의 구멍을 한 번에 꿰뚫어 쏘는 사람과 결혼하겠다고 했습니다.\n\n텔레마코스가 먼저 시도했으나 아직 힘이 모자랐습니다. 구혼자들이 차례로 활을 잡았으나 아무도 시위조차 걸지 못했습니다. 그때 거지가 자기도 한번 해 보겠다고 말했습니다. 구혼자들이 비웃고 반대했지만 페넬로페가 허락했습니다.\n\n오디세우스는 활을 이리저리 살핀 뒤, 음악가가 거문고 줄을 거는 것처럼 쉽게 시위를 걸었습니다. 활줄을 당기자 제비가 우는 듯한 소리가 났습니다. 그는 화살을 쏘아 열두 자루 도끼의 구멍을 한꺼번에 꿰뚫었습니다. 그리고 텔레마코스에게 눈짓을 했고, 아들은 칼을 차고 아버지 곁에 섰습니다.", "id": 45}, {"title": "[오디세이아 22권] 구혼자들의 최후", "quote": "누더기를 벗어던진 왕이 마침내 자기 집의 주인으로 돌아왔다.", "text": "오디세우스는 누더기를 벗어던지고 문턱에 올라서서 외쳤습니다. 이제 이 시합은 끝났고 이제 다른 과녁을 맞히겠다고 했습니다. 그는 먼저 술잔을 들던 안티노오스의 목을 화살로 꿰뚫었습니다. 구혼자들은 그제야 거지의 정체를 알고 겁에 질렸습니다.\n\n에우리마코스가 돈과 재물로 사죄하겠다고 빌었지만 오디세우스는 단호히 거절했습니다. 구혼자들은 무기를 찾았으나 창고는 이미 잠겨 있었습니다. 텔레마코스와 에우마이오스, 소치기 필로이티오스가 오디세우스 곁에서 싸웠고, 아테나도 곁에서 도왔습니다.\n\n싸움이 끝나자 구혼자들은 모두 바닥에 쓰러져 있었습니다. 오디세우스는 구혼자들을 편든 염소치기 멜란티오스와 하녀들도 벌했습니다. 유모가 기뻐 소리 지르려 하자, 죽은 사람 앞에서 큰소리로 기뻐하는 것은 옳지 않다고 말렸습니다. 이어 궁 안을 씻고 향을 피워 깨끗이 했습니다.", "id": 46}, {"title": "[오디세이아 23권] 침대의 비밀", "quote": "오직 두 사람만 아는 비밀이, 20년의 의심을 풀었다.", "text": "유모는 달려가 페넬로페에게 남편이 돌아왔다고 알렸습니다. 페넬로페는 쉽게 믿지 못했습니다. 이미 여러 번 속은 데다, 혹시 신이 변장한 것은 아닐까 의심했습니다. 그녀는 내려와 남편을 말없이 바라보았습니다. 텔레마코스가 어머니의 매정함을 탓했지만, 오디세우스는 웃으며 이해한다고 말했습니다.\n\n오디세우스가 목욕하고 옷을 갈아입고 나오자 페넬로페는 마지막 시험을 했습니다. 유모에게 침대를 방 밖으로 옮겨 드리라고 말한 것입니다. 오디세우스는 화를 냈습니다. 그 침대는 뿌리박은 올리브 나무 그루터기를 기둥 삼아 자기 손으로 만든 것이라 옮길 수 없다는 것이었습니다.\n\n그 비밀은 부부만 알았습니다. 페넬로페는 그제야 울며 달려가 남편을 껴안았습니다. 아테나가 밤을 길게 늘여 두 사람이 오랜만에 이야기할 시간을 주었습니다. 오디세우스는 앞으로 닥칠 먼 여행에 대한 예언도 말해 주었고, 부부는 함께 잠자리에 들었습니다.", "id": 47}, {"title": "[오디세이아 24권] 라에르테스와 평화", "quote": "복수의 끝에서 신이 칼을 거두게 했다.", "text": "저승에서는 죽은 구혼자들의 혼이 헤르메스의 인도로 내려가 아킬레우스와 아가멤논의 혼을 만났습니다. 아가멤논은 아킬레우스의 영광스러운 장례를 부러워하면서, 오디세우스에게는 페넬로페 같은 지혜로운 아내가 있어 행복하다고 말했습니다.\n\n한편 오디세우스는 시골 농장에서 쓸쓸히 살던 늙은 아버지 라에르테스를 찾아갔습니다. 아버지는 아들이 돌아왔다는 말을 믿지 못하다가, 아들이 무릎의 흉터와 어린 시절 아버지가 심어 준 나무들의 이름을 말하자 비로소 울며 아들을 껴안았습니다.\n\n죽은 구혼자들의 가족이 복수를 하겠다며 무기를 들고 몰려왔습니다. 라에르테스도 오랜만에 창을 들고 나서 싸웠으나, 제우스가 벼락을 내려 막았고 아테나가 양쪽을 화해시켰습니다. 이렇게 오디세우스의 20년에 걸친 긴 여행이 끝나고, 이타케에는 평화가 돌아왔습니다.", "id": 48}];
let cur=0,synth=window.speechSynthesis,speaking=false;
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
if(m==='book')render(cur);else{synth.cancel();speaking=false;}}
function render(i){if(i<0||i>=SCENES.length)return;cur=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 48';
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookPageIndicator').textContent=s.id+' / 48 쪽';
document.getElementById('sceneSlider').value=s.id;synth.cancel();speaking=false;window.scrollTo(0,0);}
function prevScene(){if(cur>0)render(cur-1);}
function nextScene(){if(cur<SCENES.length-1)render(cur+1);}
function onSliderChange(v){render(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700"></div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p>';
d.firstChild.textContent='제 '+s.id+' 부';d.querySelector('.gallery-title').textContent=s.title;
d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';d.querySelector('.gallery-text').textContent=s.text;c.appendChild(d);});}
function toggleTtsCurrent(){if(speaking){synth.cancel();speaking=false;}else{
const u=new SpeechSynthesisUtterance(SCENES[cur].title+'. '+SCENES[cur].text);
u.lang='ko-KR';u.rate=.9;u.onend=()=>{speaking=false;};synth.speak(u);speaking=true;}}
let ac=null,playing=false,mt=null;
function toggleMusic(){if(playing){playing=false;clearTimeout(mt);document.getElementById('btnMusic').classList.remove('active');}
else{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
playing=true;document.getElementById('btnMusic').classList.add('active');
const n=[523.25,587.33,659.25,783.99,880,1046.5];let k=0;
(function play(){if(!playing)return;const o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(n[k++%n.length],ac.currentTime);
g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.06,ac.currentTime+.05);
g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.8);o.connect(g);g.connect(ac.destination);
o.start();o.stop(ac.currentTime+1.9);mt=setTimeout(play,900);})();}}
window.onload=()=>{render(0);buildGallery();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScene();if(e.key==='ArrowLeft')prevScene();});
