<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전쟁과 평화 - 레프 톨스토이 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#3d5a3a;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div><span>📖</span> <span class="brand-title">레프 톨스토이 · 전쟁과 평화</span></div>
<div class="nav-actions">
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>
<div class="quote-label">이 장면의 한마디</div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn" onclick="toggleTtsCurrent()">🔊 읽어주기</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="23" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 이야기책은 원문이 아니라, 줄거리를 쉬운 말로 풀어 엮은 것입니다. 세부 내용은 보태거나 줄인 곳이 있어 원작과 다를 수 있으니, 자세한 것은 책으로 확인해 주세요.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"title": "1805년, 페테르부르크의 야회", "quote": "전쟁의 소문 속에서도 귀족들의 사교는 계속되었다.", "text": "1805년 7월, 러시아 상류 사회의 안나 파블로브나 저택에서 야회가 열립니다. 사람들은 프랑스 황제 나폴레옹이 유럽을 휩쓸고 있다는 소식에 걱정하면서도 화려한 옷차림으로 이야기꽃을 피웁니다.\n\n이 자리에 부유한 베주호프 백작의 사생아 피예르가 서투른 모습으로 나타납니다. 그는 외국에서 공부하고 돌아온 뚱뚱하고 순진한 청년입니다. 그리고 총명하지만 사교계의 공허함에 지쳐 있는 안드레이 볼콘스키 공작도 있습니다. 두 청년은 이 이야기의 두 중심 인물이 됩니다.", "id": 1}, {"title": "로스토프 집안의 명명일", "quote": "젊은이들은 사랑에 눈뜨고 있었다.", "text": "모스크바의 로스토프 백작 집에서는 잔치가 열립니다. 어린 나타샤는 열세 살, 활기차고 사랑스러운 소녀입니다. 오빠 니콜라이는 군대에 가려 하고, 사촌 소냐는 니콜라이를 조용히 사랑합니다.\n\n이 집안은 너그럽고 정이 많지만 돈 관리에는 어설퍼 재산이 조금씩 기울고 있습니다. 나타샤는 어린 보리스와 장난스럽게 입맞춤을 약속하기도 합니다. 이 따뜻한 가정은 앞으로 전쟁의 파도 속에서 큰 시련을 맞게 됩니다.", "id": 2}, {"title": "피예르의 유산", "quote": "하루아침에 가장 부유한 사람이 되었다.", "text": "베주호프 백작이 세상을 떠나면서 피예르가 막대한 재산을 물려받습니다. 갑자기 귀족 사회의 주목을 받게 된 그를 쿠라긴 공작이 노리기 시작합니다. 쿠라긴은 아름답지만 속이 빈 딸 엘렌을 피예르와 결혼시키려 합니다.\n\n순진한 피예르는 사람들의 압력과 분위기에 휩쓸려 결국 엘렌과 결혼하게 됩니다. 그러나 곧 그녀가 사랑이 없고 허영만 가득한 사람임을 알게 되고, 마음 깊이 후회합니다.", "id": 3}, {"title": "볼콘스키 집안과 안드레이의 출정", "quote": "아내를 두고 그는 전쟁터로 떠났다.", "text": "안드레이는 임신한 아내 리자를 아버지의 집에 두고 전쟁터로 떠납니다. 아버지 볼콘스키 노공작은 엄격하고 고집스러운 사람이고, 누이 마리야 공작 아가씨는 신앙이 깊고 다정합니다.\n\n안드레이는 시시한 사교 생활에서 벗어나 영웅이 되고 싶다는 꿈을 안고 떠납니다. 그는 나폴레옹 같은 위대한 인물이 되어 보고 싶어 합니다. 하지만 전쟁은 그가 상상하던 것과 아주 다른 모습으로 다가옵니다.", "id": 4}, {"title": "아우스터리츠의 하늘", "quote": "그는 처음으로 높고 끝없는 하늘을 보았다.", "text": "1805년 12월, 아우스터리츠 전투에서 러시아와 오스트리아 연합군은 나폴레옹에게 크게 패합니다. 안드레이는 깃발을 들고 병사들을 이끌고 돌진하다가 쓰러집니다.\n\n그는 전장에 누워 끝없이 높은 하늘을 올려다봅니다. 그 하늘 앞에서 영웅이 되려던 욕망도, 나폴레옹의 명예도 모두 작고 허무하게 느껴집니다. 그는 포로가 될 처지에서 나폴레옹과 마주치기도 하지만 이제 그 영웅이 하찮게 보일 뿐입니다.", "id": 5}, {"title": "니콜라이와 돌로호프", "quote": "도박은 한 청년의 마음에 큰 상처를 남겼다.", "text": "니콜라이 로스토프는 전쟁에서 용기를 보이고 연대로 돌아옵니다. 그러나 모스크바에서 도박꾼 돌로호프에게 큰돈을 잃습니다. 많은 빚은 가족을 곤경에 빠뜨립니다.\n\n이때 소냐는 니콜라이에게 마음을 주지만, 나타샤는 아직 어린아이처럼 맑은 노래를 부르며 집안에 위로가 됩니다. 로스토프가의 재산은 점점 기울고 있었습니다.", "id": 6}, {"title": "안드레이의 귀향과 아내의 죽음", "quote": "그는 늦게야 가정의 소중함을 알았다.", "text": "죽은 줄 알았던 안드레이가 집에 돌아오던 밤, 아내 리자는 아들을 낳고 숨을 거둡니다. 안드레이는 아내의 죽은 얼굴 앞에서 깊은 죄책감을 느낍니다. 그는 아내에게 잘해 주지 못했음을 후회합니다.\n\n그는 사교계에서 물러나 시골 영지에서 아들을 키우며 조용히 지내기로 합니다. 인생에 대한 의욕을 잃은 그는 세상과 담을 쌓습니다.", "id": 7}, {"title": "피예르의 결투와 프리메이슨", "quote": "그는 삶의 의미를 찾기 위해 헤맸다.", "text": "아내 엘렌과 돌로호프가 가까이 지낸다는 소문이 돌자 피예르는 분노하여 돌로호프와 결투를 벌입니다. 총을 처음 쥐어 본 그가 오히려 상대에게 상처를 입힙니다. 그는 엘렌과 헤어집니다.\n\n마음이 무너진 피예르는 우연히 프리메이슨이라는 비밀 단체의 한 사람을 만나 그 모임에 들어갑니다. 그는 선하게 살고 농민들을 도우려 하지만 사람을 잘 믿는 성격 탓에 번번이 이용당하고 맙니다.", "id": 8}, {"title": "오트라드노예의 달밤", "quote": "나도 저렇게 살 수 있을까.", "text": "안드레이는 볼일이 있어 로스토프 백작의 영지 오트라드노예에서 하룻밤을 묵습니다. 그날 밤, 위층 창가에서 소녀 나타샤가 달밤의 아름다움에 들떠 소냐와 이야기하는 소리를 듣습니다.\n\n그는 마음이 따뜻해지며 다시 삶에 대한 희망을 느낍니다. 오래전에 넘어졌던 자리에서 안드레이는 조용히 일어서기 시작합니다. 나타샤의 맑은 마음이 그의 닫힌 가슴에 작은 문을 열어 줍니다.", "id": 9}, {"title": "나타샤의 첫 무도회", "quote": "그녀는 춤을 추며 모든 사람의 시선을 끌었다.", "text": "나타샤는 처음으로 페테르부르크 무도회에 나갑니다. 그녀는 긴장하여 가만히 앉아 있었는데, 안드레이가 다가와 춤을 청합니다. 그녀는 활짝 웃으며 춤을 추고 모든 사람의 눈길을 받습니다.\n\n안드레이는 나타샤의 순수함에 마음을 빼앗기고, 곧 그녀에게 청혼을 합니다. 그러나 노공작은 아들의 결혼을 못마땅해해 일 년을 기다리라는 조건을 겁니다. 안드레이는 외국으로 떠나고, 나타샤는 홀로 기다립니다.", "id": 10}, {"title": "아나톨의 유혹", "quote": "기다림의 시간이 그녀의 마음을 흔들었다.", "text": "안드레이가 떠난 뒤 나타샤는 외로움을 느낍니다. 이때 엘렌의 오빠 아나톨 쿠라긴이 그녀에게 접근해 열렬히 구애합니다. 나타샤는 순진한 마음에 그의 말에 빠져 함께 도망치려는 약속까지 합니다.\n\n다행히 도망 계획은 소냐의 도움으로 막아집니다. 그러나 이 소문은 곧 퍼지고, 안드레이는 나타샤와의 약혼을 취소합니다. 나타샤는 수치심과 슬픔에 병이 들어 눕습니다.", "id": 11}, {"title": "1812년의 혜성", "quote": "위기의 시대에 사람들은 마음을 고쳐먹었다.", "text": "혜성이 하늘을 가로지르던 1812년, 피예르는 병든 나타샤를 위로하고 그녀가 겪은 고통에 연민을 느낍니다. 그는 자신이 그녀를 사랑하고 있음을 처음으로 깨닫지만 아직 말하지 못합니다.\n\n그해 나폴레옹은 60만 대군을 이끌고 러시아로 쳐들어옵니다. 평화롭던 러시아 땅에 전쟁의 그림자가 드리우고, 사람들은 저마다 운명의 갈림길 앞에 섭니다.", "id": 12}, {"title": "스몰렌스크 퇴각과 볼콘스키 노공작의 죽음", "quote": "그는 마지막 순간까지 딸을 찾았다.", "text": "프랑스군이 점점 러시아 깊숙이 들어옵니다. 볼콘스키 노공작은 영지를 떠나기를 거부하다가 쓰러져 숨을 거둡니다. 그는 죽기 전에 딸 마리야에게 거칠게 대했던 것을 후회합니다.\n\n마리야는 프랑스군이 쳐들어오는 가운데 영지를 빠져나갈 수 없는 처지가 됩니다. 이때 니콜라이 로스토프가 우연히 나타나 그녀를 도와 줍니다. 두 사람의 마음에 서로를 향한 작은 불씨가 생깁니다.", "id": 13}, {"title": "쿠투조프와 보로디노", "quote": "그는 전투를 이기려 하지 않고 군대를 지키려 했다.", "text": "러시아군 총사령관 쿠투조프는 늙고 느리지만 현명한 사람입니다. 그는 전쟁을 치밀한 계획이 아니라 흐르는 시간과 병사의 사기가 결정짓는다고 생각합니다. 그는 모스크바 앞 보로디노에서 프랑스군과 맞섭니다.\n\n피예르는 군복도 입지 않은 채 전투 현장을 구경하러 갑니다. 그는 병사들이 묵묵히 죽어 가는 모습을 보며 전쟁의 참혹함과 병사들의 위대한 용기에 큰 충격을 받습니다.", "id": 14}, {"title": "보로디노 전투", "quote": "승자도 패자도 알 수 없는 하루가 지나갔다.", "text": "보로디노 전투는 하루 만에 수만 명이 죽는 끔찍한 싸움입니다. 안드레이는 포탄 파편에 맞아 중상을 입고 야전 병원으로 옮겨집니다. 그곳에서 그는 다리를 자른 채 신음하는 아나톨 쿠라긴을 보게 되고, 지난날의 원한이 연민으로 바뀝니다.\n\n러시아군은 크게 피해를 입었지만 물러서지 않았습니다. 쿠투조프는 결국 모스크바를 내주고 후퇴하기로 결정합니다. 도시는 곧 빈 껍질이 됩니다.", "id": 15}, {"title": "버려진 모스크바", "quote": "도시는 불에 타올랐다.", "text": "모스크바 사람들은 짐을 싸서 도시를 떠납니다. 로스토프 가족도 피난 수레에 부상병들을 태워 줍니다. 나타샤는 부상병들을 실으라고 고집하여 가재도구 대신 사람들을 태웁니다. 그 부상병 중에는 중상을 입은 안드레이도 있었으나 나타샤는 그 사실을 한참 뒤에야 압니다.\n\n나폴레옹의 군대가 모스크바에 입성하자 도시 곳곳에서 불길이 치솟습니다. 사람들은 이것이 누구의 소행인지 알 수 없었지만 모스크바는 큰불에 휩싸입니다.", "id": 16}, {"title": "피예르, 포로가 되다", "quote": "그는 작은 둥근 사람 플라톤을 만났다.", "text": "피예르는 나폴레옹을 암살하겠다는 엉뚱한 생각을 품고 불타는 모스크바에 남아 있다가 프랑스군에게 붙잡힙니다. 그는 죽을 뻔했지만 가까스로 목숨을 건지고 다른 포로들과 함께 끌려갑니다.\n\n포로 행렬 속에서 그는 소박한 농민 병사 플라톤 카라타예프를 만납니다. 플라톤은 모든 것을 그저 받아들이며 사람들을 따뜻하게 대합니다. 피예르는 그에게서 삶의 단순한 지혜를 배우게 됩니다.", "id": 17}, {"title": "안드레이의 마지막", "quote": "그는 사랑 속에서 죽음을 맞이했다.", "text": "나타샤는 안드레이가 같은 피난 행렬 속에 있다는 것을 알게 되고, 그의 곁을 지킵니다. 안드레이는 마리야와 나타샤의 간호를 받으며 마음속의 모든 원망을 내려놓고 그녀를 용서합니다.\n\n그는 죽음이 다가올수록 이 세상의 일들이 점점 멀어지는 것을 느끼고, 사랑이야말로 가장 큰 가르침임을 깨닫습니다. 그는 평화로운 마음으로 눈을 감고 나타샤는 깊은 슬픔에 빠집니다.", "id": 18}, {"title": "프랑스군의 퇴각", "quote": "겨울이 가장 무서운 적이 되었다.", "text": "모스크바에서 오래 머물 수 없었던 나폴레옹의 군대는 후퇴를 시작합니다. 러시아의 혹독한 겨울이 찾아오고, 굶주리고 얼어붙은 병사들이 길가에 쓰러집니다. 쿠투조프는 무리하게 추격하지 않고 지켜보기만 합니다.\n\n피예르를 비롯한 포로들도 이 행렬 속에서 걷습니다. 지쳐 쓰러진 플라톤은 총에 맞아 숨지고, 피예르는 이 모든 고통을 겪은 끝에 이전과 다른 사람이 됩니다.", "id": 19}, {"title": "페탸의 죽음", "quote": "막내는 전쟁터에서 돌아오지 못했다.", "text": "로스토프 가의 막내 페탸는 어린 나이에 전쟁에 나가 용감하게 싸웁니다. 그는 프랑스 포로를 구하려는 작전에서 도움을 주려다 총에 맞아 숨을 거둡니다. 이 소식을 들은 어머니 로스토바 백작 부인은 큰 충격에 빠집니다.\n\n피예르는 이 무렵 러시아군에 의해 구출됩니다. 그는 고생으로 야위고 지쳤지만 눈빛이 맑아졌습니다. 그는 나타샤에게서 안드레이의 마지막 소식을 듣고 함께 울며 서로를 위로합니다.", "id": 20}, {"title": "전쟁이 끝난 뒤", "quote": "상처 입은 사람들이 서로의 곁에서 일어섰다.", "text": "나폴레옹은 러시아에서 크게 패하여 물러가고 전쟁은 러시아의 승리로 끝납니다. 그러나 모스크바는 폐허가 되고, 살아남은 이들은 새로 삶을 일으켜야 했습니다. 로스토프 집안도 재산을 잃고 어려움을 겪습니다.\n\n마리야는 니콜라이를 만나 가까워지고, 집안의 빚을 갚고 어려움을 돕기로 합니다. 피예르와 나타샤도 서로에게 점점 마음이 열립니다. 이들 모두는 전쟁이 남긴 상처 속에서도 사랑이 삶의 길임을 알게 됩니다.", "id": 21}, {"title": "두 쌍의 결혼", "quote": "이제 그들은 평범한 행복을 얻었다.", "text": "니콜라이 로스토프와 마리야가 결혼하고, 피예르와 나타샤도 결혼합니다. 피예르는 이제 순진했던 청년이 아니라 깊이 있는 어른이 되었습니다. 나타샤는 예전의 장난기 가득한 소녀에서 아이를 키우며 가정을 지키는 어머니가 됩니다.\n\n두 가정은 서로 가깝게 지내며 이야기를 나눕니다. 이들은 큰 역사의 소용돌이를 지나 비로소 일상의 평화 속에 자리를 잡습니다.", "id": 22}, {"title": "이 이야기가 우리에게 남긴 것", "quote": "역사는 영웅 한 사람이 아니라 수많은 평범한 사람들이 만든다.", "text": "『전쟁과 평화』는 나폴레옹 전쟁이라는 거대한 역사를 배경으로, 수많은 인물들의 사랑과 죽음, 희망과 방황을 그린 이야기입니다. 톨스토이는 위대한 영웅이 역사를 이끈다는 생각에 의문을 던지고, 이름 없는 병사와 보통 사람들의 삶이 역사의 흐름을 만든다고 말합니다.\n\n피예르는 고난 끝에 삶의 단순한 진실을 배우고, 안드레이는 사랑과 용서를 알고 떠납니다. 전쟁이 끝나도 사람은 일상 속에서 사랑하고 살아갑니다. 그것이 이 방대한 이야기가 우리에게 건네는 평화의 의미입니다.", "id": 23}];
let cur=0,synth=window.speechSynthesis,speaking=false;
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
if(m==='book')render(cur);else{synth.cancel();speaking=false;}}
function render(i){if(i<0||i>=SCENES.length)return;cur=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 23';
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookPageIndicator').textContent=s.id+' / 23 쪽';
document.getElementById('sceneSlider').value=s.id;synth.cancel();speaking=false;window.scrollTo(0,0);}
function prevScene(){if(cur>0)render(cur-1);}
function nextScene(){if(cur<SCENES.length-1)render(cur+1);}
function onSliderChange(v){render(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700"></div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p>';
d.firstChild.textContent='제 '+s.id+' 부';d.querySelector('.gallery-title').textContent=s.title;
d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';d.querySelector('.gallery-text').textContent=s.text;c.appendChild(d);});}
function toggleTtsCurrent(){if(speaking){synth.cancel();speaking=false;}else{
const u=new SpeechSynthesisUtterance(SCENES[cur].title+'. '+SCENES[cur].text);
u.lang='ko-KR';u.rate=.9;u.onend=()=>{speaking=false;};synth.speak(u);speaking=true;}}
let ac=null,playing=false,mt=null;
function toggleMusic(){if(playing){playing=false;clearTimeout(mt);document.getElementById('btnMusic').classList.remove('active');}
else{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
playing=true;document.getElementById('btnMusic').classList.add('active');
const n=[523.25,587.33,659.25,783.99,880,1046.5];let k=0;
(function play(){if(!playing)return;const o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(n[k++%n.length],ac.currentTime);
g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.06,ac.currentTime+.05);
g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.8);o.connect(g);g.connect(ac.destination);
o.start();o.stop(ac.currentTime+1.9);mt=setTimeout(play,900);})();}}
window.onload=()=>{render(0);buildGallery();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScene();if(e.key==='ArrowLeft')prevScene();});
</script></body></html>
