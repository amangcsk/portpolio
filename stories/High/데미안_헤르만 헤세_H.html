<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데미안 - 헤르만 헤세 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#3b3a5c;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div><span>📖</span> <span class="brand-title">헤르만 헤세 · 데미안</span></div>
<div class="nav-actions">
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>
<div class="quote-label">이 장면의 한마디</div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn" onclick="toggleTtsCurrent()">🔊 읽어주기</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="21" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 책은 헤르만 헤세의 「데미안」 원문이 아니라, 줄거리를 쉬운 말로 풀어 길게 엮은 이야기책입니다. 세부 장면은 보태거나 줄인 곳이 있어 원작과 다를 수 있으니, 자세한 내용은 꼭 원작 책으로 확인해 주세요.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"title": "나 자신의 이야기를 쓰는 까닭", "quote": "사람은 누구나 단 한 번뿐인 소중한 시도이다.", "text": "이 이야기는 에밀 싱클레어라는 사람이 어른이 되어 자기 어린 시절부터 젊은 날까지를 돌아보며 쓴 기록입니다. 그는 이야기를 시작하기에 앞서 마음을 밝힙니다. 자기는 남들이 만들어 준 길이 아니라, 자기 안에서 저절로 솟아 나오는 것을 살아 보려고 했을 뿐인데, 그것이 어째서 그토록 어려웠는지 적어 보고 싶다는 것입니다.\n\n싱클레어는 사람이란 저마다 자연이 단 한 번 해 본 시도, 다시는 되풀이되지 않는 소중한 존재라고 믿습니다. 그러면서도 대부분의 사람들은 그 사실을 모른 채 남들과 똑같이 살다 갑니다. 그는 자기 이야기가 대단해서 쓰는 것이 아니라, 자기 자신에게로 가는 길을 걸어 보았기에 글로 남긴다고 말합니다. 그 길은 누구에게나 쉽지 않고, 때로는 무섭기까지 합니다. 이제 그 길의 첫 장면, 열 살 무렵 어린 싱클레어의 이야기가 시작됩니다.", "id": 1}, {"title": "밝은 세계의 아이", "quote": "집 안에는 맑은 기도와 깨끗한 옷, 그리고 다정한 목소리가 있었다.", "text": "열 살 무렵의 싱클레어는 작은 도시의 라틴어 학교에 다니는 소년이었습니다. 그의 집은 넉넉하고 경건한 집안이었습니다. 아버지와 어머니, 그리고 두 누이가 함께 살았고, 아침저녁으로 기도 소리가 울렸으며, 옷은 늘 깨끗하고 방은 단정했습니다. 어른들은 부드럽게 말했고, 잘못을 하면 용서를 구하는 법을 가르쳤습니다.\n\n싱클레어는 이 집안의 세계를 '밝은 세계'라고 불렀습니다. 그곳은 안전하고 따뜻했으며, 어머니의 품처럼 안심이 되는 곳이었습니다. 소년은 자신이 이 세계에 속해 있다는 것을 당연하게 여겼고, 그 속에서 착한 아이로 살아가기를 바랐습니다. 하지만 어딘가 마음 한구석에서는 이 맑고 깨끗한 세계만으로는 채워지지 않는 무언가가 조용히 꿈틀거리고 있었습니다.", "id": 2}, {"title": "어두운 세계의 속삭임", "quote": "집에서 한 발짝만 나가면 전혀 다른 세계가 숨 쉬고 있었다.", "text": "그런데 그 밝은 세계와 아주 가까운 곳에 또 하나의 세계가 있었습니다. 부엌에서 하녀들이 속닥이는 귀신 이야기와 끔찍한 소문, 술에 취한 장인들, 시장에서 벌어지는 다툼, 경찰에게 끌려가는 사람들, 도둑과 살인 이야기가 그곳에 있었습니다. 싱클레어는 그것을 '어두운 세계'라고 느꼈습니다.\n\n이상하게도 소년은 그 무서운 세계에 끌렸습니다. 그곳은 위험했지만 살아 움직이는 듯 생생했습니다. 그는 밝은 세계 안에 앉아 있으면서도 문 너머 어두운 세계의 소리에 귀를 기울였습니다. 두 세계가 맞닿아 있는 얇은 경계에 서서, 어느 쪽에도 온전히 속하지 못한 채 소년은 자라고 있었습니다. 그리고 어느 날 우연한 거짓말 하나가 그 경계를 넘어서게 합니다.", "id": 3}, {"title": "사과를 훔쳤다는 거짓말", "quote": "자랑하고 싶은 마음이 나를 어두운 곳으로 이끌었다.", "text": "어느 날 싱클레어는 동네 아이들과 어울려 놀다가, 열세 살쯤 된 거친 소년 프란츠 크로머를 알게 되었습니다. 크로머는 평범한 학교 학생이 아니라 하층 집안의 아이였고, 힘이 세고 말투가 거칠었습니다. 아이들은 그의 눈치를 보며 따랐습니다.\n\n싱클레어는 그 앞에서 잘 보이고 싶은 마음에 그만 거짓말을 해 버렸습니다. 이웃의 과수원에서 친구와 함께 사과를 훔친 적이 있다고 큰소리를 쳤던 것입니다. 사실은 그런 일이 없었습니다. 크로머는 그 말을 귀담아듣더니, 마침 그 과수원 주인이 도둑을 잡아 오는 사람에게 상금을 주겠다고 했다며 고개를 갸웃거렸습니다. 놀란 싱클레어가 거짓말이었다고 털어놓았지만 크로머는 믿지 않았습니다. 이 순간 싱클레어는 자기 입에서 나온 한마디가 얼마나 큰 일이 되었는지 깨닫기 시작했습니다.", "id": 4}, {"title": "크로머의 올가미", "quote": "내 거짓말이 나를 크로머의 종으로 만들었다.", "text": "크로머는 입을 다물어 주는 대가로 돈을 내놓으라고 했습니다. 처음에는 이 마르크였습니다. 싱클레어에게는 그만한 돈이 없었습니다. 그는 몰래 저금통을 털어 보았지만, 크로머는 이 정도로는 어림없다며 더 큰 돈을 요구했습니다. 소년은 부모님께 말할 수도 없었습니다. 말하는 순간 모든 것이 들통나고, 집안의 밝은 세계에 더러운 얼룩을 묻히게 될 것 같았기 때문입니다.\n\n크로머는 휘파람으로 싱클레어를 불러내곤 했습니다. 그 소리가 들리면 싱클레어는 심장이 철렁 내려앉았습니다. 크로머는 점점 더 모질어져서 심부름을 시키고 놀림거리로 삼았으며, 나중에는 싱클레어의 누이까지 데려오라고 윽박질렀습니다. 어두운 세계가 이제 소년의 목덜미를 단단히 붙잡은 것입니다.", "id": 5}, {"title": "병든 마음과 거짓된 평화", "quote": "집은 여전히 밝았지만 나는 더 이상 그곳 사람이 아니었다.", "text": "싱클레어는 밥을 먹을 수도, 잠을 잘 수도 없었습니다. 어머니가 걱정스러운 눈으로 쳐다보면 소년은 시선을 피했습니다. 아버지의 다정한 말도 날카로운 가시처럼 들렸습니다. 같은 집 안에 있어도 자기 혼자만 다른 세계에 속해 있는 사람이 된 것 같았습니다.\n\n마음의 병은 몸의 병으로 이어졌습니다. 그는 몸이 쇠약해져 끝내 앓아눕고 말았습니다. 고백하고 싶었지만 입이 떨어지지 않았습니다. 죄책감과 두려움은 하루하루 소년을 더 깊은 어둠으로 끌고 갔습니다. 누군가 이 구렁텅이에서 자기를 건져 주기를 바라면서도, 그 누군가가 있을 것이라고는 믿지 못했습니다. 그때 학교에 한 소년이 전학을 왔습니다.", "id": 6}, {"title": "카인의 표적", "quote": "카인의 이마에 새겨진 표적은 부끄러움의 표시가 아닐지도 모른다.", "text": "전학생의 이름은 막스 데미안이었습니다. 그는 싱클레어보다 두 살쯤 위였고, 얼굴이 이상할 만큼 침착하고 어른스러웠습니다. 부유한 과부의 아들이라는 소문이 돌았고, 아이들은 낯설어하며 거리를 두었지만 데미안은 누구의 눈치도 보지 않았습니다.\n\n학교 수업에서 카인과 아벨의 이야기를 배운 뒤, 데미안이 싱클레어에게 말을 걸어 왔습니다. 카인이 동생을 죽였다는 이야기를 다르게 읽을 수도 있다는 것이었습니다. 카인의 이마에 새겨진 표적은 낙인이 아니라, 다른 사람들이 두려워할 만큼 용기와 개성을 가진 사람이라는 표시일지도 모른다는 것입니다. 사람들은 자기와 다른 사람을 두려워해서 그를 나쁜 사람으로 만들었을지도 모른다고 했습니다. 싱클레어는 그 말을 터무니없다고 느꼈지만, 마음속에는 이상하게도 그 말이 오래도록 남았습니다.", "id": 7}, {"title": "비 오는 날의 광장", "quote": "너는 누군가를 무서워하고 있지, 그렇지 않니?", "text": "며칠 뒤 비 오는 날, 광장에서 데미안이 다시 싱클레어에게 다가왔습니다. 그는 싱클레어가 누군가를 몹시 두려워하고 있다는 것을 알아챘다고 했습니다. 싱클레어는 놀랐지만, 한편으로는 마음을 들킨 것 같아 불쾌하기도 했습니다. 그래서 퉁명스럽게 대꾸하고는 서둘러 자리를 떴습니다.\n\n데미안은 더 캐묻지 않고 조용히 지켜보기만 했습니다. 그 눈빛은 비웃음이나 동정이 아니라, 모든 것을 이해하는 사람의 침착한 눈빛이었습니다. 싱클레어는 자기 비밀을 눈치챈 사람이 이 세상에 있다는 사실이 두려우면서도 이상하게 위로가 되었습니다. 그는 크로머의 이름을 조금이나마 입 밖에 꺼내 보았고, 데미안은 아무 걱정도 하지 않아도 된다는 듯 고개를 끄덕였습니다.", "id": 8}, {"title": "크로머에게서 풀려나다", "quote": "데미안은 무엇을 했는지 끝내 말해 주지 않았다.", "text": "그 뒤로 이상한 일이 벌어졌습니다. 크로머가 싱클레어를 찾아오지 않았습니다. 휘파람 소리도 더는 들리지 않았고, 길에서 마주쳐도 크로머는 얼굴이 하얗게 질려 슬그머니 피했습니다. 데미안이 크로머에게 무슨 말을 했는지는 아무도 알 수 없었습니다. 싱클레어가 물어보아도 데미안은 대답하지 않았습니다.\n\n짐을 벗은 싱클레어는 결국 부모님께 모든 것을 털어놓았고, 어머니는 눈물로 아들을 안아 주었습니다. 소년은 어린 시절의 따뜻함으로 돌아갔습니다. 그러나 이전과 같지는 않았습니다. 이미 어두운 세계를 보아 버렸고, 순진하던 마음을 잃었기에 밝은 세계에 온전히 속할 수 없다는 것을 깨달았습니다. 마음 한구석에는 자기를 구해 준 이상한 친구에 대한 고마움과 알 수 없는 두려움이 함께 남았습니다.", "id": 9}, {"title": "견진성사 수업의 두 도둑", "quote": "끝까지 자기 뜻을 지킨 쪽이 더 기개 있어 보이지 않니?", "text": "싱클레어가 견진성사 수업을 받을 때, 데미안도 한참 어린 아이들 틈에 섞여 같은 수업에 들어왔습니다. 견진성사는 교회에서 정식 신자로 인정받기 위해 받는 교육입니다. 수업에서 목사님은 성경 이야기를 가르쳤고, 데미안은 그 이야기를 다른 시각으로 들려주곤 했습니다.\n\n데미안은 예수와 함께 십자가에 매달린 두 도둑 이야기를 꺼냈습니다. 한 도둑은 뉘우치고 예수를 따랐지만, 다른 도둑은 끝까지 뉘우치지 않았다는 이야기입니다. 데미안은 뉘우친 쪽이 겁이 많아서 그랬을 수도 있으며, 끝까지 자기 길을 고집한 쪽에 오히려 기개가 있다고 말했습니다. 싱클레어는 놀라면서도 마음이 두근거렸습니다. 이 무렵 데미안은 싱클레어의 집 현관 위에 새겨진 오래된 새 문장에도 관심을 보이며 그림으로 그려 보기도 했습니다.", "id": 10}, {"title": "떠나는 길, 기숙학교", "quote": "데미안과 헤어진 싱클레어는 낯선 도시에서 외로움을 만났다.", "text": "견진성사를 마친 뒤 싱클레어는 부모님의 뜻에 따라 먼 도시의 기숙학교로 떠나게 되었습니다. 데미안과는 자연스럽게 멀어졌고, 소년은 처음으로 가족과 친구를 멀리 두고 혼자 서야 했습니다.\n\n기숙학교의 생활은 낯설고 외로웠습니다. 기숙사 방은 차갑고 아이들은 서로 데면데면했습니다. 싱클레어는 누구에게도 마음을 열지 못했고, 데미안이 가르쳐 준 말들이 문득문득 떠올랐지만 곁에 물어볼 사람은 없었습니다. 그러다 학교에서 가장 나이 많은 알폰스 벡이라는 선배를 알게 되었습니다. 벡은 규칙을 우습게 여기며 술집을 드나들었고, 외로운 싱클레어에게는 그가 어른스럽고 멋있어 보였습니다.", "id": 11}, {"title": "술집의 영웅", "quote": "큰소리치는 웃음 속에서 나는 더 쓸쓸해졌다.", "text": "싱클레어는 벡을 따라 술집에 드나들며 어른 흉내를 냈습니다. 술을 마시고 큰소리로 떠들며 세상을 비웃는 척했지만, 속은 오히려 텅 비어 갔습니다. 학교 공부는 엉망이 되었고, 선생님들은 싱클레어를 눈여겨보며 점점 실망했습니다.\n\n결국 학교는 싱클레어의 아버지를 불러 퇴학까지 거론했습니다. 아버지가 찾아와 굳은 얼굴로 서 있는 모습을 본 싱클레어는 부끄러움과 반항심이 뒤엉켜 마음이 아팠습니다. 크로머의 올가미에서 벗어났던 소년이, 이번에는 스스로 만든 어둠 속에 갇혀 버린 것입니다. 그는 자기가 왜 이렇게 되었는지, 앞으로 어디로 가야 하는지 알 수 없었습니다. 그러던 어느 날 공원에서 한 여인을 보게 됩니다.", "id": 12}, {"title": "베아트리체를 만나다", "quote": "나는 이름도 모르는 그녀를 베아트리체라고 불렀다.", "text": "어느 봄날, 싱클레어는 공원을 산책하다가 날씬하고 맑은 얼굴의 한 젊은 여인을 보았습니다. 그녀는 소년처럼 단정하고 조용한 분위기를 가지고 있었습니다. 싱클레어는 말 한마디 건네 보지 못했지만, 그날 이후 그녀를 마음 깊이 우러러보게 되었습니다. 그는 마음속으로 그녀에게 베아트리체라는 이름을 붙였습니다. 옛 시인 단테가 평생 그리워했던 여인의 이름이었습니다.\n\n신기하게도 그 순간부터 싱클레어의 생활이 달라졌습니다. 술집 출입을 끊었고, 단정한 옷을 입었으며, 방을 정리하고 책을 읽기 시작했습니다. 누군가를 향한 순수한 동경이 그를 다시 밝은 쪽으로 이끌었던 것입니다. 한편으로 그것은 예전에 알던 밝은 세계로의 복귀가 아니라, 자기 안에서 스스로 만들어 낸 새로운 빛이었습니다. 그는 베아트리체의 얼굴을 그림으로 그려 보고 싶어졌습니다.", "id": 13}, {"title": "초상화, 그리고 새", "quote": "태어나려는 자는 하나의 세계를 깨뜨려야 한다.", "text": "싱클레어는 베아트리체의 얼굴을 그리려고 몇 번이나 붓을 들었지만 마음대로 되지 않았습니다. 고쳐 그릴수록 얼굴은 점점 이상하게 변해 갔습니다. 소녀 같기도 하고 소년 같기도 한 얼굴이 되었고, 어딘가 데미안을 닮은 듯하다가, 또 어딘가 자기 자신을 닮은 듯하기도 했습니다. 싱클레어는 그림을 오래 들여다보며 마음속에서 어떤 울림을 느꼈습니다.\n\n그러다 어느 날 꿈에서 본 듯한 새를 그리게 되었습니다. 날카로운 눈의 매 같은 새가 둥근 지구 같은 알을 깨고 나오는 모습이었습니다. 어린 시절 집 현관 위에서 보던 새 문장이 떠올랐습니다. 싱클레어는 그림을 데미안에게 보냈습니다. 며칠 뒤 책상 위에 쪽지가 놓여 있었습니다. 새는 알에서 나오려고 싸운다, 알은 세계다, 태어나려는 자는 하나의 세계를 깨뜨려야 한다, 새는 신에게로 날아가는데 그 신의 이름은 아브락사스다, 라는 내용이었습니다.", "id": 14}, {"title": "오르간 소리와 피스토리우스", "quote": "신은 선한 것만이 아니라 악한 것까지 품고 있었다.", "text": "싱클레어는 겨울 저녁, 어느 교회에서 흘러나오는 오르간 소리에 이끌려 걸음을 멈췄습니다. 연주가 끝날 때까지 서서 듣다가, 연주자가 나오자 말을 걸게 되었습니다. 연주자는 피스토리우스였습니다. 그는 신학을 공부했지만 교회의 가르침에 만족하지 못하고, 혼자 고대의 종교와 철학을 파고드는 사람이었습니다.\n\n피스토리우스는 싱클레어에게 아브락사스에 대해 가르쳐 주었습니다. 아브락사스는 선과 악, 밝음과 어둠을 모두 품은 신이라는 것이었습니다. 싱클레어가 어릴 적 느꼈던 두 세계가 하나의 신 안에 함께 있다는 뜻이었습니다. 피스토리우스는 벽난로 앞에 앉아 불을 가만히 바라보게 하며, 그 불길 속에서 자기 마음속의 소리를 들어 보라고 했습니다. 싱클레어는 이 새로운 스승과 함께하는 시간이 길어질수록 자기 안의 목소리가 조금씩 또렷해지는 것을 느꼈습니다.", "id": 15}, {"title": "크나우어의 고백", "quote": "그는 영혼의 답을 구했지만, 나는 해답을 줄 수 없었다.", "text": "같은 학교의 학생 크나우어는 영적인 수련에 열심인 소년이었습니다. 어느 저녁 그는 싱클레어를 찾아와 고민을 털어놓았습니다. 영적인 삶을 살려면 욕망을 억눌러야 한다고 믿지만, 마음속의 생각들 때문에 괴롭다는 것이었습니다. 싱클레어는 자신이 배운 대로, 억누르지 말고 있는 그대로의 자기를 받아들이라고 조언했습니다. 그러자 크나우어는 크게 화를 내며 싱클레어를 돼지라고 부르고 돌아섰습니다.\n\n그날 밤 싱클레어는 마음이 편치 않아 한밤중에 거리를 거닐다가, 골목길에서 크나우어와 마주쳤습니다. 크나우어는 그 자리에서 스스로 목숨을 끊으려던 참이었다고 고백했습니다. 싱클레어는 그를 말렸지만, 그에게 길을 보여 주지는 못했습니다. 그 일은 싱클레어에게 자기도 아직 누군가의 길잡이가 될 만큼 자라지 못했다는 쓰라린 깨달음을 주었습니다.", "id": 16}, {"title": "스승과의 이별", "quote": "나는 이미 오래된 이야기에 만족할 수 없었다.", "text": "졸업이 가까워지자, 싱클레어는 피스토리우스에게서 조금씩 마음이 멀어지는 것을 느꼈습니다. 피스토리우스의 이야기는 처음에는 신비롭고 깊이가 있었지만, 이제는 오래된 책 속의 이야기처럼 들렸습니다. 그것은 지금 싱클레어가 살아가는 삶에서 우러나온 이야기가 아니라, 지난 시대의 지혜를 되풀이하는 말에 불과했던 것입니다.\n\n어느 날 싱클레어는 용기를 내어 그 생각을 솔직하게 말했고, 스승에게 골동품만 좋아한다고 지적했습니다. 피스토리우스는 그 말을 변명하지 않고 깊이 받아들였으며, 크게 상심했습니다. 그는 자신이 아브락사스를 세상에 가져올 사람이 아니라는 것을 쓸쓸하게 인정했습니다. 싱클레어는 길잡이를 잃은 듯한 허전함을 느꼈지만, 스승을 떠나는 것이 자기 길을 가는 첫걸음임을 알고 있었습니다. 방학이 끝나면 대학에 가서 철학을 공부하기로 정해졌습니다.", "id": 17}, {"title": "꿈속의 여인", "quote": "그 얼굴은 어머니 같기도, 연인 같기도 했다.", "text": "그 즈음 싱클레어는 같은 꿈을 되풀이해서 꾸었습니다. 집 현관 위의 새 문장 아래에서 데미안을 닮은 한 여인이 자기를 안아 주는 꿈이었습니다. 그녀는 어머니 같기도 하고 연인 같기도 했으며, 신비롭고 크고 따뜻했습니다. 꿈에서 깨면 설렘과 함께 죄책감이 밀려왔습니다.\n\n싱클레어는 그 얼굴을 그림으로 그렸고, 몇 번을 고쳐 그린 끝에 이번에는 그림 속 여인에게서 자기 자신의 모습이 보였습니다. 방학이 되자 그는 옛 데미안의 집을 찾아가 보았지만 이미 다른 사람이 살고 있었습니다. 그곳에서 집주인이 보여 준 사진첩에서, 싱클레어는 꿈속에서 본 바로 그 여인의 얼굴을 알아보았습니다. 그녀는 데미안의 어머니였습니다. 싱클레어는 그 순간 이 모든 일이 우연이 아니라는 느낌에 사로잡혔습니다.", "id": 18}, {"title": "대학 도시에서의 재회", "quote": "나는 데미안의 목소리를 알아들었다.", "text": "대학에 진학한 싱클레어는 철학 강의에 크게 실망했습니다. 책 속의 논리는 그의 마음속 질문에 답을 주지 못했고, 학생들은 자기만의 길을 찾는 대신 유행하는 생각들을 따라가기에 바빴습니다. 싱클레어는 홀로 쓸쓸하게 도시를 거닐었습니다.\n\n어느 저녁 학생들이 모이는 술집 거리를 지나다가, 그는 어디선가 낯익은 목소리를 들었습니다. 바로 데미안이었습니다. 오랜 세월이 흘렀는데도 데미안은 싱클레어가 올 것을 알고 있었다는 듯 조용히 맞아 주었습니다. 데미안은 지금 유럽 사회가 무리 짓는 본능과 두려움에 빠져 썩어 가고 있다고 말했습니다. 사람들이 자기 생각 없이 무리에 휩쓸리면 결국 큰 폭풍이 올 것이라고 했습니다. 그리고 싱클레어를 자기 집으로 초대했습니다.", "id": 19}, {"title": "에바 부인과 표지를 가진 사람들", "quote": "사랑은 구걸하는 것이 아니라 스스로 확신하는 것이다.", "text": "다음 날 싱클레어는 데미안의 집을 찾아갔고, 데미안의 어머니 에바 부인을 만났습니다. 에바 부인은 사진첩에서 보았던 얼굴이면서, 꿈속에서 본 얼굴이기도 했습니다. 그녀는 싱클레어를 단번에 알아보고 환하게 맞이하며, 자기를 에바라고 부르라고 했습니다. 싱클레어는 마음이 설레면서도 편안했습니다. 마치 오래전부터 이 집에 돌아오고 싶었던 사람처럼 느꼈습니다.\n\n그 집에는 데미안과 비슷한 생각을 품은 사람들이 모여 있었습니다. 그들은 스스로를 카인의 표지를 가진 사람들이라고 여기며 조용히 마음을 나누었습니다. 에바 부인은 싱클레어에게 사랑이란 간청하는 것이 아니라 스스로 확신하는 것이라고 일러 주었습니다. 어느 폭풍 부는 날 싱클레어는 구름 속에서 거대한 새의 모습을 보았고, 돌아와 보니 데미안도 불길한 꿈을 꾸었다고 했습니다. 두 사람은 낡은 세계가 곧 무너질 것이라는 예감을 나누었습니다.", "id": 20}, {"title": "전쟁, 그리고 마지막 만남", "quote": "나는 거울 속에서 그를 보았다.", "text": "마침내 전쟁이 일어났습니다. 거리의 사람들은 환호하며 거리로 쏟아져 나왔지만, 싱클레어는 그것이 데미안이 예언했던 폭풍임을 알았습니다. 데미안은 장교로 먼저 전선에 나갔고, 싱클레어도 보병으로 징집되어 에바 부인과 작별해야 했습니다.\n\n어느 밤 전투 중에 싱클레어는 폭탄 파편에 맞아 쓰러졌습니다. 정신을 차려 보니 야전 병원 바닥이었고, 바로 곁에 데미안이 누워 있었습니다. 데미안은 이제 자기는 떠나야 한다고 말했습니다. 앞으로 싱클레어가 어려울 때 자기를 부르면, 말을 타고 기차를 타고 달려올 수는 없지만, 마음속으로 귀를 기울이면 자기가 싱클레어 안에 있음을 알게 될 것이라고 했습니다. 그러고는 에바 부인의 입맞춤을 전하며 싱클레어에게 입을 맞추었습니다. 싱클레어가 잠에서 깨어났을 때 데미안의 자리에는 낯선 사람이 누워 있었습니다. 훗날 거울을 들여다본 싱클레어는 자신의 얼굴에서 데미안의 모습을 보았습니다. 이제 그는 밖에서 길을 안내해 줄 누군가가 아니라, 자기 안에서 자기를 이끄는 존재와 하나가 된 것입니다. 이렇게 싱클레어의 긴 여정은 조용히 끝을 맺습니다.", "id": 21}];
let cur=0,synth=window.speechSynthesis,speaking=false;
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
if(m==='book')render(cur);else{synth.cancel();speaking=false;}}
function render(i){if(i<0||i>=SCENES.length)return;cur=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 21';
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookPageIndicator').textContent=s.id+' / 21 쪽';
document.getElementById('sceneSlider').value=s.id;synth.cancel();speaking=false;window.scrollTo(0,0);}
function prevScene(){if(cur>0)render(cur-1);}
function nextScene(){if(cur<SCENES.length-1)render(cur+1);}
function onSliderChange(v){render(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700"></div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p>';
d.firstChild.textContent='제 '+s.id+' 부';d.querySelector('.gallery-title').textContent=s.title;
d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';d.querySelector('.gallery-text').textContent=s.text;c.appendChild(d);});}
function toggleTtsCurrent(){if(speaking){synth.cancel();speaking=false;}else{
const u=new SpeechSynthesisUtterance(SCENES[cur].title+'. '+SCENES[cur].text);
u.lang='ko-KR';u.rate=.9;u.onend=()=>{speaking=false;};synth.speak(u);speaking=true;}}
let ac=null,playing=false,mt=null;
function toggleMusic(){if(playing){playing=false;clearTimeout(mt);document.getElementById('btnMusic').classList.remove('active');}
else{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
playing=true;document.getElementById('btnMusic').classList.add('active');
const n=[523.25,587.33,659.25,783.99,880,1046.5];let k=0;
(function play(){if(!playing)return;const o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(n[k++%n.length],ac.currentTime);
g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.06,ac.currentTime+.05);
g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.8);o.connect(g);g.connect(ac.destination);
o.start();o.stop(ac.currentTime+1.9);mt=setTimeout(play,900);})();}}
window.onload=()=>{render(0);buildGallery();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScene();if(e.key==='ArrowLeft')prevScene();});
</script></body></html>
