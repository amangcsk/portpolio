<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>젊은 베르테르의 슬픔 - 클래식 수채화 그림책</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FAF6EE;
      --bg-paper: #FFFDF9;
      --primary-color: #1e3a8a; /* 테마에 맞게 조절 가능 */
      --accent-color: #c28b38;
      --text-main: #2c2523;
      --border-warm: #E8DFC8;
      --shadow-book: 0 20px 45px -10px rgba(74, 52, 28, 0.18);
      --font-story: 'Nanum Myeongjo', 'Gowun Batang', serif;
      --font-body: 'Gowun Batang', 'Pretendard', serif;
      --font-sans: 'Pretendard', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(255, 253, 249, 0.96);
      border-bottom: 1px solid var(--border-warm);
      position: sticky; top: 0; z-index: 100;
      padding: 0.75rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-title { font-family: var(--font-story); font-size: 1.25rem; font-weight: 800; }
    .nav-actions { display: flex; align-items: center; gap: 0.6rem; }
    .btn {
      font-family: var(--font-sans); font-size: 0.85rem; padding: 0.45rem 0.85rem;
      border-radius: 8px; border: 1px solid var(--border-warm); background: #fff; cursor: pointer;
    }
    .btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem 3rem; max-width: 1300px; margin: 0 auto; width: 100%; }
    
    /* Book Mode */
    .book-container { width: 100%; max-width: 1100px; margin: 0 auto; }
    .book-spread {
      background: var(--bg-paper); border-radius: 14px; box-shadow: var(--shadow-book);
      border: 1px solid var(--border-warm); display: grid; grid-template-columns: 1fr 1fr; min-height: 640px; overflow: hidden; position: relative;
    }
    .page-left { padding: 2.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAF7F0; border-right: 1px solid rgba(210,195,175,0.4); }
    .art-frame { width: 100%; max-width: 440px; height: 520px; background: #fff; border-radius: 8px; padding: 10px; border: 1px solid #ebdcc5; display: flex; align-items: center; justify-content: center; cursor: zoom-in; position: relative; }
    .art-frame img { width: 100%; height: 100%; object-fit: contain; border-radius: 4px; }
    .page-right { padding: 3rem 2.8rem; display: flex; flex-direction: column; justify-content: space-between; background: #FFFDF9; }
    .scene-heading { font-family: var(--font-story); font-size: 1.75rem; font-weight: 800; margin-bottom: 1.4rem; }
    .quote-box { background: #FFF1F2; border-left: 3.5px solid #be123c; padding: 0.85rem 1.1rem; border-radius: 0 8px 8px 0; margin-bottom: 1.5rem; }
    .quote-text { font-family: var(--font-story); font-size: 1.02rem; font-weight: 700; font-style: italic; color: #881337; }
    .story-paragraph { font-size: 1.08rem; line-height: 1.9; color: #334155; text-align: justify; word-break: keep-all; flex: 1; }
    
    /* Controls */
    .controls-panel { margin-top: 1.6rem; display: flex; align-items: center; gap: 1.2rem; background: rgba(255, 253, 249, 0.95); border: 1px solid var(--border-warm); padding: 0.75rem 1.4rem; border-radius: 999px; }
    .nav-arrow { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border-warm); background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .slider-container { display: flex; align-items: center; gap: 0.8rem; min-width: 280px; }
    .slider-track { flex: 1; height: 6px; background: #e2e8f0; border-radius: 4px; -webkit-appearance: none; cursor: pointer; }
    
    /* Gallery Mode */
    .gallery-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 3.5rem; margin: 1rem auto 0; }
    .gallery-card { background: var(--bg-paper); border-radius: 16px; border: 1px solid var(--border-warm); overflow: hidden; display: flex; flex-direction: column; }
    .gallery-art { width: 100%; height: 580px; background: #FAF7F0; padding: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
    .gallery-art img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .gallery-content { padding: 2.2rem 2.5rem; }
    
    /* Lightbox */
    .lightbox { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.94); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 2rem; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .lightbox.active { opacity: 1; pointer-events: auto; }
    .lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 24px; right: 28px; color: #fff; font-size: 2.2rem; cursor: pointer; }

    .scene-meta { display:flex; gap:0.8rem; align-items:baseline; margin-bottom:0.8rem; font-family: var(--font-sans); color:#8a7a64; font-size:0.85rem; letter-spacing:0.08em; }
    .scene-number { font-weight:600; color: var(--accent-color); }
    .page-footer { display:flex; justify-content:space-between; align-items:center; margin-top:1.4rem; font-family: var(--font-sans); font-size:0.9rem; color:#8a7a64; }
    .gallery-num { font-family: var(--font-sans); font-size:0.85rem; color: var(--accent-color); font-weight:600; letter-spacing:0.08em; }
    .gallery-title { font-family: var(--font-story); font-size:1.5rem; font-weight:800; margin:0.5rem 0 1rem; }
    .gallery-quote { background:#FFF1F2; border-left:3.5px solid #be123c; padding:0.8rem 1rem; border-radius:0 8px 8px 0; margin-bottom:1.2rem; font-family: var(--font-story); font-style:italic; font-weight:700; color:#881337; }
    .story-paragraph { font-size:1.02rem; line-height:1.85; }
    .gallery-text { font-size:1.08rem; line-height:1.9; color:#334155; word-break:keep-all; }
    .btn.playing, .btn.active { }
    #btnMusic.playing { background: var(--accent-color); color:#fff; border-color: var(--accent-color); }
    @media (max-width: 800px) { .book-spread { grid-template-columns: 1fr; } .art-frame { height: 420px; } .slider-container { min-width: 140px; } header { flex-direction: column; gap: 0.6rem; } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">📖</span>
      <span class="brand-title">젊은 베르테르의 슬픔</span>
    </div>
    <div class="nav-actions">
      <button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
      <button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 연속 갤러리</button>
      <button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 BGM</button>
    </div>
  </header>

  <main>
    <!-- Book Mode View -->
    <div class="book-container" id="bookView">
      <div class="book-spread">
        <div class="page-left">
          <div class="art-frame" onclick="openLightboxCurrent()">
            <img id="bookImg" src="" alt="삽화">
          </div>
        </div>
        <div class="page-right">
          <div>
            <div class="scene-meta">
              <span class="scene-number" id="bookSceneNum">SCENE 01 / 26</span>
              <span class="scene-sub" id="bookSub">Subtitle</span>
            </div>
            <h1 class="scene-heading" id="bookTitle">제목</h1>
            <div class="quote-box">
              <p class="quote-text" id="bookQuote">"명대사"</p>
            </div>
            <p class="story-paragraph" id="bookText">본문 내용...</p>
          </div>
          <div class="page-footer">
            <span class="page-indicator" id="bookPageIndicator">1 / 26 페이지</span>
            <button class="btn" id="btnTts" onclick="toggleTtsCurrent()">🔊 동화 읽어주기</button>
          </div>
        </div>
      </div>
      <div style="display:flex; justify-content:center;">
        <div class="controls-panel">
          <button class="nav-arrow" onclick="prevScene()">❮</button>
          <div class="slider-container">
            <input type="range" class="slider-track" id="sceneSlider" min="1" max="26" value="1" oninput="onSliderChange(this.value)">
          </div>
          <button class="nav-arrow" onclick="nextScene()">❯</button>
        </div>
      </div>
    </div>

    <!-- Gallery Mode View -->
    <div class="gallery-container" id="galleryView" style="display: none;"></div>
  </main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="확대">
  </div>

  <script>
    // 26컷 데이터 및 Base64 WebP 이미지 매핑 자동 삽입 영역
    const SCENES = [{"id": 1, "sub": "5월, 발하임", "title": "봄의 마을에 닿다", "quote": "이곳에서라면 내 마음도 쉬어 갈 수 있겠구나.", "text": "젊은 베르테르는 도시의 번잡함과 오래 얽힌 인간관계를 뒤로하고 작은 마을 발하임에 닿았습니다. 마차가 언덕을 넘어서자 5월의 과수원에는 꽃잎이 눈처럼 흩날리고 있었습니다. 멀리 교회의 종소리가 초록 언덕 너머로 느리게 번져 왔습니다. 그는 마차에서 내려 한참을 말없이 서서 이 고요한 풍경을 눈에 담았습니다. 이곳의 공기는 도시의 것보다 훨씬 맑고 따뜻하게 느껴졌습니다. 그는 곧 친구 빌헬름에게 편지를 써서, 이 마을이 마음에 쏙 든다고 알렸습니다. 어린 시절의 기억처럼 투명한 봄이 상처 입기 쉬운 청년의 가슴을 조용히 감싸 주었습니다. 그는 아직 이 아름다운 봄이 자신의 운명을 얼마나 크게 바꾸어 놓을지 알지 못했습니다."}, {"id": 2, "sub": "오후의 샘터", "title": "샘가의 여인들", "quote": "소박한 사람들의 하루 속에 참된 아름다움이 있다.", "text": "베르테르는 마을 어귀 보리수 그늘 아래의 샘터를 가장 사랑하게 되었습니다. 오후가 되면 물동이를 이고 온 여인들이 샘가에 모여 인사를 나누고 소식을 주고받았습니다. 그는 그 모습에서 오래전 옛 시인들이 노래한 평화로운 세계를 떠올렸습니다. 화첩을 펼쳐 바람에 흔들리는 나뭇잎과 샘물의 반짝임을 서툰 손으로 그려 보기도 했습니다. 지나가는 사람들은 낯선 청년에게 웃으며 목례를 건넸습니다. 꾸밈없는 풍경 속에서 그는 자신이 얼마나 오래 지쳐 있었는지 새삼 깨달았습니다. 샘물 소리에 귀를 기울이던 그는 오랜만에 숨을 깊이 들이쉬었습니다. 그렇게 그의 마음은 서서히 마을의 속도에 맞추어 풀려 갔습니다."}, {"id": 3, "sub": "운명의 첫 만남", "title": "빵을 나누는 소녀", "quote": "그 순간, 세상의 모든 소리가 멀어졌다.", "text": "무도회에 함께 가기로 한 날, 베르테르는 마차를 타고 로테의 집 문 앞에 섰습니다. 문이 열리자 어린 동생들이 우르르 몰려나와 그를 둘러싸고 소란스럽게 인사를 했습니다. 그 한가운데에 흰 드레스에 분홍 리본을 단 로테가 서 있었습니다. 그녀는 배고파 보채는 동생들에게 한 조각씩 빵을 잘라 나누어 주고 있었습니다. 아이들을 바라보는 다정한 눈빛과 능숙하고 부드러운 손길에 그는 숨을 멈추었습니다. 어머니를 일찍 여읜 집안을 맏딸로서 꾸려 가는 의젓함까지 그의 마음을 사로잡았습니다. 그는 그 짧은 한순간에 이미 돌이킬 수 없이 사랑에 빠졌음을 알았습니다. 그날 이후 그의 마음은 그녀가 있는 곳을 향해서만 기울어 갔습니다."}, {"id": 4, "sub": "여름 무도회", "title": "무도회의 밤", "quote": "이 춤이 끝나지 않았으면.", "text": "무도회장은 수백 개의 촛불로 따뜻하게 일렁이고 있었습니다. 베르테르는 용기를 내어 로테에게 춤을 청했고, 그녀는 웃으며 손을 내밀었습니다. 두 사람은 음악에 맞추어 가볍게 원을 그리며 돌았습니다. 그녀의 웃음소리는 음악보다 더 크게 그의 귓가에 울렸습니다. 그때 창밖 먼 하늘에서 소리 없이 여름 번개가 번쩍였습니다. 사람들은 천둥을 두려워했지만 두 사람은 오히려 그 불빛이 아름답다고 느꼈습니다. 춤이 끝나갈 무렵 베르테르는 이 밤이 영원히 이어지기를 마음속으로 간절히 빌었습니다. 그 밤의 기억은 훗날 그가 가장 자주 되돌아가는 행복한 장면이 되었습니다."}, {"id": 5, "sub": "비 갠 뒤", "title": "창가에 선 두 사람", "quote": "말하지 않아도 같은 풍경을 보고 있었다.", "text": "소나기가 한바탕 지나간 뒤, 두 사람은 말없이 나란히 창가에 섰습니다. 젖은 대지에서는 흙냄새가 짙게 올라오고 하늘은 맑게 씻겨 있었습니다. 처마 끝에서는 물방울이 하나둘 떨어지며 작은 소리를 냈습니다. 로테는 창밖을 내다보며 자신이 아끼는 시인의 이름을 조용히 불렀습니다. 그 한마디에 베르테르는 가슴이 벅차올라 한동안 아무 말도 하지 못했습니다. 같은 시를 사랑하고 같은 풍경에 눈시울을 붉히는 사람을 만났다는 사실이 믿기지 않았습니다. 두 사람 사이에는 말보다 깊은 이해가 소리 없이 내려앉았습니다. 그 순간 창밖 하늘에는 엷은 무지개가 걸렸습니다."}, {"id": 6, "sub": "마을의 친구들", "title": "아이들과 보내는 오후", "quote": "아이들의 눈 속에는 세상이 처음 보는 빛으로 가득하다.", "text": "베르테르는 어느새 마을 아이들 사이에서 가장 인기 있는 어른이 되어 있었습니다. 그는 로테의 어린 동생들에게 옛이야기를 들려주고 풀잎으로 피리를 만들어 주었습니다. 아이들은 그의 무릎에 매달려 이야기를 더 해 달라고 졸랐습니다. 그는 아이들이 아무 꾸밈없이 웃고 울고 화내는 모습에서 가장 순수한 인간의 얼굴을 보았습니다. 어른들의 계산과 체면에 지쳐 있던 그에게 아이들의 세계는 쉼터와도 같았습니다. 한 아이가 다쳐서 울면 그는 서둘러 달려가 안아 주며 달랬습니다. 그런 그를 바라보는 로테의 눈에도 따뜻한 미소가 번졌습니다. 해가 기울어 아이들이 하나둘 집으로 돌아갈 때까지 그의 웃음은 그치지 않았습니다."}, {"id": 7, "sub": "행복한 날들", "title": "꽃다발을 들고", "quote": "오늘도 그녀의 집으로 가는 길이 가장 아름답다.", "text": "그는 날마다 들판에서 들꽃을 한 아름 꺾어 로테의 집으로 걸어갔습니다. 노을이 밀밭을 황금빛으로 물들이면 그의 발걸음은 점점 더 빨라졌습니다. 길가의 이름 모를 풀들도 그날은 유난히 반짝이는 것처럼 보였습니다. 그녀를 만나고 돌아오는 길에도 마음은 여전히 그 집 문 앞에 머물렀습니다. 그는 밤마다 책상에 앉아 오늘 있었던 사소한 일들을 하나도 빠짐없이 편지에 적었습니다. 로테가 건넨 한마디, 스치듯 마주친 눈빛이 그에게는 모두 보물이었습니다. 그에게 세상은 갑자기 새로 칠한 그림처럼 환하게 보였습니다. 생애 가장 빛나는 여름이 그렇게 조용히 지나가고 있었습니다."}, {"id": 8, "sub": "한낮의 정원", "title": "호두나무 아래의 낭독", "quote": "아이들의 웃음 속에서 시를 읽는 시간이 제일 행복했다.", "text": "호두나무 그늘 아래에 돗자리를 깔고 베르테르는 이야기책을 펼쳤습니다. 로테는 뜨개질감을 무릎에 올려 두고 조용히 귀를 기울였습니다. 아이들은 그의 곁에 모여 앉아 눈을 반짝이며 다음 장면을 기다렸습니다. 나뭇잎 사이로 쏟아지는 햇살이 로테의 머리칼 위에서 가만히 춤추었습니다. 바람이 불 때마다 호두 열매가 풀밭 위로 톡 하고 떨어졌습니다. 그는 낭독하는 중간중간 고개를 들어 그녀를 훔쳐보았다가 얼른 시선을 거두곤 했습니다. 이 평화로운 오후가 영원히 계속되기를 바랐지만, 해는 어김없이 기울고 있었습니다. 그는 그 장면을 마음 깊은 곳에 오래 새겨 두려고 애썼습니다."}, {"id": 9, "sub": "약혼자의 귀환", "title": "알베르트가 돌아오다", "quote": "훌륭한 사람이다. 그래서 더 괴롭다.", "text": "어느 날 오후, 마을 어귀로 말을 탄 신사가 돌아왔습니다. 그는 로테의 약혼자 알베르트로, 먼 도시에서 일을 마치고 막 돌아온 길이었습니다. 알베르트는 차분하고 성실하며 이웃 누구에게나 존경받는 사람이었습니다. 베르테르에게도 예의 바르고 친절하게 손을 내밀며 인사했습니다. 그 따뜻한 태도 앞에서 베르테르는 알베르트를 미워할 수 없다는 사실이 오히려 가슴을 눌렀습니다. 로테가 알베르트를 반기며 웃는 모습을 바라보며 그는 자신이 서 있는 자리를 처음으로 의식했습니다. 환하게만 보이던 세상의 한 귀퉁이에 옅은 그림자가 슬며시 드리워졌습니다. 그는 애써 웃음을 지으며 두 사람에게 축하의 말을 건넸습니다."}, {"id": 10, "sub": "난롯가의 대화", "title": "알베르트와의 논쟁", "quote": "마음은 이성의 저울로 달 수 없는 것이다.", "text": "어느 겨울이 오기 전 저녁, 베르테르와 알베르트는 난롯가에 마주 앉아 이야기를 나누었습니다. 처음에는 가벼운 세상 이야기로 시작했으나 대화는 점차 인간의 열정과 절망에 대한 논쟁으로 깊어졌습니다. 알베르트는 사람은 어떤 상황에서도 이성으로 자신을 다스려야 한다고 차분히 말했습니다. 베르테르는 괴로움이 한계를 넘은 사람에게 이성만을 요구하는 것은 너무 가혹하다고 반박했습니다. 두 사람의 목소리는 점점 높아졌고 난로의 장작이 탁 하고 튀며 갈라졌습니다. 로테는 곁에서 바느질을 하며 두 사람의 얼굴을 걱정스럽게 번갈아 바라보았습니다. 결국 논쟁은 결론 없이 끝났지만 베르테르의 마음에는 서로 다른 세계에 선 사람 사이의 깊은 골이 선명하게 남았습니다."}, {"id": 11, "sub": "늦여름 산책", "title": "셋이 걷는 길", "quote": "함께 있어도 나만 다른 길 위에 서 있는 것 같았다.", "text": "세 사람은 늦여름의 언덕길을 나란히 걷곤 했습니다. 알베르트와 로테가 가까이 서서 이야기를 나눌 때면 베르테르의 발걸음은 조금씩 뒤로 처졌습니다. 해가 기울며 세 사람의 그림자가 풀밭 위로 길게 늘어졌습니다. 그는 웃고 있었지만 그 웃음 뒤에서 마음은 천천히 닳아 가고 있었습니다. 로테가 돌아보며 그를 불러 줄 때마다 그는 잠시 환해졌다가 곧 다시 어두워졌습니다. 언덕 위에서 내려다본 마을의 지붕들은 모두 평온해 보였지만 그의 가슴만은 폭풍이 지나간 뒤처럼 어수선했습니다. 그는 점점 말수가 줄었고 혼자 걷는 시간이 늘어났습니다. 그의 걸음 위로 저녁 노을이 쓸쓸하게 내려앉았습니다."}, {"id": 12, "sub": "가을의 서재", "title": "홀로 쓰는 편지", "quote": "이대로는 내 마음을 지킬 수 없을 것 같네.", "text": "가을이 깊어 가자 베르테르는 밤마다 등불 아래서 친구에게 긴 편지를 썼습니다. 화병에 꽂아 둔 들꽃은 시들어 고개를 숙였고 창밖에는 낙엽이 바람에 굴러다녔습니다. 그는 펜을 잡고 한참 동안 같은 문장 앞에서 망설였습니다. 이 사랑이 어디로도 이어질 수 없다는 사실을 마침내 스스로에게 인정해야 했습니다. 로테 곁에 머물수록 그녀의 가정도, 알베르트와의 우정도, 그리고 자신의 마음도 다치게 될 것이 분명했습니다. 편지지 위로 번진 잉크 자국은 그가 흘린 눈물의 흔적 같았습니다. 그는 오랜 고민 끝에 이 마을을 떠나야 한다는 조용한 결심을 하게 되었습니다. 등불이 짧아질 무렵에야 비로소 그는 펜을 내려놓았습니다."}, {"id": 13, "sub": "새벽의 이별", "title": "작별의 길목", "quote": "가장 사랑하는 곳을 등지는 일이 이토록 무거울 줄이야.", "text": "안개 낀 이른 새벽, 베르테르는 작은 여행 가방 하나만 들고 마을 길목에 섰습니다. 마차는 이미 도착해 말들이 하얀 숨을 내쉬며 발을 구르고 있었습니다. 그는 끝내 로테에게 정식으로 작별 인사를 건네지 못했습니다. 대신 그녀의 집 쪽을 한참 동안 바라보다가 천천히 마차에 올랐습니다. 마차가 출발하자 샘물 소리와 보리수의 그림자가 하나둘 멀어졌습니다. 마을의 종소리가 점점 작아질수록 가슴속에서는 무언가가 조용히 부서지는 소리가 들렸습니다. 그는 떠나는 것이 최선이라고 몇 번이나 되뇌었습니다. 그러나 그 다짐은 마차 바퀴가 구르는 속도만큼이나 불안하게 흔들렸습니다."}, {"id": 14, "sub": "낯선 도시", "title": "딱딱한 사무실", "quote": "숫자와 서류 속에서 내 영혼은 점점 말라 간다.", "text": "베르테르는 새로운 도시의 공사관에서 서기관 일자리를 얻어 일하게 되었습니다. 책상 위에는 서류가 산처럼 쌓였고 그는 하루 종일 같은 서식을 베끼고 또 베꼈습니다. 상관은 내용보다 형식과 격식에만 집착하며 그의 글을 사사건건 고치라고 했습니다. 마음이 시키는 대로 표현하고 싶었던 그는 번번이 규칙의 벽에 가로막혔습니다. 동료들은 서로를 견제하고 출세를 계산하느라 진정한 대화를 나눌 틈이 없었습니다. 그는 회색빛 건물 안에서 점점 말수가 줄고 얼굴빛이 어두워졌습니다. 퇴근 길 창밖으로 보이는 노을만이 그에게 위로가 되었습니다. 그는 자신이 이 세계의 이방인임을 날마다 새삼 느꼈습니다."}, {"id": 15, "sub": "신분의 벽", "title": "귀족들의 모임", "quote": "나는 어디에서도 있는 그대로 환영받지 못하는구나.", "text": "어느 저녁, 베르테르는 백작의 초대를 받아 귀족들의 사교 모임에 참석했습니다. 화려한 샹들리에 아래에서 사람들은 가문과 지위를 따지며 서로의 서열을 확인하고 있었습니다. 평민 출신인 그가 방에 들어서자 대화가 잠시 끊기고 싸늘한 시선이 쏟아졌습니다. 몇몇 부인들은 부채 뒤에서 수군거리며 그를 힐끔거렸습니다. 얼마 지나지 않아 정중한 말투로 그에게 자리를 비켜 달라는 요청이 전해졌습니다. 그는 고개를 숙이고 조용히 방을 나와 어두운 복도를 걸었습니다. 세상이 사람을 가르는 보이지 않는 벽이 얼마나 높고 차가운지 뼈저리게 알게 된 밤이었습니다. 그날 밤 그는 오래도록 잠들지 못했습니다."}, {"id": 16, "sub": "떠나는 아침", "title": "공사관을 나서다", "quote": "이곳은 나를 필요로 하지 않는다. 나도 이곳이 필요 없다.", "text": "모욕을 당한 뒤 베르테르는 더는 공사관에서 버틸 수 없다고 판단했습니다. 그는 며칠을 고민하다가 마침내 사직서를 써서 상관의 책상 위에 올려놓았습니다. 상관은 놀라는 척했지만 그의 표정에는 안도의 빛이 스쳤습니다. 베르테르는 짐을 정리하며 책상 서랍 속의 오래된 편지들을 한 장 한 장 읽어 보았습니다. 건물 문을 나서자 이른 아침의 찬 공기가 얼굴을 스쳤습니다. 그는 한동안 거리에 서서 어디로 가야 할지 알 수 없는 막막함에 사로잡혔습니다. 그러나 그의 발은 이미 오래전부터 한 곳을 향해 있었습니다. 그는 낡은 가방을 다시 어깨에 메고 길을 걷기 시작했습니다."}, {"id": 17, "sub": "겨울 문턱", "title": "다시 발하임으로", "quote": "결국 내 발길은 그 사람이 있는 곳으로 돌아오고 말았다.", "text": "도시의 생활에 지친 베르테르는 마음이 이끄는 대로 다시 발하임을 찾았습니다. 하지만 마을은 여름과 달리 쓸쓸한 잿빛 옷을 입고 있었습니다. 과수원의 나무들은 앙상하게 가지만 남았고 샘터에는 얇은 얼음이 끼어 있었습니다. 마을 사람들은 반가운 얼굴로 그를 맞았지만 그는 어딘가 서먹함을 느꼈습니다. 로테와 알베르트는 그사이 이미 부부가 되어 있었습니다. 낯익은 풍경 속에서 그는 자신만 시간 밖에 홀로 남겨진 사람 같다고 느꼈습니다. 그는 일부러 발길을 멈추고 여름의 기억이 남아 있는 길목들을 하나하나 걸어 보았습니다. 그러나 어느 곳에서도 예전의 환한 빛은 찾을 수 없었습니다."}, {"id": 18, "sub": "한 청년의 슬픔", "title": "농부 청년의 사랑", "quote": "저 사람의 아픔은 곧 내 아픔이다.", "text": "마을에서 베르테르는 사랑에 빠진 한 농부 청년을 만났습니다. 청년은 일하던 집의 부인을 향한 마음을 접지 못해 쫓겨난 뒤였습니다. 그는 낡은 외투 소매로 눈을 훔치며 베르테르에게 자신의 사정을 더듬더듬 털어놓았습니다. 베르테르는 그의 이야기를 들으며 마치 거울 속의 자신을 보는 듯했습니다. 이루어질 수 없는 사랑 앞에서 사람이 얼마나 쉽게 무너질 수 있는지 그는 누구보다 잘 알았습니다. 그는 청년의 어깨를 말없이 두드리며 함께 오래 앉아 있었습니다. 이름 없는 청년의 슬픔이 곧 자신의 슬픔처럼 가슴 깊이 스며들었습니다. 헤어지며 그는 청년에게 약간의 돈과 따뜻한 위로의 말을 건넸습니다."}, {"id": 19, "sub": "달라진 집", "title": "로테의 집은 이제", "quote": "그곳은 더 이상 내가 앉을 자리가 없는 집이었다.", "text": "로테의 집은 여전히 따뜻했지만 이제 그곳에는 부부가 만든 질서가 자리 잡고 있었습니다. 베르테르가 찾아갈 때마다 알베르트는 점잖게 그를 맞이했지만 어딘가 불편한 기색을 감추지 못했습니다. 로테 또한 흔들리는 마음을 애써 누르며 환하게 웃어 보였습니다. 식탁에는 세 사람의 찻잔이 놓였지만 대화는 자꾸만 끊어지고 어색한 침묵이 흘렀습니다. 베르테르는 문 앞에 서서 안으로 들어가야 할지 말아야 할지 망설이곤 했습니다. 세 사람 모두 말하지 못한 아픔을 가슴에 품은 채 하루하루를 견디고 있었습니다. 그 집은 이제 그에게 가장 가까우면서도 가장 먼 곳이 되어 버렸습니다."}, {"id": 20, "sub": "겨울 저녁", "title": "오시안을 읽는 저녁", "quote": "시의 슬픔이 우리 둘의 슬픔과 겹쳐졌다.", "text": "눈이 내리기 시작한 어느 저녁, 베르테르는 오래된 시집을 펼쳐 로테 앞에서 낭독했습니다. 난로의 불빛이 두 사람의 얼굴을 붉게 비추었고 창밖에서는 눈이 소리 없이 쌓이고 있었습니다. 아득한 옛 영웅들의 슬픈 노래가 방 안에 낮게 울렸습니다. 그는 낭독하다가 목이 메어 몇 번이나 책장을 넘기던 손을 멈추어야 했습니다. 로테는 처음에는 담담히 듣고 있었으나 어느새 뺨 위로 눈물이 조용히 흘러내렸습니다. 두 사람은 말없이 같은 슬픔을 마주 보고 있었습니다. 시가 끝났을 때 방 안에는 장작이 타는 소리만 남았습니다. 서로의 마음이 같은 곳을 맴돌고 있다는 사실을 두 사람 모두 알아차렸습니다."}, {"id": 21, "sub": "넘지 못할 선", "title": "스치는 입맞춤", "quote": "더는 이 마음을 속일 수 없었다.", "text": "그 저녁의 낭독이 끝나자 베르테르는 끓어오르는 마음을 더는 누르지 못했습니다. 그는 떨리는 손으로 로테의 손을 잡았고 짧고 서투른 입맞춤이 두 사람 사이에 스쳐 갔습니다. 로테는 깜짝 놀라 몸을 일으켰고 한참 동안 그의 눈을 바라보았습니다. 그녀의 눈에는 분노보다 슬픔이, 슬픔보다 두려움이 더 깊이 어려 있었습니다. 베르테르는 자신이 넘어서는 안 될 선을 넘었음을 깨닫고 얼굴을 감싸 쥐었습니다. 난로의 불꽃이 두 사람의 그림자를 벽 위에서 흔들었습니다. 그 순간 이 사랑은 이어질 수 없다는 사실이 둘 모두에게 분명해졌습니다. 그는 아무 말도 하지 못한 채 방을 나와야 했습니다."}, {"id": 22, "sub": "닫힌 문", "title": "다시는 오지 마세요", "quote": "사랑한다면, 이제는 놓아 주어야 한다는 걸 알면서도.", "text": "다음 날 로테는 눈물을 삼키며 베르테르에게 더는 찾아오지 말아 달라고 부탁했습니다. 그것은 남편과 자신, 그리고 그를 모두 지키기 위한 그녀의 마지막 용기였습니다. 그녀의 목소리는 조용했지만 그 안에는 단단한 결심이 들어 있었습니다. 베르테르는 아무 반박도 하지 못한 채 고개를 숙였습니다. 문이 닫히는 소리가 복도에 낮게 울렸고 그 소리는 오래도록 그의 귓가를 떠나지 않았습니다. 그는 한참 동안 그 자리에 서서 닫힌 문의 나뭇결을 바라보았습니다. 문틈으로 새어 나오던 따뜻한 불빛마저 이내 희미해졌습니다. 그는 천천히 몸을 돌려 어두운 계단을 내려갔습니다."}, {"id": 23, "sub": "마지막 산책", "title": "눈 속의 보리수", "quote": "이 길 위의 모든 계절을 나는 기억할 것이다.", "text": "그날 오후 베르테르는 오래전 자주 찾던 샘터의 보리수 아래로 걸어갔습니다. 눈이 소복이 쌓인 가지는 여름의 푸른 그늘을 기억조차 못하는 듯 고요했습니다. 그는 나무 둥치에 손을 얹고 지난봄의 샘물 소리와 아이들의 웃음을 떠올렸습니다. 처음 로테를 만난 날의 빵 냄새와 무도회의 번개 불빛이 스쳐 지나갔습니다. 그는 주머니에서 낡은 화첩을 꺼내 첫 장에 그렸던 샘터의 그림을 오래 들여다보았습니다. 눈송이가 화첩 위에 내려앉았다가 천천히 녹아내렸습니다. 마을을 천천히 한 바퀴 돌며 그는 만난 사람들과 풍경에게 마음속으로 작별 인사를 건넸습니다. 해가 지자 그는 어두워 오는 길을 따라 천천히 걸음을 옮겼습니다."}, {"id": 24, "sub": "12월의 밤", "title": "눈 내리는 밤길", "quote": "이 밤은 너무 길고, 너무 고요하다.", "text": "눈발이 흩날리는 밤, 베르테르는 가로등 하나 없는 길을 홀로 걸었습니다. 어디로 가야 할지 알 수 없는 발자국이 하얀 눈 위에 길게 이어졌습니다. 불 켜진 창마다 저녁상을 둘러싼 평범한 가족들의 온기가 비쳤습니다. 그는 그 따뜻한 빛들이 너무도 멀게 느껴져 걸음을 멈추고 한참을 바라보았습니다. 달은 구름 사이로 희미하게 얼굴을 내밀었다가 다시 숨었습니다. 그의 어깨 위에도, 외투 위에도 하얀 눈이 수북이 쌓였지만 그는 털어 낼 생각조차 하지 않았습니다. 그는 오랜 걸음 끝에 서재의 불빛이 있는 집으로 돌아왔습니다. 문을 닫는 순간 바깥의 소음이 모두 눈 속으로 사라진 듯 고요했습니다."}, {"id": 25, "sub": "마지막 편지", "title": "꺼져 가는 촛불", "quote": "나의 사랑하는 이들이여, 부디 평안하기를.", "text": "서재의 촛불 아래 베르테르는 로테에게 보내는 마지막 편지를 정성껏 썼습니다. 책상 위에는 펼쳐진 시집과 시든 들꽃이 가지런히 놓여 있었습니다. 그는 그녀에게 감사와 사랑을, 알베르트에게 용서를, 친구에게 작별을 차례로 적어 내려갔습니다. 문장 하나하나에 지난 시간의 기억이 따뜻하게도 쓸쓸하게도 배어 있었습니다. 편지를 다 쓴 그는 오래도록 창밖의 어둠을 바라보았습니다. 촛불은 바람도 없는데 가늘게 흔들리다가 천천히 작아지기 시작했습니다. 방 안에는 오래된 종이 냄새와 깊은 고요만이 남았습니다. 마지막 불꽃이 가만히 사그라드는 모습은 오래도록 꺼지지 않은 한 사람의 마음을 닮아 있었습니다."}, {"id": 26, "sub": "새벽의 보리수", "title": "빈 의자와 보리수", "quote": "그가 사랑한 계절은 이제 한 편의 이야기로 남았다.", "text": "겨울의 새벽빛이 서재의 창으로 가만히 스며들었습니다. 책상 앞 의자는 비어 있었고 펼쳐진 시집 위로 따뜻한 햇살이 내려앉았습니다. 어디선가 이른 아침을 알리는 종소리가 멀리서 들려왔습니다. 마을 사람들은 그를 아껴 온 이들의 마음을 모아 샘가의 보리수 아래에 조용히 묻어 주었습니다. 그의 곁에는 어린 시절의 마지막 봄처럼 환한 햇살이 오래도록 머물렀습니다. 로테는 먼 곳에서 그의 소식을 듣고 오래도록 말없이 창가에 서 있었습니다. 그가 남긴 슬픔은 시간이 지나도 사라지지 않고 사랑의 아픔을 아는 이들의 마음속에서 이야기가 되었습니다. 그리고 해마다 봄이 오면 보리수는 그가 처음 도착한 날처럼 연한 잎을 틔웠습니다."}];

OrKt+pMbAIEO4zJn6jezSJN+o9UJeu5+A1rTluxvgTEABRgC6OD5R9UPuidXBOBE4DpiBAhppH8gfWjzRgDqcVoBryAAAA"};

    SCENES.forEach(s => s.imgData = IMAGES_B64[s.id] || "");

    let currentIndex = 0;
    let currentMode = 'book';
    let synth = window.speechSynthesis;
    let isSpeaking = false;

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('bookView').style.display = mode === 'book' ? 'block' : 'none';
      document.getElementById('galleryView').style.display = mode === 'gallery' ? 'flex' : 'none';
      document.getElementById('btnModeBook').classList.toggle('active', mode === 'book');
      document.getElementById('btnModeGallery').classList.toggle('active', mode === 'gallery');
      if (mode === 'book') renderBookSpread(currentIndex);
      else synth.cancel();
    }

    function renderBookSpread(idx) {
      if (idx < 0 || idx >= SCENES.length) return;
      currentIndex = idx;
      const s = SCENES[idx];
      document.getElementById('bookImg').src = s.imgData;
      document.getElementById('bookSceneNum').textContent = `SCENE ${String(s.id).padStart(2, '0')} / 26`;
      document.getElementById('bookSub').textContent = s.sub;
      document.getElementById('bookTitle').textContent = s.title;
      document.getElementById('bookQuote').textContent = `"${s.quote}"`;
      document.getElementById('bookText').textContent = s.text;
      document.getElementById('bookPageIndicator').textContent = `${s.id} / 26 페이지`;
      document.getElementById('sceneSlider').value = s.id;
      synth.cancel();
    }

    function prevScene() { if (currentIndex > 0) renderBookSpread(currentIndex - 1); }
    function nextScene() { if (currentIndex < SCENES.length - 1) renderBookSpread(currentIndex + 1); }
    function onSliderChange(val) { renderBookSpread(parseInt(val) - 1); }

    function buildGallery() {
      const container = document.getElementById('galleryView');
      container.innerHTML = '';
      SCENES.forEach(s => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <div class="gallery-art" onclick="openLightboxImg(SCENES[${s.id - 1}].imgData)">
            <img src="${s.imgData}" alt="${s.title}" loading="lazy">
          </div>
          <div class="gallery-content">
            <div class="gallery-meta"><span class="gallery-num">SCENE ${String(s.id).padStart(2, '0')}</span></div>
            <h2 class="gallery-title">${s.title}</h2>
            <div class="gallery-quote">"${s.quote}"</div>
            <p class="gallery-text">${s.text}</p>
          </div>`;
        container.appendChild(card);
      });
    }

    function openLightboxCurrent() { openLightboxImg(SCENES[currentIndex].imgData); }
    function openLightboxImg(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

    function toggleTtsCurrent() {
      if (isSpeaking) { synth.cancel(); isSpeaking = false; }
      else {
        const utter = new SpeechSynthesisUtterance(SCENES[currentIndex].title + ". " + SCENES[currentIndex].text);
        utter.lang = 'ko-KR'; utter.rate = 0.92;
        utter.onend = () => { isSpeaking = false; };
        synth.speak(utter);
        isSpeaking = true;
      }
    }

    // Web Audio Music Box BGM
    let audioCtx = null, isMusicPlaying = false, musicTimer = null;
    function toggleMusic() {
      if (isMusicPlaying) {
        isMusicPlaying = false;
        clearTimeout(musicTimer);
        document.getElementById('btnMusic').classList.remove('playing');
      } else {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isMusicPlaying = true;
        document.getElementById('btnMusic').classList.add('playing');
        const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        let idx = 0;
        function play() {
          if (!isMusicPlaying) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(notes[idx % notes.length], audioCtx.currentTime);
          idx++;
          gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 1.9);
          musicTimer = setTimeout(play, 900);
        }
        play();
      }
    }

    window.onload = () => { renderBookSpread(0); buildGallery(); };
  </script>
