<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>죄와 벌 - 표도르 도스토옙스키 이야기책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FAF6EE;--bg-paper:#FFFDF9;--primary-color:#2f4a5e;--accent-color:#c28b38;--text-main:#2c2523;--border-warm:#E8DFC8;--shadow-book:0 20px 45px -10px rgba(74,52,28,.18);--font-story:'Nanum Myeongjo','Gowun Batang',serif;--font-body:'Gowun Batang',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-cream);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(255,253,249,.96);border-bottom:1px solid var(--border-warm);position:sticky;top:0;z-index:100;padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand-title{font-family:var(--font-story);font-size:1.35rem;font-weight:800}
.nav-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-size:1.05rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--border-warm);background:#fff;cursor:pointer}
.btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;max-width:900px;margin:0 auto;width:100%}
.book-container{width:100%}
.book-spread{background:var(--bg-paper);border-radius:14px;box-shadow:var(--shadow-book);border:1px solid var(--border-warm);padding:2.6rem 3rem;min-height:600px;display:flex;flex-direction:column;justify-content:space-between}
.scene-meta{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem;font-size:1rem;color:var(--accent-color);font-weight:700}
.scene-number{background:var(--primary-color);color:#fff;border-radius:999px;padding:.2rem .8rem}
.scene-heading{font-family:var(--font-story);font-size:2.1rem;font-weight:800;margin-bottom:1.3rem;line-height:1.4}
.quote-label{font-size:.95rem;color:#9f1239;margin-bottom:.3rem;font-weight:700}
.quote-box{background:#FFF1F2;border-left:4px solid #be123c;padding:1rem 1.2rem;border-radius:0 8px 8px 0;margin-bottom:1.6rem}
.quote-text{font-family:var(--font-story);font-size:1.25rem;font-weight:700;color:#881337;line-height:1.7}
.story-paragraph{font-size:1.35rem;line-height:2.1;color:#2f2a28;word-break:keep-all;white-space:pre-line}
.page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-size:1.05rem}
.controls-panel{margin-top:1.6rem;display:flex;align-items:center;gap:1.2rem;background:rgba(255,253,249,.95);border:1px solid var(--border-warm);padding:.75rem 1.4rem;border-radius:999px}
.nav-arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--border-warm);background:#fff;font-size:1.2rem;cursor:pointer}
.slider-track{width:260px;max-width:50vw}
.gallery-container{width:100%;display:flex;flex-direction:column;gap:2.5rem}
.gallery-card{background:var(--bg-paper);border-radius:16px;border:1px solid var(--border-warm);padding:2rem 2.4rem}
.gallery-title{font-family:var(--font-story);font-size:1.8rem;margin:.4rem 0 1rem}
.gallery-quote{font-family:var(--font-story);font-weight:700;color:#881337;background:#FFF1F2;border-left:4px solid #be123c;padding:.8rem 1rem;margin-bottom:1rem;font-size:1.15rem}
.gallery-text{font-size:1.3rem;line-height:2.05;white-space:pre-line;word-break:keep-all}
.note{margin-top:1rem;font-size:.95rem;color:#7a6a58;text-align:center;max-width:760px;line-height:1.7}
@media(max-width:640px){.book-spread{padding:1.6rem 1.2rem}.scene-heading{font-size:1.7rem}.story-paragraph{font-size:1.2rem}}
</style></head><body>
<header><div><span>📖</span> <span class="brand-title">표도르 도스토옙스키 · 죄와 벌</span></div>
<div class="nav-actions">
<button class="btn active" id="btnModeBook" onclick="switchMode('book')">📖 책으로 보기</button>
<button class="btn" id="btnModeGallery" onclick="switchMode('gallery')">📜 쭉 이어 읽기</button>
<button class="btn" id="btnMusic" onclick="toggleMusic()">🎵 오르골 소리</button></div></header>
<main>
<div class="book-container" id="bookView">
<div class="book-spread"><div>
<div class="scene-meta"><span class="scene-number" id="bookSceneNum"></span></div>
<h1 class="scene-heading" id="bookTitle"></h1>
<div class="quote-label">이 장면의 한마디</div>
<div class="quote-box"><p class="quote-text" id="bookQuote"></p></div>
<p class="story-paragraph" id="bookText"></p></div>
<div class="page-footer"><span id="bookPageIndicator"></span><button class="btn" onclick="toggleTtsCurrent()">🔊 읽어주기</button></div></div>
<div style="display:flex;justify-content:center"><div class="controls-panel">
<button class="nav-arrow" onclick="prevScene()">❮</button>
<input type="range" class="slider-track" id="sceneSlider" min="1" max="25" value="1" oninput="onSliderChange(this.value)">
<button class="nav-arrow" onclick="nextScene()">❯</button></div></div>
<p class="note">※ 이 이야기책은 원문이 아니라, 줄거리를 쉬운 말로 풀어 엮은 것입니다. 세부 내용은 보태거나 줄인 곳이 있어 원작과 다를 수 있으니, 자세한 것은 책으로 확인해 주세요.</p>
</div>
<div class="gallery-container" id="galleryView" style="display:none"></div>
</main>
<script>
const SCENES = [{"title": "무더운 여름, 가난한 대학생", "quote": "사람은 가난 속에서 얼마나 생각이 깊어지고 또 어두워질 수 있을까.", "text": "러시아의 수도 페테르부르크, 숨 막히게 무더운 7월입니다. 법학을 공부하던 청년 로디온 라스콜니코프는 학비를 내지 못해 학교를 쉬고, 관 속처럼 좁은 다락방에 틀어박혀 지냅니다. 집세도 몇 달째 밀려 하숙집 주인 아주머니를 마주칠까 봐 계단을 살금살금 내려갑니다.\n\n그의 머릿속에는 어떤 무서운 생각이 오래전부터 자라고 있습니다. 그는 그 생각을 확인해 보려고 낡은 물건을 맡기는 전당포 노파 알료나 이바노브나의 집을 미리 둘러보러 갑니다. 아직은 자기 자신에게도 그것이 진짜 계획인지 아닌지 분명히 말하지 못합니다.", "id": 1}, {"title": "술집에서 만난 마르멜라도프", "quote": "저에게는 더 갈 곳이 없습니다. 그것을 아십니까, 선생.", "text": "전당포를 다녀온 라스콜니코프는 싸구려 술집에서 술에 취한 늙은 관리 마르멜라도프를 만납니다. 그는 직장에서 쫓겨난 뒤 술에 빠져 살고 있습니다. 병든 아내 카테리나 이바노브나와 어린 아이들이 굶고 있어서, 의붓딸 소냐가 어쩔 수 없이 몸을 팔아 가족을 먹여 살리게 되었다고 눈물로 털어놓습니다.\n\n라스콜니코프는 비틀거리는 그를 집까지 데려다 줍니다. 가난이 사람을 얼마나 바닥까지 끌고 가는지, 그리고 착한 소냐가 왜 그런 희생을 해야 하는지를 직접 눈으로 보고 그의 마음은 더욱 무거워집니다.", "id": 2}, {"title": "어머니의 편지", "quote": "오빠를 위해 자기 인생을 팔려는 누이가 있다.", "text": "하숙집에서 라스콜니코프는 시골의 어머니가 보낸 긴 편지를 받습니다. 누이 두냐가 지주 스비드리가일로프의 집에서 가정교사로 일하다가 그의 집요한 구애와 아내의 오해 때문에 큰 모욕을 당했다는 이야기, 그 일이 진실이 밝혀져 겨우 가라앉았다는 이야기가 쓰여 있습니다.\n\n그리고 두냐가 돈 많고 점잖아 보이는 변호사 루진과 약혼했다는 소식도 있습니다. 라스콜니코프는 누이가 오빠의 앞길을 열어 주려고 마음에도 없는 결혼을 하려 한다는 것을 알아챕니다. 그는 분노와 부끄러움으로 가슴이 타오릅니다. 누이가 팔려 가는 것을 두고 볼 수는 없다고 생각하며 거리를 헤맵니다.", "id": 3}, {"title": "거리의 소녀와 말의 꿈", "quote": "나는 정말 그 일을 할 수 있을까. 아니, 그만두자.", "text": "거리에서 그는 술에 취해 비틀거리는 어린 소녀 뒤를 쫓는 낯선 신사를 발견하고, 경찰에게 부탁해 소녀를 지켜 주려고 가진 돈을 내놓습니다. 하지만 곧 돌아서서 '내가 무슨 상관인가' 하며 그 일을 접어 버립니다.\n\n그날 밤 그는 어린 시절의 꿈을 꿉니다. 술 취한 농부들이 불쌍한 늙은 말을 채찍과 쇠막대로 때려 죽이는 장면입니다. 어린 소년은 울며 말을 끌어안습니다. 꿈에서 깨어난 그는 도끼로 사람의 머리를 내리친다는 생각에 몸서리를 치며 '나는 못 한다'고 중얼거립니다. 그러나 우연히 시장에서 들은 한마디가 그의 마음을 다시 돌려놓습니다.", "id": 4}, {"title": "우연이 만든 시간", "quote": "내일 저녁 일곱 시, 노파 혼자 집에 있다.", "text": "장터에서 그는 노파의 이복 여동생 리자베타가 내일 저녁 일곱 시에 집에 없을 것이라는 말을 우연히 듣게 됩니다. 노파 혼자 있는 시간이 정해진 것입니다. 라스콜니코프는 마치 운명이 자신을 떠미는 것 같은 기분이 듭니다.\n\n그는 그동안 몰래 품어 온 생각을 되새깁니다. 비범한 사람은 인류를 위해서라면 낡은 법을 넘어설 권리가 있다는 것입니다. 하찮고 해로운 늙은 고리대금업자의 돈을 빼앗아 수많은 사람을 구한다면 그것이 죄가 되겠느냐는 논리입니다. 하지만 자기 마음 한구석에서는 아직도 '이것은 옳지 않다'고 외치는 소리가 가라앉지 않습니다.", "id": 5}, {"title": "도끼", "quote": "사람을 죽인 것이 아니라, 나는 원칙을 죽였다고 생각했다.", "text": "다음 날 저녁, 그는 문지기 방에서 훔친 도끼를 외투 안쪽에 매달고 노파의 집을 찾아갑니다. 맡길 물건이 있는 척하며 노파가 물건을 살피는 틈에 도끼로 내리칩니다. 노파는 쓰러집니다. 돈과 물건을 챙기는데, 갑자기 리자베타가 돌아와 그 광경을 보고 맙니다. 그는 리자베타마저 죽이고 맙니다.\n\n그 순간 계단에서 사람들의 목소리가 들리고, 누군가 문을 두드립니다. 그는 숨을 죽이고 안에서 버팁니다. 손님들이 문 앞에서 머뭇거리는 사이 겨우 빈 집으로 몸을 숨기고, 사람들이 올라간 틈에 빠져나옵니다. 제정신이 아닌 채 집으로 돌아온 그는 가져온 물건을 아무렇게나 숨기고 쓰러지듯 잠이 듭니다.", "id": 6}, {"title": "열병과 라주미힌", "quote": "나는 사람을 죽인 것이 아니라 스스로를 죽였는지도 모른다.", "text": "잠에서 깬 그는 옷에 피가 묻지 않았는지 샅샅이 살핍니다. 이때 경찰서에서 하숙비 문제로 보낸 소환장이 도착합니다. 그는 범행이 들통났다고 생각해 겁에 질려 경찰서로 가지만, 정작 이야기는 밀린 집세 문제일 뿐이었습니다. 그런데도 경찰들이 살인 사건을 이야기하는 소리를 듣고 그는 그만 정신을 잃고 쓰러집니다.\n\n집으로 돌아와 몇 날을 열병으로 앓는 동안, 대학 친구 라주미힌이 곁을 지키며 돌봅니다. 라주미힌은 가난하지만 마음이 따뜻하고 씩씩한 청년입니다. 그는 의사 조시모프를 불러오고, 라스콜니코프가 앓는 동안 일어난 일들을 들려줍니다. 라스콜니코프는 주변 사람들이 자신을 의심하는 것은 아닌지 하나하나 눈치를 살핍니다.", "id": 7}, {"title": "마르멜라도프의 마지막", "quote": "가난은 죄가 아니라지만 가난은 악덕이다.", "text": "병이 조금 나아진 어느 날, 거리에서 라스콜니코프는 마차에 치여 피투성이가 된 마르멜라도프를 발견합니다. 그는 사람들과 함께 그를 집으로 옮기고 의사를 부릅니다. 가진 돈을 모두 털어 아내 카테리나에게 건네기까지 합니다. 마르멜라도프는 딸 소냐의 이름을 부르다가 눈을 감습니다.\n\n그 자리에서 라스콜니코프는 처음으로 소냐를 만납니다. 수줍고 가냘픈 소녀입니다. 그는 소냐와 어린 동생들의 눈빛을 보며, 자신이 지은 죄와 이 사람들의 고통이 어떻게 이어져 있는지를 어렴풋이 느낍니다. 집에 돌아오니 어머니 풀리헤리야와 누이 두냐가 도시에 도착해 그를 기다리고 있습니다.", "id": 8}, {"title": "어머니와 누이를 만나다", "quote": "나는 어머니와 누이를 안을 자격이 없다.", "text": "반가워야 할 가족과의 만남이 라스콜니코프에게는 오히려 고통입니다. 그는 어머니를 안자마자 기절할 듯 비틀거리고, 나중에는 누이에게 '루진과 나 둘 중 한 사람을 고르라'며 뜻밖의 말을 던집니다. 오빠를 위해 약혼한 두냐는 그 말에 깜짝 놀랍니다.\n\n라주미힌은 두냐를 처음 본 순간 마음을 빼앗기고, 두 여인을 정성껏 보살핍니다. 한편 루진은 자신이 가난한 집안의 아가씨를 구해 주는 은인이라는 듯 거드름을 피웁니다. 라스콜니코프가 그 자리에서 루진을 몰아세우자 두냐와 루진 사이에도 금이 가기 시작합니다.", "id": 9}, {"title": "예심판사 포르피리", "quote": "비범한 사람에게는 걸림돌을 넘어설 권리가 있습니까.", "text": "라주미힌의 친척인 예심판사 포르피리 페트로비치가 라스콜니코프를 만나 대화를 나눕니다. 그는 라스콜니코프가 얼마 전 잡지에 실은 논문 이야기를 꺼냅니다. 논문에는 사람을 평범한 사람과 비범한 사람으로 나누고, 비범한 사람은 어떤 경우에는 양심에 따라 법을 넘어설 권리가 있다는 주장이 담겨 있었습니다.\n\n포르피리는 웃으며 가볍게 묻는 것 같지만, 질문 하나하나가 날카롭습니다. 라스콜니코프는 식은땀을 흘리며 대답합니다. 포르피리는 아직 증거는 없지만 이 청년이 범인일지 모른다고 의심하고 있다는 것을 숨기지 않고 암시합니다.", "id": 10}, {"title": "스비드리가일로프의 등장", "quote": "저는 당신과 닮은 데가 있는 것 같습니다.", "text": "어느 날 라스콜니코프의 방에 낯선 신사가 찾아옵니다. 두냐에게 모욕을 주었던 바로 그 지주 스비드리가일로프입니다. 그의 아내 마르파가 갑자기 죽었고, 그 죽음에도 소문이 따라다닙니다. 그는 자기가 두냐를 만날 수 있게 주선해 달라고 부탁합니다.\n\n스비드리가일로프는 죽은 아내의 유령이 자기를 찾아온다는 이야기도 아무렇지 않게 꺼냅니다. 그는 방탕하고 속을 알 수 없는 사람이지만, 라스콜니코프의 비밀을 엿들어 알고 있다는 눈치입니다. 라스콜니코프는 이 사람이 자기를 쥐고 흔들 수도 있다는 불안에 빠집니다.", "id": 11}, {"title": "루진의 음모", "quote": "남을 해치려던 자가 제 꾀에 빠지다.", "text": "두냐는 루진의 거만함과 오빠에 대한 비난을 참지 못하고 약혼을 깹니다. 앙심을 품은 루진은 마르멜라도프 가족의 장례 만찬에서 엉뚱한 일을 꾸밉니다. 몰래 소냐의 주머니에 백 루블 지폐를 밀어 넣고는, 소냐가 자기 돈을 훔쳤다고 소리친 것입니다.\n\n소냐는 억울함에 울고, 카테리나는 분노합니다. 그때 루진의 같은 하숙집에 사는 레베자트니코프가 나서서 루진이 직접 소냐 주머니에 돈을 넣는 것을 보았다고 증언합니다. 루진의 음모는 들통나고 그는 망신을 당해 쫓겨납니다. 라스콜니코프도 소냐 편에 서서 그를 몰아붙입니다.", "id": 12}, {"title": "소냐를 찾아가다", "quote": "저는 당신에게 무릎을 꿇는 것이 아닙니다. 인류의 모든 고통 앞에 꿇는 것입니다.", "text": "그날 밤, 라스콜니코프는 소냐의 방을 찾아갑니다. 소냐는 깊은 신앙을 지닌 소녀입니다. 그는 그녀의 발 앞에 엎드려 입을 맞춥니다. 놀라는 소냐에게 '나는 당신 앞에서가 아니라 인류의 모든 고통 앞에 무릎을 꿇은 것'이라고 말합니다.\n\n그는 소냐에게 죽은 리자베타와 친구였느냐고 묻습니다. 소냐는 그렇다고 하며 리자베타가 착하고 순한 사람이었다고 말합니다. 소냐는 복음서를 꺼내 보이고, 라스콜니코프는 부탁하여 죽은 나사로를 살린 이야기를 읽게 합니다. 소냐가 떨리는 목소리로 읽는 동안 그는 말없이 듣습니다.", "id": 13}, {"title": "죄의 고백", "quote": "당신이 죽인 것은 노파가 아니라 당신 자신이에요.", "text": "다음 날 그는 다시 소냐를 찾아가 마침내 비밀을 털어놓을 마음을 먹습니다. 그는 '리자베타를 죽인 사람이 누구인지 알고 있다'고 에둘러 말하다가, 소냐가 그의 눈을 보고 깨닫기를 기다립니다. 소냐는 공포와 연민으로 얼굴이 하얗게 질립니다.\n\n그는 자신의 이론을 설명하며 자신이 비범한 사람인지 시험해 보고 싶었다고 말합니다. 하지만 이어서 '내가 죽인 것은 노파가 아니라 나 자신이었다'고 고백합니다. 소냐는 그를 끌어안고 울며 '지금 당장 광장에 나가 땅에 입 맞추고 사람들에게 죄를 고백하라'고 말합니다. 그는 아직 그럴 준비가 되어 있지 않습니다.", "id": 14}, {"title": "포르피리의 덫", "quote": "범인은 당신입니다. 하지만 스스로 오시기를 기다립니다.", "text": "포르피리는 다시 라스콜니코프를 불러 이야기를 나눕니다. 그는 정중하면서도 집요하게 압박해 오고, 라스콜니코프의 허점을 하나하나 짚어 갑니다. 이번에는 사실상 '당신이 범인'이라고 말하는 것이나 다름없습니다. 하지만 증거가 없으니 스스로 자백하고 찾아오라고 권합니다.\n\n라스콜니코프는 분노와 두려움으로 맞섭니다. 그러나 이야기가 끝나갈 무렵, 방 안으로 뜻밖의 일이 일어납니다. 페인트칠을 하던 노동자 미콜카가 자기가 노파를 죽였다고 자백한 것입니다. 사건은 엉뚱한 방향으로 흘러가고, 라스콜니코프는 일단 위기를 넘기지만 마음은 더 어지럽습니다.", "id": 15}, {"title": "카테리나의 최후", "quote": "이제 정말 더는 갈 곳이 없다.", "text": "마르멜라도프가 죽은 뒤 가난에 지친 카테리나 이바노브나는 병이 깊어 가고, 정신마저 흔들립니다. 그녀는 남편의 장례 만찬을 정성껏 차리려고 무리를 하지만 손님들은 무례하게 굴고, 그 자리에서 루진의 모함 사건까지 터집니다.\n\n그녀는 아이들을 데리고 거리로 나가 노래하고 춤추며 돈을 구걸합니다. 그러다 피를 토하며 쓰러집니다. 신부를 부르겠다는 사람들에게 '신은 나를 용서할 것'이라고 말하고 숨을 거둡니다. 이 자리에 나타난 스비드리가일로프는 아이들의 장례와 보살핌에 쓰라며 큰돈을 내놓겠다고 합니다. 라스콜니코프는 이 말을 듣고 있습니다.", "id": 16}, {"title": "스비드리가일로프의 고백", "quote": "사람은 자기 죄를 스스로 피할 수 없는 법입니다.", "text": "스비드리가일로프는 라스콜니코프가 소냐에게 털어놓은 고백을 벽 너머에서 엿들었음을 슬며시 알립니다. 그는 이 사실을 이용해 두냐에게 접근하려 합니다. 두냐는 오빠를 걱정하는 마음에 그를 만나러 가고, 그가 빌린 방에서 위험한 순간을 맞습니다.\n\n그는 문을 잠그고, 오빠의 비밀을 가지고 있다며 두냐를 붙잡아 두려 합니다. 두냐는 권총을 꺼내 그에게 쏘지만 총알은 빗나갑니다. 다시 방아쇠를 당길 수 있는 순간에 두냐는 총을 던져 버립니다. 스비드리가일로프는 그녀가 결코 자기를 사랑하지 않을 것임을 깨닫고 열쇠를 건네 줍니다.", "id": 17}, {"title": "스비드리가일로프의 마지막 밤", "quote": "저는 이제 아메리카로 갑니다.", "text": "두냐를 보낸 스비드리가일로프는 그날 밤 거리를 헤맵니다. 그는 소냐의 집에 가서 아이들의 앞날을 위한 돈을 건네고, 자신의 어린 약혼녀에게도 많은 돈을 남깁니다. 마치 정리하듯 모든 인연에 마지막 인사를 하는 듯합니다.\n\n그는 어두운 여관에서 악몽에 시달리고, 새벽에 안개 속 거리로 나가 소방서 망루 앞 병사의 옆에서 '아메리카로 간다'는 말을 남기고 방아쇠를 당깁니다. 그의 삶은 끝내 아무에게도 구원을 받지 못한 채 끝납니다. 그의 죽음은 라스콜니코프에게 또 하나의 무거운 경고가 됩니다.", "id": 18}, {"title": "어머니와 누이에게 작별을", "quote": "저는 이제 다시 어머니를 뵐 수 없을지도 모릅니다.", "text": "라스콜니코프는 마지막으로 어머니를 찾아가 포옹하고 작별을 합니다. 그는 어머니에게 자신을 용서해 달라고 하며, 곧 긴 이별이 올 것이라고 암시합니다. 어머니는 영문을 알지 못한 채 눈물만 흘립니다.\n\n그는 누이 두냐에게는 조금 더 솔직하게 모든 일을 털어놓습니다. 두냐는 충격을 받지만 곧 마음을 가다듬고, 오빠가 고통을 짊어지고 걸어가야 할 길을 함께 받아들이기로 합니다. 라주미힌에게 두냐와 어머니를 부탁하고, 라스콜니코프는 마지막으로 소냐를 만나러 갑니다.", "id": 19}, {"title": "광장의 입맞춤", "quote": "땅에 입을 맞추어라. 그리고 사방에 절하고, 나는 죄인입니다 하고 말하라.", "text": "소냐는 사이프러스 나무로 된 십자가를 그의 목에 걸어 주고 자기 것은 가져갑니다. 그리고 그가 광장에 나가 땅에 입을 맞추고, 온 세상에 절하며 자신의 죄를 고백하도록 용기를 줍니다.\n\n라스콜니코프는 건초 광장 한복판에서 땅에 입을 맞춥니다. 사람들은 그를 비웃거나 취한 사람으로 여깁니다. 그는 그 모습을 보면서도 주저하다가 경찰서로 들어갑니다. 그는 거기서 스비드리가일로프의 자살 소식을 듣고, 결국 서장 앞에서 '내가 노파와 리자베타를 도끼로 죽였다'고 말합니다.", "id": 20}, {"title": "재판과 감형", "quote": "그는 자백했고, 그의 상태는 혼란스러웠다.", "text": "자수한 라스콜니코프는 재판을 받습니다. 그는 자신의 이론이나 이유를 크게 변명하지 않고, 훔친 물건을 거의 쓰지도 않았음이 밝혀집니다. 그는 이전에 병든 동료 학생을 도운 일, 불난 집에서 아이를 구한 일 등 선행을 한 사실도 알려져, 재판부는 정상을 참작합니다.\n\n그는 징역 8년형을 선고받고 시베리아로 보내집니다. 미친 듯 앓던 어머니는 아들의 소식을 모른 채 병으로 세상을 떠납니다. 두냐는 라주미힌과 마음을 나누며 결혼하기로 하고 오빠의 뒷일을 돌봅니다. 소냐는 홀로 그를 따라 시베리아로 떠납니다.", "id": 21}, {"title": "시베리아의 감옥", "quote": "나는 정말 아무 죄도 없는 것일까, 아니면 끝내 지은 죄를 뉘우치지 못하는 것일까.", "text": "시베리아 감옥에서 라스콜니코프는 여전히 마음을 닫고 지냅니다. 그는 동료 죄수들과 어울리지 못하고, 그들에게 미움을 사기도 합니다. 그는 자신이 한 일이 죄라는 것을 머리로는 알지만, 아직 마음으로는 받아들이지 못합니다.\n\n소냐는 감옥 근처에 살면서 그를 면회하고 죄수들에게도 친절을 베풀어 존경을 받습니다. 죄수들은 라스콜니코프에게는 쌀쌀맞았으나 소냐를 만나면 '어머니, 소피야 세묘노브나'라고 부르며 따릅니다. 그는 소냐가 병이 나서 며칠 오지 못했을 때에야 그녀가 얼마나 소중한지를 깨닫기 시작합니다.", "id": 22}, {"title": "마지막 꿈", "quote": "사람들은 저마다 자기만이 옳다고 믿고 서로를 죽이기 시작했다.", "text": "감옥에서 병을 앓던 라스콜니코프는 기이한 꿈을 꿉니다. 아시아에서 온 신기한 병균이 사람들 속에 퍼져, 병에 걸린 사람은 누구든 자기만 옳다고 믿고 서로를 믿지 못하며 죽이고 마는 세상이었습니다. 마을마다 사람들이 서로 싸우다 멸망해 가는 꿈입니다.\n\n꿈에서 깬 그는 그것이 바로 자신이 가졌던 사상의 모습이었다는 것을 어렴풋이 깨닫습니다. 오만한 이성과 자기만의 정의가 낳는 파멸을 보았습니다. 그의 마음속에서 딱딱한 얼음이 서서히 풀리기 시작합니다.", "id": 23}, {"title": "부활의 새벽", "quote": "그들을 일으킨 것은 사랑이었다.", "text": "어느 맑은 날, 강가에서 일하던 라스콜니코프는 소냐가 다가오는 것을 봅니다. 그는 갑자기 그녀의 무릎을 끌어안고 눈물을 흘립니다. 소냐는 처음에는 놀라지만 곧 그의 마음이 달라졌음을 알아챕니다. 그들은 말없이 서로를 바라보며 눈물을 흘립니다.\n\n사랑이 두 사람을 다시 살렸다는 것을 둘 다 압니다. 앞으로 남은 칠 년이 아직 길지만, 그들에게는 그 칠 년이 마치 칠 일처럼 느껴집니다. 그는 소냐가 준 복음서를 베개 밑에서 꺼내 놓습니다. 이야기는 이제 그가 새로운 삶, 한 인간이 서서히 다른 사람으로 다시 태어나는 새 이야기가 시작될 것을 알리며 끝이 납니다.", "id": 24}, {"title": "이 이야기가 우리에게 남긴 것", "quote": "죄는 머리로 넘어설 수 없고, 사랑으로만 씻긴다.", "text": "『죄와 벌』은 범죄를 저지른 한 청년이 잡히느냐 마느냐를 다룬 추리소설이 아닙니다. 이 이야기는 '나는 보통 사람과 다르다'고 믿으며 스스로 정의를 세우려던 사람이 얼마나 쉽게 무너지는지, 그리고 그를 다시 일으키는 것이 어떤 힘인지를 보여 줍니다.\n\n라스콜니코프를 끝까지 포기하지 않은 사람들은 가난하고 약한 사람들, 소냐와 라주미힌, 어머니와 누이였습니다. 도스토옙스키는 인간이 이성만으로는 구원받을 수 없고, 고통을 받아들이고 사랑을 나눌 때 비로소 새로운 삶이 열린다고 말합니다. 이것이 이 긴 이야기를 읽고 난 뒤에도 오래 남는 이야기입니다.", "id": 25}];
let cur=0,synth=window.speechSynthesis,speaking=false;
function switchMode(m){document.getElementById('bookView').style.display=m==='book'?'block':'none';
document.getElementById('galleryView').style.display=m==='gallery'?'flex':'none';
document.getElementById('btnModeBook').classList.toggle('active',m==='book');
document.getElementById('btnModeGallery').classList.toggle('active',m==='gallery');
if(m==='book')render(cur);else{synth.cancel();speaking=false;}}
function render(i){if(i<0||i>=SCENES.length)return;cur=i;const s=SCENES[i];
document.getElementById('bookSceneNum').textContent='제 '+s.id+' 부 / 25';
document.getElementById('bookTitle').textContent=s.title;
document.getElementById('bookQuote').textContent='"'+s.quote+'"';
document.getElementById('bookText').textContent=s.text;
document.getElementById('bookPageIndicator').textContent=s.id+' / 25 쪽';
document.getElementById('sceneSlider').value=s.id;synth.cancel();speaking=false;window.scrollTo(0,0);}
function prevScene(){if(cur>0)render(cur-1);}
function nextScene(){if(cur<SCENES.length-1)render(cur+1);}
function onSliderChange(v){render(parseInt(v)-1);}
function buildGallery(){const c=document.getElementById('galleryView');c.innerHTML='';
SCENES.forEach(s=>{const d=document.createElement('div');d.className='gallery-card';
d.innerHTML='<div style="color:#c28b38;font-weight:700"></div><h2 class="gallery-title"></h2><div class="gallery-quote"></div><p class="gallery-text"></p>';
d.firstChild.textContent='제 '+s.id+' 부';d.querySelector('.gallery-title').textContent=s.title;
d.querySelector('.gallery-quote').textContent='"'+s.quote+'"';d.querySelector('.gallery-text').textContent=s.text;c.appendChild(d);});}
function toggleTtsCurrent(){if(speaking){synth.cancel();speaking=false;}else{
const u=new SpeechSynthesisUtterance(SCENES[cur].title+'. '+SCENES[cur].text);
u.lang='ko-KR';u.rate=.9;u.onend=()=>{speaking=false;};synth.speak(u);speaking=true;}}
let ac=null,playing=false,mt=null;
function toggleMusic(){if(playing){playing=false;clearTimeout(mt);document.getElementById('btnMusic').classList.remove('active');}
else{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
playing=true;document.getElementById('btnMusic').classList.add('active');
const n=[523.25,587.33,659.25,783.99,880,1046.5];let k=0;
(function play(){if(!playing)return;const o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(n[k++%n.length],ac.currentTime);
